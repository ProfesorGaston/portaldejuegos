<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--azul:#124a8c;--azul2:#2d7fd0;--verde:#2a9a3c;--verde2:#6fdc7e;--amarillo:#ffc93c;--texto:#12283f;--rojo:#c93a2d}
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;min-height:100vh;padding:8px 8px 36px;
 background:radial-gradient(900px 480px at 12% -100px,#5aa8ee88,transparent 65%),radial-gradient(720px 390px at 100% 8%,#ffd9a04d,transparent 62%),radial-gradient(1000px 540px at 50% 118%,#46c85a4d,transparent 66%),linear-gradient(180deg,#0d2f57 0%,#124a8c 44%,#0d3a2c 100%);background-attachment:fixed}
body::before{content:'';position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:0;pointer-events:none;opacity:.58;
 background:radial-gradient(ellipse 55% 92% at 6% 116%,#2b7f48 0 57%,transparent 59%),radial-gradient(ellipse 48% 82% at 51% 122%,#1f6a3b 0 57%,transparent 59%),radial-gradient(ellipse 53% 90% at 97% 114%,#2f8a4c 0 57%,transparent 59%)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
 background-image:radial-gradient(circle,#fff 1.2px,transparent 1.6px),radial-gradient(circle,#ffe9a0 1px,transparent 1.5px);background-size:137px 113px,211px 173px;background-position:12px 18px,71px 44px}
.wrap{position:relative;z-index:1;max-width:1020px;margin:auto}
/* HUD */
.hud{position:sticky;top:6px;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(#3b95e6,var(--azul));border:2px solid #9fd2ff;border-radius:16px;padding:8px 12px;box-shadow:0 5px 16px #0007}
.hud .titulo{font-weight:900;margin-right:auto;font-size:17px}

.pill.pop{animation:pop .45s}
@keyframes pop{35%{transform:scale(1.14)}}
.gain{position:absolute;right:8px;top:-13px;color:var(--amarillo);font-size:14px;text-shadow:0 1px 2px #000;animation:sube 1.1s forwards}
@keyframes sube{to{transform:translateY(-17px);opacity:0}}
.diamante{display:inline-block;width:17px;height:26px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);vertical-align:middle;background:#46e060;animation:flota 1.7s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-3px) rotate(7deg)}}
.barra{display:inline-block;width:72px;height:10px;background:#06203f;border:1px solid #9fd2ff;border-radius:99px;vertical-align:middle;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--verde2));transition:width .5s}
/* Pantallas */
.card{background:#fff;color:var(--texto);border-radius:18px;padding:20px;margin-top:12px;box-shadow:0 8px 24px #0007}
.card h1{margin:0 0 8px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero svg{flex:0 0 auto;filter:drop-shadow(0 7px 8px #0003)}
.nivchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nivchip{flex:1;min-width:150px;background:#eef5ff;border:2px solid #bcd9f7;border-radius:14px;padding:10px;text-align:center}
.nivchip .ic{font-size:25px}.nivchip b{display:block;margin-top:2px}
.game{display:grid;grid-template-columns:minmax(0,1.52fr) minmax(295px,.9fr);gap:11px;margin-top:11px;align-items:start}
@media(max-width:860px){.game{grid-template-columns:1fr}}
.scene{border-radius:18px;overflow:hidden;border:2px solid #9fd2ff;box-shadow:0 7px 20px #0008;background:#6ec6ff}
.scene.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.lvl{background:#0a2a52;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dots{letter-spacing:3px}
.prog{height:6px;background:#071e3c}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--azul2),var(--verde2));transition:width .5s}
.think{position:relative;background:#fff;color:var(--texto);padding:11px 12px;font-size:18px;display:flex;gap:10px;align-items:center}
.think::after{content:'';position:absolute;left:52px;bottom:-7px;width:15px;height:15px;background:#fff;transform:rotate(45deg)}
.avatar{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;border:2px solid #0002;box-shadow:0 2px 6px #0004}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background:#6ec6ff}
.panel{background:linear-gradient(#3b95e6,var(--azul));border:2px solid #9fd2ff;border-radius:18px;padding:13px;box-shadow:0 7px 20px #0006}
.obj{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;background:#fff;color:var(--azul);border-radius:999px;padding:6px 11px;font-weight:900;font-size:14.5px;box-shadow:0 2px 5px #0004}
.chip.actual{background:#0a2a52;color:#fff}
.inst{margin:9px 0 0;font-weight:800;line-height:1.35}
.ayuda{font-size:13.5px;opacity:.92;margin-top:7px;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.btn{font:inherit;font-weight:800;border:2px solid #ffffff88;border-radius:13px;padding:10px 14px;background:linear-gradient(#5aa8ee,#1f68b8);color:#fff;min-height:48px;cursor:pointer;box-shadow:0 3px 0 #0005;transition:transform .08s,filter .15s,box-shadow .08s}
.btn:hover{filter:brightness(1.13)}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:linear-gradient(var(--verde2),var(--verde))}
.btn.ghost{background:#0a2a52bb}.btn.small{min-height:43px;padding:8px 12px}
.btn.big{flex:1}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
:focus-visible{outline:4px solid var(--amarillo);outline-offset:2px}
.ctl{display:flex;align-items:center;gap:5px;background:#0a2a52;border-radius:13px;padding:4px 8px;font-weight:800;box-shadow:inset 0 1px 0 #fff3}
.ctl .btn{min-height:43px;padding:4px 15px;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
.ctl .val{min-width:55px;text-align:center}
.formulas{background:#fff;color:var(--texto);border-radius:11px;padding:8px 11px;margin-top:10px;text-align:center;line-height:1.45}
#msg{display:none;margin-top:10px;padding:11px 12px;border-radius:12px;color:var(--texto);line-height:1.4;border-left:7px solid #999;animation:entra .2s}
@keyframes entra{from{transform:translateY(4px);opacity:.3}}
#msg.ok{display:block;background:#dcf8dc;border-color:var(--verde)}
#msg.no{display:block;background:#ffe3e0;border-color:var(--rojo)}
#msg.info{display:block;background:#e3efff;border-color:var(--azul2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.opts .btn{font-size:19px;min-height:58px}
.opts .btn .num{opacity:.7;font-size:14px;margin-right:4px}
.opts .btn.good{background:linear-gradient(var(--verde2),var(--verde))!important}
.opts .btn.bad{background:linear-gradient(#ff9a7a,#cf4a2e)!important;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:13px}
.stat{background:#eef5ff;border:2px solid #bcd9f7;border-radius:15px;padding:13px;text-align:center}
.stat .n{font-size:27px;font-weight:900;color:var(--azul)}
@media(max-width:520px){.opts{grid-template-columns:1fr}.think{font-size:16px}.hud .titulo{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mark{position:fixed;right:8px;bottom:5px;font-size:12px;opacity:.75}
</style></head><body>
<div class="wrap">
 <header class="hud">
  <span class="titulo">🏠 Mi Casa Matemática</span>
  <span class="pill"><span class="diamante" id="moodDiamond"></span> <span class="barra"><i id="moodFill" style="width:70%"></i></span> <span id="moodText">70%</span></span>
  <span class="pill" id="score">§ 0</span>
 </header>
 <main id="app"></main>
</div>

<script>
'use strict';
/* Mi Casa Matemática · Solo misiones. Área y perímetro de rectángulos. */
const COLS=12,ROWS=8,RONDAS=4,PISO=6,ZOC=4;
const LW=640,LH=420,TW=56,TH=28,WH=64,OX=264,OY=82;
const REDUCIDO=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const NIVELES=[
 {n:'Nivel 1 · El piso',ic:'☀️',c:'Hacé el área pedida.'},
 {n:'Nivel 2 · El zócalo',ic:'🌇',c:'Usá todo el zócalo pedido.'},
 {n:'Nivel 3 · Las dos medidas',ic:'🌙',c:'Cumplí área y perímetro.'}];
const SIMS=[
 ['Lola','#e0577a','#a0522d','#f2c9a0',2],['Mateo','#3e9e6e','#222222','#c68642',0],['Sofi','#f0b030','#e8c040','#ffe0bd',2],
 ['Tomás','#6a5acd','#5a3b1e','#f2c9a0',1],['Abu Rosa','#c06ac0','#dddddd','#e8b48c',2],['Nico','#e07030','#3a2a1a','#8d5524',0]];
const ROOMS=[
 ['un dormitorio',[[.2,.2,1.6,1,.45,'#5b84d6','cama'],[1.9,.2,.5,.5,.4,'#9a6a3a','mesa'],[2,.95,.55,1.15,.95,'#7a5230','ropero']],{muro:'#ded3ff',panel:'#b9a8e8',piso:['#d9a867','#c99558','#e2b276'],tipo:'madera',acento:'#e0577a',alfombra:'#6f7fd9'}],
 ['una cocina',[[.1,.1,2,.6,.6,'#aab4c0','mesada'],[2.1,.1,.8,.6,.6,'#333a44','cocina'],[1,1.5,.8,.8,.45,'#b0723a','mesa'],[.1,1.15,.62,.62,1.18,'#e8eef4','heladera']],{muro:'#d9f0df',panel:'#a8cbb3',piso:['#f1f4f4','#bcd3dd','#e5ecec'],tipo:'baldosa',acento:'#36a06f',alfombra:'#d96a5f'}],
 ['un living',[[.2,.3,1.8,.8,.5,'#c8505a','sofa'],[.2,.3,1.8,.25,.9,'#a33d44',''],[.7,1.7,.8,.6,.3,'#8a5a2b','mesa'],[2.2,.4,.3,.9,.55,'#333a44','tele']],{muro:'#ffe1bd',panel:'#d9a76f',piso:['#c68a4a','#b67a3d','#d09a5a'],tipo:'madera',acento:'#c8505a',alfombra:'#a33d44'}],
 ['un taller',[[.1,.1,1.8,.6,.55,'#a36b3a','mesa'],[2.3,.3,.5,.5,1.1,'#6b4a2b','ropero'],[1,1.4,.7,.7,.3,'#d9a030','caja'],[.25,1.35,.45,.45,.45,'#c0392b','caja']],{muro:'#e3e0c8',panel:'#9c9a7c',piso:['#a97b4b','#96693d','#b98958'],tipo:'madera',acento:'#d9a030',alfombra:'#6b7d4a'}],
 ['un estudio',[[.1,.2,1.6,.7,.5,'#7a5230','escritorio'],[1.9,.1,.5,1,1.2,'#5a3b1e','biblioteca'],[.5,1.3,.5,.5,.3,'#444444','mesa']],{muro:'#d7e8cd',panel:'#93ad83',piso:['#b57e4b','#a06d3d','#c08c57'],tipo:'madera',acento:'#7a3b4f',alfombra:'#7a3b4f'}],
 ['un gimnasio',[[.4,.4,1.6,1.2,.08,'#3fa66a','colchoneta'],[2.2,.3,.6,.4,.3,'#444444','pesas'],[.2,1.9,.5,.5,.25,'#c0392b','caja']],{muro:'#d5e9ff',panel:'#8fb1d9',piso:['#687887','#596977','#758392'],tipo:'goma',acento:'#3fa66a',alfombra:null}]];
const CIELO=[['#6ec6ff','#e8fbff'],['#ff8a5c','#ffd9a0'],['#0c1440','#3d3f86']];
const FONDO=[
 {alto:'#3fb2ff',horizonte:'#dcf8ff',lejano:'#8fc7e8',colina:'#91d483',pradera1:'#a5e37f',pradera2:'#63c45d',pradera3:'#319344',tierra:'#d9ba7e',agua:'#62c3e8'},
 {alto:'#ff7a4d',horizonte:'#ffd9a0',lejano:'#b9788f',colina:'#b98968',pradera1:'#bcb06a',pradera2:'#7fa653',pradera3:'#477a3c',tierra:'#d2a66f',agua:'#7ba7c9'},
 {alto:'#071033',horizonte:'#27336e',lejano:'#202b5c',colina:'#213d38',pradera1:'#2f7046',pradera2:'#245c39',pradera3:'#173f2a',tierra:'#8a6b48',agua:'#315f9e'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const choice=a=>a[rnd(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('es-AR');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Matemática ---------- */
function medir(w,h){let a=0,p=0;const fuera=(i,j)=>i<0||j<0||i>=w||j>=h;
 for(let i=0;i<w;i++)for(let j=0;j<h;j++){a++;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>{if(fuera(i+x,j+y))p++})}
 return{a,p}}
function crearMision(n){const w=rnd(2,8),h=rnd(2,6);
 return{n,sim:choice(SIMS),room:choice(ROOMS),reqA:n!==1?w*h:null,reqP:n!==0?2*(w+h):null,sol:{w,h}}}
function opciones(correcto,errores){const s=[{v:correcto,ok:1}];
 errores.forEach(e=>{if(e.v>0&&!s.some(x=>x.v===e.v))s.push(e)});
 const saltos=[2,-2,4,-4,1,-1,6,-6,10,-10,20,-20];let i=0;
 while(s.length<4&&i<saltos.length){const v=correcto+saltos[i++];if(v>0&&!s.some(x=>x.v===v))s.push({v})}
 let k=3;while(s.length<4){const v=correcto+k++;if(!s.some(x=>x.v===v))s.push({v})}
 return shuffle(s.slice(0,4))}
function preguntaFinal(p,w,h){const m=medir(w,h),A=m.a,P=m.p,base=`Mide ${w} m × ${h} m. `;
 if(p.n===0)return{tipo:'perimetro',t:base+'¿Cuánto zócalo necesita?',u:'m',o:opciones(P,[{v:w+h,tag:'mitad'},{v:A,tag:'conf'}]),e:`Perímetro: ${w}+${h}+${w}+${h} = ${P} m.`};
 if(p.n===1)return{tipo:'area',t:base+'¿Cuánto piso necesita?',u:'m²',o:opciones(A,[{v:P,tag:'conf'},{v:w+h,tag:'suma'}]),e:`Área: ${w} × ${h} = ${A} m².`};
 const costo=PISO*A+ZOC*P;
 return{tipo:'costo',t:base+`Piso §${PISO}/m². Zócalo §${ZOC}/m. ¿Costo total?`,u:'§',
  o:opciones(costo,[{v:PISO*A,tag:'solo'},{v:ZOC*P,tag:'solo'},{v:PISO*P+ZOC*A,tag:'cruz'}]),
  e:`Piso §${fmt(PISO*A)} + zócalo §${fmt(ZOC*P)} = §${fmt(costo)}.`}}
function pedido(p){const r=p.room[0];
 if(p.n===0)return `Quiero ${r} de <b>${p.reqA} m²</b>.`;
 if(p.n===1)return `Tengo <b>${p.reqP} m de zócalo</b> para ${r}.`;
 return `Quiero ${r} de <b>${p.reqA} m²</b> y <b>${p.reqP} m de zócalo</b>.`}

/* ---------- Dibujo ---------- */
const P=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z];
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function poly(c,pts,relleno,borde,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
 if(relleno){c.fillStyle=relleno;c.fill()}if(borde){c.strokeStyle=borde;c.lineWidth=lw||1.2;c.stroke()}}
function sombra(hex,a){const n=parseInt(hex.slice(1),16),f=v=>clamp(v+a,0,255);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function caja(c,x,y,w,d,h,col){poly(c,[P(x,y+d),P(x+w,y+d),P(x+w,y+d,h),P(x,y+d,h)],sombra(col,-25),'#0004');
 poly(c,[P(x+w,y),P(x+w,y+d),P(x+w,y+d,h),P(x+w,y,h)],sombra(col,-55),'#0004');
 poly(c,[P(x,y,h),P(x+w,y,h),P(x+w,y+d,h),P(x,y+d,h)],sombra(col,18),'#0004');
 c.strokeStyle='#00000020';c.lineWidth=1;c.beginPath();
 let a=P(x,y+d,h*.52),b=P(x+w,y+d,h*.52);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
 a=P(x+w,y,h*.52);b=P(x+w,y+d,h*.52);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
 poly(c,[P(x+w*.07,y+d*.08,h),P(x+w*.93,y+d*.08,h),P(x+w*.93,y+d*.92,h),P(x+w*.07,y+d*.92,h)],'#ffffff14',null)}
function capa(c,x,y,w,d,z,esp,col){poly(c,[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+esp),P(x,y+d,z+esp)],sombra(col,-25),'#0003');
 poly(c,[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+esp),P(x+w,y,z+esp)],sombra(col,-48),'#0003');
 poly(c,[P(x,y,z+esp),P(x+w,y,z+esp),P(x+w,y+d,z+esp),P(x,y+d,z+esp)],sombra(col,16),'#0003')}
function etiqueta(c,t,x,y){c.font='bold 15px Trebuchet MS';const w=c.measureText(t).width+15;
 c.save();c.shadowColor='#0006';c.shadowBlur=5;c.fillStyle='#ffffffef';rr(c,x-w/2,y-12,w,24,8);c.fill();c.restore();
 c.fillStyle='#124a8c';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y+1);c.textBaseline='alphabetic'}
const semilla=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)};
function lineaIso(c,pts,color,lw){c.strokeStyle=color;c.lineWidth=lw||1;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
function dibujarPisoCelda(c,gx,gy,estilo,built){const pts=[P(gx,gy),P(gx+1,gy),P(gx+1,gy+1),P(gx,gy+1)],sd=semilla(gx,gy);
 if(!built){poly(c,pts,'rgba(55,140,255,.48)','#ffffffaa',1.2);
  lineaIso(c,[P(gx+.12,gy+.78),P(gx+.78,gy+.12)],'#ffffff44',1);
  lineaIso(c,[P(gx+.38,gy+.5),P(gx+.62,gy+.5)],'#ffffff55',1);return}
 if(estilo.tipo==='baldosa'){poly(c,pts,(gx+gy)%2?estilo.piso[0]:estilo.piso[1],'#7e929b',1.1);
  poly(c,[P(gx+.07,gy+.07),P(gx+.93,gy+.07),P(gx+.93,gy+.93),P(gx+.07,gy+.93)],(gx+gy)%2?'#ffffff22':'#ffffff30',null);
  lineaIso(c,[P(gx+.5,gy+.06),P(gx+.5,gy+.94)],'#7e929b99',1);lineaIso(c,[P(gx+.06,gy+.5),P(gx+.94,gy+.5)],'#7e929b99',1);
  [[.25,.25],[.72,.3],[.3,.74],[.76,.72]].forEach(([a,b],k)=>{if(semilla(gx*4+k,gy)>.45){const q=P(gx+a,gy+b);c.fillStyle='#7e929b55';c.beginPath();c.arc(q[0],q[1],1.4,0,7);c.fill()}});return}
 if(estilo.tipo==='goma'){poly(c,pts,(gx+gy)%2?estilo.piso[0]:estilo.piso[1],'#36424c',1.2);

 else if(p.sim[4]===2){c.beginPath();c.arc(q[0],base-48,9.5,Math.PI,0);c.fill();c.beginPath();c.arc(q[0]+8,base-53,4.3,0,7);c.fill();c.fillRect(q[0]-11,base-50,4,14);c.fillRect(q[0]+7,base-50,4,14)}
 else{c.beginPath();c.arc(q[0],base-47,9.5,Math.PI,0);c.fill()}
 c.fillStyle='#222';c.beginPath();c.arc(q[0]-3.5,base-44,1.3,0,7);c.arc(q[0]+3.5,base-44,1.3,0,7);c.fill();
 c.strokeStyle='#222';c.lineWidth=1.6;c.beginPath();
 if(reacc==='no'||S.mood<34)c.arc(q[0],base-35.5,3.4,Math.PI*1.15,Math.PI*1.85);else c.arc(q[0],base-39.5,3.7,Math.PI*.12,Math.PI*.88);c.stroke();
 const pc=S.mood>66?'#46e060':S.mood>33?'#f0c020':'#e05040',py=base-73+(REDUCIDO?0:Math.sin(t/300)*2),giro=REDUCIDO?1:Math.abs(Math.cos(t/420))*.62+.38;
 c.save();c.shadowColor=pc;c.shadowBlur=14;poly(c,[[q[0],py-13],[q[0]+9*giro,py],[q[0],py+13],[q[0]-9*giro,py]],pc,'#ffffffaa',1.5);c.restore()}

/* ---------- Juego ---------- */
function hud(ganancia){const mood=S?S.mood:70;
 $('moodFill').style.width=mood+'%';$('moodText').textContent=mood+'%';
 $('moodDiamond').style.background=mood>66?'#46e060':mood>33?'#f0c020':'#e05040';
 const sc=$('score');sc.innerHTML='§ '+fmt(S?S.score:0)+(ganancia?`<span class="gain">+§${ganancia}</span>`:'');
 if(ganancia){sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop')}}
function inicio(){S={n:0,r:0,score:0,mood:70,p:null,fase:'inicio',built:false,sinErrorBuild:0,sinErrorCalc:0,conf:0};
 cv=null;sel=null;historial=[];particulas=[];
 $('app').innerHTML=`<div class="card"><div class="hero">
  <svg width="128" height="106" viewBox="0 0 128 106" aria-hidden="true"><polygon points="64,3 77,19 64,35 51,19" fill="#46e060" stroke="#2a9a3c" stroke-width="2"/><polygon points="12,59 64,30 116,59" fill="#a33d44"/><rect x="23" y="57" width="82" height="42" rx="3" fill="#f4e6cc" stroke="#cdb088" stroke-width="2"/><rect x="56" y="73" width="17" height="26" fill="#8a5a2b"/><rect x="31" y="65" width="15" height="14" fill="#bfe6ff" stroke="#fff" stroke-width="2"/><rect x="82" y="65" width="15" height="14" fill="#bfe6ff" stroke="#fff" stroke-width="2"/><rect x="10" y="99" width="108" height="5" rx="2" fill="#6fc250"/></svg>
  <div style="flex:1;min-width:230px"><h1>🏠 Mi Casa Matemática</h1>
  <p style="font-size:18px;margin:4px 0">Construí la habitación que pide cada vecino.</p>
  <p style="margin:4px 0">Arrastrá. Construí. Respondé.</p></div></div>
 <div class="formulas">🟫 <b>Área = ancho × largo</b> &nbsp;·&nbsp; 📏 <b>Perímetro = 2 × (ancho + largo)</b></div>
 <div class="nivchips">${NIVELES.map((n,i)=>`<div class="nivchip"><span class="ic">${n.ic}</span><b>Nivel ${i+1}</b>${n.c}</div>`).join('')}</div>
 <button class="btn g" id="go" style="width:100%;margin-top:14px;font-size:19px">🔨 Empezar misiones</button>
 <p style="text-align:center;opacity:.75;margin-bottom:0">12 misiones · 3 niveles</p></div>`;
 $('go').onclick=ronda;hud()}
function ronda(){S.p=crearMision(S.n);S.fase='build';S.built=false;S.builtAt=0;S.err=0;S.errCalc=0;S.anim=null;S.reaction='';S.reactionUntil=0;
 sel={x:1,y:1,w:1,h:1};simp={x:11.2,y:7.3};drag=null;hover=null;historial=[];particulas=[];
 const p=S.p,total=S.n*RONDAS+S.r+1,dots=Array.from({length:RONDAS},(_,i)=>i<S.r?'🏠':i===S.r?'🏗️':'⬜').join('');
 const pedidos=[p.reqA!==null?`<span class="chip">🟫 ${p.reqA} m²</span>`:'',p.reqP!==null?`<span class="chip">📏 ${p.reqP} m</span>`:''].join('');
 $('app').innerHTML=`<div class="game">
 <div class="scene" id="scene">
  <div class="lvl"><span>${NIVELES[S.n].ic} ${NIVELES[S.n].n}</span><span class="dots">${dots}</span><span>Misión ${total}/12</span></div>
  <div class="prog"><i style="width:${(total-1)/12*100}%"></i></div>
  <div class="think"><span class="avatar" style="background:${p.sim[1]}">${p.sim[0][0]}</span><span>💭 <b>${p.sim[0]}:</b> ${pedido(p)}</span></div>
  <canvas id="cv" width="1280" height="840" tabindex="0"></canvas></div>
 <div class="panel">
  <div class="obj">${pedidos}<span class="chip actual">Tu forma: <span id="formaTxt">1 × 1 m</span></span></div>
  <p class="inst">${NIVELES[S.n].c}${S.n===2?`<br>Piso §${PISO}/m² · Zócalo §${ZOC}/m.`:''}</p>
  <div id="controles">
   <div class="row">
    <div class="ctl">Ancho <button class="btn" data-k="w-" aria-label="Achicar ancho">−</button><span class="val" id="valW">1 m</span><button class="btn" data-k="w+" aria-label="Agrandar ancho">+</button></div>
    <div class="ctl">Largo <button class="btn" data-k="h-" aria-label="Achicar largo">−</button><span class="val" id="valH">1 m</span><button class="btn" data-k="h+" aria-label="Agrandar largo">+</button></div></div>
   <div class="row"><button class="btn small ghost" id="girarBtn">🔄 Girar</button><button class="btn small ghost" id="undoBtn" disabled>↩️ Deshacer</button></div>
   <div class="ayuda">Arrastrá el pasto para dibujar. Adentro mueve. La bolita ↘ estira.<br>Flechas: tamaño · Mayús + flechas: mover · R: girar.</div>
   <div class="row"><button class="btn g big" id="bt" style="font-size:18px">🔨 Construir</button></div></div>
  <div class="formulas">🟫 Área = ancho × largo<br>📏 Perímetro = 2 × (ancho + largo)</div>
  <div id="msg" role="status" aria-live="polite"></div><div id="q"></div></div></div>`;
 cv=$('cv');
 cv.onpointerdown=e=>{if(S.fase!=='build')return;try{cv.setPointerCapture(e.pointerId)}catch(err){}try{cv.focus({preventScroll:true})}catch(err){}
  const pt=punto(e),esquina=P(sel.x+sel.w,sel.y+sel.h),dist=Math.hypot(pt.lx-esquina[0],pt.ly-esquina[1]);
  const adentro=pt.cx>=sel.x&&pt.cx<sel.x+sel.w&&pt.cy>=sel.y&&pt.cy<sel.y+sel.h,inicioSel={...sel};
  if(dist<(e.pointerType==='touch'?30:20))drag={tipo:'tam',inicio:inicioSel};
  else if(adentro)drag={tipo:'mover',dx:pt.cx-sel.x,dy:pt.cy-sel.y,inicio:inicioSel};
  else{drag={tipo:'nuevo',ax:pt.cx,ay:pt.cy,inicio:inicioSel};sel={x:pt.cx,y:pt.cy,w:1,h:1}}
  if(drag.tipo==='tam')moverDrag(e);sync()};
 cv.onpointermove=e=>{const pt=punto(e);hover=[pt.cx,pt.cy];if(drag)moverDrag(e)};
 cv.onpointerup=terminarDrag;cv.onpointercancel=terminarDrag;cv.onpointerleave=()=>hover=null;
 cv.onkeydown=e=>{if(S.fase!=='build')return;const flechas={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};
  if(flechas[e.key]){e.preventDefault();const[dx,dy]=flechas[e.key];
   if(e.shiftKey)moverSel(dx,dy);else cambiar(dx?'w'+(dx>0?'+':'-'):'h'+(dy>0?'+':'-'))}
  else if(e.key.toLowerCase()==='r'){e.preventDefault();girar()}
  else if(e.key==='Enter'){e.preventDefault();construir()}};
 document.querySelectorAll('[data-k]').forEach(bindStepper);
 $('girarBtn').onclick=girar;$('undoBtn').onclick=deshacer;$('bt').onclick=construir;
 sync();hud()}
function bindStepper(b){let espera=null,rep=null,suprimir=false;
 const parar=()=>{clearTimeout(espera);clearInterval(rep);espera=rep=null;setTimeout(()=>suprimir=false,60)};
 b.addEventListener('pointerdown',()=>{suprimir=true;cambiar(b.dataset.k);clearTimeout(espera);espera=setTimeout(()=>rep=setInterval(()=>cambiar(b.dataset.k),95),380)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,parar));
 b.addEventListener('click',()=>{if(!suprimir)cambiar(b.dataset.k)})}
function punto(e){const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)*LW/r.width,ly=(e.clientY-r.top)*LH/r.height;
 const dx=(lx-OX)/(TW/2),dy=(ly-OY)/(TH/2);
 return{lx,ly,cx:clamp(Math.floor((dx+dy)/2),0,COLS-1),cy:clamp(Math.floor((dy-dx)/2),0,ROWS-1)}}
function celda(e){const p=punto(e);return[p.cx,p.cy]}
function registrar(viejo){if(JSON.stringify(viejo)!==JSON.stringify(sel)){historial.push(viejo);if(historial.length>35)historial.shift()}}
function moverDrag(e){if(S.fase!=='build'||!drag)return;const pt=punto(e);
 if(drag.tipo==='mover'){sel.x=clamp(pt.cx-drag.dx,0,COLS-sel.w);sel.y=clamp(pt.cy-drag.dy,0,ROWS-sel.h)}
 else if(drag.tipo==='tam'){sel.w=clamp(pt.cx-sel.x+1,1,COLS-sel.x);sel.h=clamp(pt.cy-sel.y+1,1,ROWS-sel.y)}
 else sel={x:Math.min(pt.cx,drag.ax),y:Math.min(pt.cy,drag.ay),w:Math.abs(pt.cx-drag.ax)+1,h:Math.abs(pt.cy-drag.ay)+1};sync()}
function terminarDrag(){if(drag)registrar(drag.inicio);drag=null;sync()}
function cambiar(k){if(S.fase!=='build')return;const viejo={...sel},d=k[1]==='+'?1:-1;
 if(k[0]==='w')sel.w=clamp(sel.w+d,1,COLS-sel.x);else sel.h=clamp(sel.h+d,1,ROWS-sel.y);registrar(viejo);sync()}
function moverSel(dx,dy){if(S.fase!=='build')return;const viejo={...sel};
 sel.x=clamp(sel.x+dx,0,COLS-sel.w);sel.y=clamp(sel.y+dy,0,ROWS-sel.h);registrar(viejo);sync()}
function girar(){if(S.fase!=='build'||sel.w===sel.h)return;
 if(sel.x+sel.h>COLS||sel.y+sel.w>ROWS){msg('No entra girada ahí. Movela un poco.','info');return}
 const viejo={...sel};[sel.w,sel.h]=[sel.h,sel.w];registrar(viejo);sync()}
function deshacer(){if(S.fase!=='build'||!historial.length)return;sel=historial.pop();sync()}
function sync(){if(!sel)return;const set=(id,t)=>{const e=$(id);if(e)e.textContent=t};
 set('valW',sel.w+' m');set('valH',sel.h+' m');set('formaTxt',`${sel.w} × ${sel.h} m`);
 const u=$('undoBtn'),g=$('girarBtn');if(u)u.disabled=!historial.length;if(g)g.disabled=sel.w===sel.h;
 if(cv)cv.setAttribute('aria-label',`Terreno. Rectángulo de ${sel.w} por ${sel.h} metros. Flechas cambian el tamaño. Mayús más flechas lo mueve. Enter construye.`)}
function msg(t,c){const m=$('msg');if(m){m.className=c;m.innerHTML=t}}
function reaccionar(tipo){S.reaction=tipo;S.reactionUntil=performance.now()+1500}
function construir(){if(S.fase!=='build')return;const p=S.p,m=medir(sel.w,sel.h),errores=[],malA=p.reqA!==null&&m.a!==p.reqA,malP=p.reqP!==null&&m.p!==p.reqP;
 if(malA)errores.push(`Tu piso: ${m.a} m². Pedido: ${p.reqA} m².`);
 if(malP)errores.push(`Tu borde: ${m.p} m. Pedido: ${p.reqP} m.`);
 if(errores.length){S.err++;S.mood=Math.max(0,S.mood-6);reaccionar('no');
  S.anim={tipo:malA?'a':'p',inicio:performance.now()};msg('🤔 '+errores.join(' '),'no');
  const sc=$('scene');if(sc&&!REDUCIDO){sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')}
  hud();return}
 if(S.err===0)S.sinErrorBuild++;
 S.fase='ask';S.built=true;S.builtAt=performance.now();S.anim=null;reaccionar('ok');lanzarPolvo(24);
 S.q=preguntaFinal(p,sel.w,sel.h);msg('✅ ¡Bien! Una cuenta más.','ok');$('controles').style.display='none';
 $('q').innerHTML=`<p style="font-size:18px;margin:10px 0 0"><b>${S.q.t}</b></p>
 <div class="opts">${S.q.o.map((o,i)=>`<button class="btn" data-i="${i}"><span class="num">${i+1}.</span>${fmt(o.v)} ${S.q.u}</button>`).join('')}</div>`;
 document.querySelectorAll('#q [data-i]').forEach(b=>b.onclick=()=>responder(+b.dataset.i,b));hud()}
function responder(i,boton){if(S.fase!=='ask')return;const o=S.q.o[i];
 if(!o.ok){S.err++;S.errCalc++;S.mood=Math.max(0,S.mood-6);boton.disabled=true;boton.classList.add('bad');reaccionar('no');
  if(o.tag==='conf'){S.conf++;msg(S.q.tipo==='perimetro'?'❌ Eso es el área. Buscá el borde.':'❌ Eso es el perímetro. Buscá la superficie.','no')}
  else if(o.tag==='mitad')msg('❌ Contá los 4 lados.','no');
  else if(o.tag==='suma')msg('❌ El piso se multiplica: ancho × largo.','no');
  else if(o.tag==='solo')msg('❌ Sumá piso y zócalo.','no');
  else if(o.tag==='cruz')msg('❌ El piso va por m². El zócalo por m.','no');
  else msg('❌ Revisá la cuenta.','no');
  hud();return}
 S.fase='fin';if(S.errCalc===0)S.sinErrorCalc++;boton.classList.add('good');reaccionar('ok');lanzarPolvo(15);
 const g=S.err===0?100:50;S.score+=g;S.mood=Math.min(100,S.mood+10);
 msg(`🎉 ¡Bien! ${S.q.e} <b>+§${g}</b>`,'ok');
 document.querySelectorAll('#q [data-i]').forEach(b=>b.disabled=true);
 $('q').insertAdjacentHTML('beforeend','<div class="row"><button class="btn g big" id="nx">Siguiente ➜</button></div>');
 $('nx').onclick=siguiente;$('nx').focus();hud(g)}
function siguiente(){S.r++;if(S.r>=RONDAS){S.r=0;S.n++}
 if(S.n>=NIVELES.length)fin();else ronda()}
function fin(){cv=null;S.p=null;const cara=S.mood>66?'😄':S.mood>33?'🙂':'💪';
 $('app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:52px">🏆</div><h1>¡Barrio terminado!</h1>
 <p style="font-size:19px;margin:4px 0">Tus vecinos están así: ${cara}</p>
 <div class="stats">
  <div class="stat"><div class="n">§ ${fmt(S.score)}</div>Ganados</div>
  <div class="stat"><div class="n">${S.mood}%</div>Felicidad</div>
  <div class="stat"><div class="n">${S.sinErrorBuild}/12</div>Construcciones sin error</div>
  <div class="stat"><div class="n">${S.sinErrorCalc}/12</div>Cuentas sin error</div>
  <div class="stat"><div class="n">${S.conf}</div>Confusiones área/perímetro</div>
 </div>
 <button class="btn g" id="rj" style="width:100%;margin-top:14px;font-size:18px">🔨 Jugar de nuevo</button></div>`;
 $('rj').onclick=inicio;hud()}
function arrancar(){document.onkeydown=e=>{if(!S||S.fase!=='ask')return;const i=['1','2','3','4'].indexOf(e.key);
  if(i>=0){const b=document.querySelectorAll('#q [data-i]')[i];if(b&&!b.disabled)b.click()}};
 inicio();requestAnimationFrame(dibujar)}
if(typeof document!=='undefined'&&document.getElementById('app'))arrancar();
if(typeof module!=='undefined'&&module.exports)module.exports={medir,crearMision,preguntaFinal,opciones};
