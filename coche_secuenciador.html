<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coche Secuenciador - Prof. Gastón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe8ff;--bg2:#e6f7ff;--panel:#fff;--ink:#20304a;--muted:#5a6f87;--line:#c3dcee;--sun:#ffd23f;--sk1:#5cc0ff;--sk2:#cdf0ff;--hl:#7ed56f;--hl2:#58bd55;--cl:#fff;--road:#434a60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1829;--bg2:#15233b;--panel:#1b2c47;--ink:#eaf2ff;--muted:#9db3cf;--line:#2f4768;--sun:#eef0c8;--sk1:#0f1d44;--sk2:#2c4180;--hl:#2d7a4c;--hl2:#216642;--cl:#3f5488}}
:root[data-theme="dark"]{--bg:#0e1829;--bg2:#15233b;--panel:#1b2c47;--ink:#eaf2ff;--muted:#9db3cf;--line:#2f4768;--sun:#eef0c8;--sk1:#0f1d44;--sk2:#2c4180;--hl:#2d7a4c;--hl2:#216642;--cl:#3f5488}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg2),var(--bg)) fixed;color:var(--ink);font:600 17px/1.35 "Baloo 2","Trebuchet MS",system-ui,sans-serif}
[hidden]{display:none!important}
#h,#g{max-width:1000px;margin:0 auto;padding:14px;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{50%{transform:scale(1.05)}}
h1{margin:0}h2{font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
p{margin:4px 0;color:var(--muted)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@keyframes drop{from{transform:translateY(-120px) rotate(-12deg);opacity:0}}
.sun{position:absolute;right:9%;top:16px;width:64px;height:64px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,255,255,.25),0 0 0 22px rgba(255,255,255,.12);animation:pulse 4s ease-in-out infinite}
.cl{position:absolute;height:26px;width:84px;background:var(--cl);border-radius:99px;opacity:.9;animation:cloud 40s linear infinite}
.cl::before{content:"";position:absolute;left:14px;top:-14px;width:38px;height:38px;border-radius:50%;background:inherit}
.c1{top:30px;animation-delay:-8s}.c2{top:100px;animation-duration:55s;animation-delay:-30s}.c3{top:160px;animation-duration:70s;animation-delay:-45s;opacity:.6}
@keyframes cloud{from{left:-100px}to{left:100%}}
#g{max-width:1000px;padding:0;--fh:"Lilita One","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-family:"Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:#16294f}
#g button{font-family:inherit}
#g :focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#stage{display:grid;grid-template-columns:1fr;background:#80cfff}
@media(min-width:820px){#stage{grid-template-columns:1fr 330px;height:clamp(560px,100vh,660px)}}
#bc{position:relative;overflow:hidden;height:clamp(540px,140vw,700px)}
@media(min-width:820px){#bc{height:auto}}
#bc .cl{background:#fff;opacity:.95;z-index:1}
#hud{position:absolute;z-index:6;left:12px;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:auto}
.rb{position:relative;flex:none;width:48px;height:48px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;background:#16294f;box-shadow:inset 0 0 0 3px #dbe7fb,0 3px 0 rgba(10,20,50,.35);transition:transform .1s}
.rb:hover:not(:disabled){transform:scale(1.07)}.rb:active:not(:disabled){transform:scale(.94)}
.rb:disabled{opacity:.5;cursor:default}
.rb svg{width:26px;height:26px}
#lvl{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 6px;background:#fff;border:3px solid #16294f;border-radius:16px;box-shadow:0 3px 0 rgba(10,20,50,.3)}
#lv{background:#e03a3a;color:#fff;font:400 20px/1 var(--fh);border-radius:99px;padding:5px 12px 4px}
#ttl{font:400 22px/1 var(--fh)}
@media(max-width:819px){#ttl{font-size:18px}}
#sd{position:absolute;left:0;top:60px;display:flex;flex-direction:column;gap:10px}
@media(max-width:819px){#sd{position:static;flex-direction:row}}
#hn{position:absolute;right:-4px;bottom:-4px;background:#ffc928;color:#16294f;border-radius:99px;font-size:11px;min-width:18px;line-height:18px;text-align:center;font-weight:900;box-shadow:0 0 0 2px #16294f}
#snd .off-i{display:none}#snd.off .on-i{display:none}#snd.off .off-i{display:block}
#goals{flex:1 1 280px;max-width:350px;margin-left:auto;background:#fff;border:3px solid #16294f;border-radius:20px;padding:8px 12px;box-shadow:0 3px 0 rgba(10,20,50,.3)}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.gt{font-size:11.5px;line-height:1.1;color:#4a5b7e}
.gt svg{width:34px;height:34px;display:block;margin:0 auto 1px}
.gt path{fill:#5d6d92;stroke:#8e9bba;stroke-width:1.6;stroke-linejoin:round}
.gt.on{color:#e08a00}.gt.on path{fill:#ffc928;stroke:#f2a000}
.gt.on svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px}
#seg{position:relative;flex:1;display:flex;gap:4px}
#seg i{flex:1;height:14px;border-radius:5px;background:#fbd9d9;border:2px solid #f0a8a8;transition:background .2s}
#seg i.f{background:#1f7cf0;border-color:#1556b8}#seg i.o{background:#f59f1b;border-color:#c77800}
#seg em{position:absolute;top:-10px;font-style:normal;font-size:11px;color:#f2a000;transform:translateX(-50%);line-height:1}
.bar b{font:400 18px/1 var(--fh)}.bar small{font-size:12px;color:#5d6d92}
#bub{position:absolute;z-index:6;left:12px;bottom:12px;right:12px;max-width:330px;min-height:62px;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #16294f;border-radius:18px;padding:8px 12px 8px 8px;box-shadow:0 3px 0 rgba(10,20,50,.3)}
#bub .bi{flex:none;width:38px;height:38px;border-radius:50%;background:#16294f;display:grid;place-items:center}
#bub .bi svg{width:22px;height:22px}
#msg{font-size:14px;line-height:1.25}
#msg.bad{color:#9b1c1c}
#bub:has(.bad){background:#ffe8e8;border-color:#b02a2a}
#turn{position:absolute;z-index:6;right:12px;bottom:14px;background:#16294f;color:#fff;border-radius:99px;padding:7px 16px 6px;font:400 17px/1 var(--fh)}
@media(max-width:819px){#turn{bottom:84px}}
#bw{position:absolute;z-index:2;perspective:1600px}
#bw.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
#board{position:relative;--a:19deg;--ti:49deg;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--ti)) rotateZ(calc(var(--a)*-1));border-radius:4px;background:conic-gradient(#6dbb4f 25%,#5eaa43 0 50%,#6dbb4f 0 75%,#5eaa43 0) 0 0/calc(200%/var(--w)) calc(200%/var(--h))}
.sd{display:block;position:absolute;background:linear-gradient(#7bc65a 0 14%,#9a6638 14%)}
.sd.s{left:0;top:100%;width:100%;height:var(--d);transform-origin:50% 0;transform:rotateX(-90deg);filter:brightness(.8)}
.sd.w{left:0;top:0;width:var(--d);height:100%;transform-origin:0 50%;transform:rotateY(90deg);filter:brightness(.95)}
.t{position:absolute;transform-style:preserve-3d}
.road{background:#4b5266}
.kb{position:absolute;background:#d6d5ec}
.kb.n{top:0;left:0;right:0;height:12%}.kb.s{bottom:0;left:0;right:0;height:12%}.kb.w{left:0;top:0;bottom:0;width:12%}.kb.e{right:0;top:0;bottom:0;width:12%}
.ln{position:absolute;background:repeating-linear-gradient(90deg,#f2f2f8 0 7px,transparent 7px 14px)}
.ln.e,.ln.w{height:3px;top:calc(50% - 1.5px);width:50%}.ln.e{left:50%}.ln.w{left:0}
.ln.n,.ln.s{width:3px;left:calc(50% - 1.5px);height:50%;background:repeating-linear-gradient(0deg,#f2f2f8 0 7px,transparent 7px 14px)}
.ln.n{top:0}.ln.s{top:50%}
.zb{position:absolute;inset:12% 22%;background:repeating-linear-gradient(90deg,#f4f4fb 0 16.6%,transparent 16.6% 33.3%)}
.zb.v{inset:22% 12%;background:repeating-linear-gradient(0deg,#f4f4fb 0 16.6%,transparent 16.6% 33.3%)}
.flag{background:conic-gradient(#fff 25%,#1c2540 0 50%,#fff 0 75%,#1c2540 0) 0 0/50% 50%}
.fl{position:absolute;width:11%;height:11%;border-radius:50%;background:var(--fc);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.pk{position:absolute;inset:8%;display:grid;place-items:center;transform-style:preserve-3d}
.an{position:absolute;width:0;height:0;transform-style:preserve-3d}
.bb{position:absolute;left:0;bottom:0;display:block;pointer-events:none;transform-origin:50% 100%;transform:rotateZ(var(--a)) rotateX(calc(var(--ti)*-1))}
.bb svg{width:100%;height:100%;display:block;overflow:visible}
.tree{width:calc(var(--s)*.8);height:calc(var(--s)*.8);margin-left:calc(var(--s)*-.4)}
.hs{width:calc(var(--s)*.72);height:calc(var(--s)*.72);margin-left:calc(var(--s)*-.36)}
.bush{width:calc(var(--s)*.42);height:calc(var(--s)*.3);margin-left:calc(var(--s)*-.21)}
.tlt{width:calc(var(--s)*.3);height:calc(var(--s)*.62);margin-left:calc(var(--s)*-.15)}
.shp{width:calc(var(--s)*.55);height:calc(var(--s)*.55);margin-left:calc(var(--s)*-.275)}
.cn{width:calc(var(--s)*.46);height:calc(var(--s)*.46);margin-left:calc(var(--s)*-.23);margin-bottom:calc(var(--s)*.08)}
.fg{width:calc(var(--s)*.5);height:calc(var(--s)*.95);margin-left:calc(var(--s)*-.05)}
.wv{transform-origin:5px 10px;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-8deg) scaleX(.92)}to{transform:skewY(8deg)}}
.coin .bb svg{animation:spin 1.6s ease-in-out infinite}
@keyframes spin{50%{transform:scaleX(.2)}}
.coin.got .bb svg{animation:cg .5s forwards}
@keyframes cg{to{transform:translateY(-30px) scale(1.6);opacity:0}}
.r{fill:#5a2a2e;transition:fill .2s}.g{fill:#2fd37a;transition:fill .2s}
.on .r{fill:#ff4d4d;filter:drop-shadow(0 0 3px #ff4d4d)}.on .g{fill:#1c5a3a}
.hz.A .bb{opacity:.15;transition:opacity .25s}
.hz.A.on .bb{opacity:1}
.hz.A.on .bb svg{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px) rotate(6deg)}}
#car{position:absolute;display:grid;place-items:center;pointer-events:none;transform-style:preserve-3d;transition:left var(--t,.4s) linear,top var(--t,.4s) linear}
.v3{position:relative;width:84%;height:84%;transform-style:preserve-3d;--z:calc(var(--s)*.028);transition:transform calc(var(--t,.4s)*.9) cubic-bezier(.3,1.5,.5,1)}
.v3 i{position:absolute;display:block}
.v3 .cs{left:6%;top:-2%;width:88%;height:104%;border-radius:30%;background:rgba(0,0,0,.38);filter:blur(calc(var(--s)*.05))}
.v3 .cw{left:4%;width:92%;height:21%;border-radius:30%;background:#1b1f2a}
.v3 .cb{left:18%;top:2%;width:64%;height:96%;border-radius:32%/22%}
.v3 .cg{left:24%;top:28%;width:52%;height:44%;border-radius:28%}
.v3 .cr{left:28%;top:35%;width:44%;height:30%;border-radius:24%;display:grid!important;place-items:center;font:800 calc(var(--s)*.16)/1 sans-serif;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.v3 .hl{top:4%;width:15%;height:5%;border-radius:40%;background:#fff6a8;box-shadow:0 0 6px #fff6a8}
.v3 .tl{top:91%;width:15%;height:4%;border-radius:40%;background:#ff4d4d}
.v3 .bm{left:20%;top:-42%;width:60%;height:44%;background:linear-gradient(to top,rgba(255,246,168,.85),transparent);clip-path:polygon(15% 100%,0 0,100% 0,85% 100%)}
.v3 .bp{left:20%;width:60%;height:5%;border-radius:40%;background:#2a2f3d}
.v3 .mr{top:38%;width:9%;height:8%;border-radius:40%;filter:brightness(.8)}
.v3 .rm{width:8%;height:13%;border-radius:50%;background:#cfd6e2}
.v3 .st{left:44%;top:3%;width:12%;height:94%;background:rgba(255,255,255,.85)}
.v3 .lt{left:30%;top:42%;width:40%;height:10%;border-radius:30%;box-shadow:0 0 6px rgba(255,255,255,.7);animation:bl .5s steps(2) infinite}
.v3 .ld{left:44%;top:18%;width:12%;height:64%;background:repeating-linear-gradient(0deg,#e3e7ee 0 3px,#8a93a3 3px 5px)}
.v3 .sp{left:22%;top:92%;width:56%;height:6%;border-radius:20%;filter:brightness(.7)}
.v3 .bx{left:22%;top:46%;width:56%;height:46%;border-radius:12%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5)}
@keyframes bl{50%{filter:hue-rotate(180deg) brightness(1.2)}}
.bm{opacity:0;transition:opacity .3s}.run .bm{opacity:.45}
.nt,.nt .v3{transition:none!important}
.pt{position:absolute;border-radius:50%;pointer-events:none;animation:pt .65s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#pg{margin:12px;padding:12px;background:#eef3fb;border:3px solid #16294f;border-radius:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 rgba(10,20,50,.3);min-height:0}
@media(min-width:820px){#pg{margin:10px 10px 10px 0}}
#pg header{display:flex;align-items:center;justify-content:space-between;gap:8px}
#pg h2{margin:0;font:400 25px/1 var(--fh)}
.cc{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid #cfdaef;border-radius:99px;padding:4px 12px 3px;font:400 17px/1 var(--fh)}
.cc i{color:#ffb800;font-style:normal}
#list{flex:1;min-height:150px;max-height:320px;overflow:auto;border:2.5px dashed #b9c9e6;border-radius:18px;padding:2px 10px 10px}
@media(min-width:820px){#list{max-height:none;min-height:0}}
.empty{color:#7b8db0;font-size:15px;padding:16px 4px;text-align:center}
.F{--c1:#3b95ff;--c2:#1f76ee;--e:#1458c0}.L{--c1:#ffa94d;--c2:#f08a24;--e:#b8620f}.R{--c1:#a98bff;--c2:#8e5cf0;--e:#5f36c0}.X{--c1:#2fd3a8;--c2:#15a67f;--e:#0b7658}.W{--c1:#ffd84d;--c2:#f2b705;--e:#b88700;--tx:#3b2a00}
.blk{display:flex;align-items:center;gap:8px;position:relative;margin:13px 0 8px;padding:6px 8px 7px 10px;border-radius:12px;color:var(--tx,#fff);font-size:16px;cursor:grab;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 4px 0 var(--e);transition:transform .15s,box-shadow .15s}
.blk::before{content:"";position:absolute;left:14px;top:-5px;width:22px;height:7px;border-radius:5px 5px 0 0;background:var(--c1)}
.blk.pop{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.blk.on{transform:scale(1.04);box-shadow:0 0 0 4px #ffd23f,0 0 22px 4px rgba(255,210,63,.8)}
.blk.X{display:block}
.X .hd{display:flex;align-items:center;gap:8px;cursor:pointer}
.X .in{margin:8px 0 0 12px;padding:2px 0 2px 8px;border-left:4px solid rgba(255,255,255,.55);min-height:34px}
.X .in .blk{margin:13px 0 4px}
.X .in em{font-weight:700;font-size:14px;opacity:.9}
.blk.X.sel{box-shadow:0 0 0 3px #16294f,0 4px 0 var(--e)}
.ic{flex:none;display:grid;place-items:center;width:32px;height:32px;font-size:18px;line-height:1;color:#16294f}
.ic svg{width:100%;height:100%}
.ic.cr{background:#fff;border-radius:50%;width:28px;height:28px;font-size:16px}
.x{margin-left:auto;border:0;background:rgba(255,255,255,.3);color:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font:inherit;line-height:1}
.hd .s{border:0;border-radius:8px;width:26px;height:26px;font:inherit;font-weight:800;cursor:pointer;background:#fff;color:#16294f}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pb{display:flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:3px 10px 5px 6px;color:var(--tx,#fff);font-size:14px;cursor:grab;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 3px 0 var(--e);transition:transform .1s}
.pb:hover:not(:disabled){transform:translateY(-2px)}.pb:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--e)}
.pb:disabled{opacity:.55;cursor:default}
.pb .ic{width:26px;height:26px;font-size:15px}.pb .ic.cr{width:24px;height:24px}
.row{display:flex;align-items:center;gap:8px}
#go{flex:1;height:54px;border:3px solid #16294f;border-radius:99px;font:400 28px/1 var(--fh);color:#fff;cursor:pointer;background:linear-gradient(#3bd672,#17a548);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 4px 0 #0d4a24;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#go:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 1px 0 #0d4a24}
#go:disabled{opacity:.6;cursor:default}
#go.rdy:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
#sp{position:absolute;right:-3px;bottom:-3px;background:#fff;color:#16294f;border-radius:99px;font-size:10px;font-weight:900;line-height:16px;min-width:20px;text-align:center;box-shadow:0 0 0 2px #16294f}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:10px 18px;color:#fff;cursor:pointer;background:linear-gradient(var(--c1,#3b95ff),var(--c2,#1f76ee));box-shadow:0 5px 0 var(--e,#1458c0)}
.btn.g{--c1:#fff;--c2:#e8f0fc;--e:#b9c9e6;color:#16294f}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--e,#1458c0)}
.ov{position:absolute;inset:0;z-index:20;background:rgba(14,26,50,.88);backdrop-filter:blur(3px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;animation:fade .3s;overflow:hidden}
.ov h2{font:400 36px/1.1 var(--fh);margin:0;justify-content:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.ov p{color:#d6e4f3}
.ov .pal{justify-content:center;margin-top:12px}
.stars{display:flex;gap:6px}
.stars b{font-size:62px;line-height:1;color:#4a5b78;animation:sp .6s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(var(--i)*.3s + .25s)}
.stars b.on{color:#ffd23f;text-shadow:0 0 22px rgba(255,210,63,.9)}
@keyframes sp{from{transform:scale(0) rotate(-90deg);opacity:0}}
.cf{position:absolute;top:-14px;width:9px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{80%{opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

body.gm{background:#58b6f7}
#g{max-width:none}
#stage{background:linear-gradient(#4aaef5,#8dd2ff 55%,#c9efff)}
@media(min-width:820px){#stage{grid-template-columns:1fr clamp(330px,27vw,470px);height:100vh;min-height:580px}}
#goals{max-width:clamp(350px,30vw,480px)}
#bc::before,#bc::after{content:"";position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none}
#bc::before{height:46%;background:radial-gradient(55% 100% at 12% 100%,#9fd8f2 97%,transparent 100%),radial-gradient(50% 85% at 55% 100%,#b3e3f8 97%,transparent 100%),radial-gradient(45% 100% at 98% 100%,#9fd8f2 97%,transparent 100%)}
#bc::after{height:24%;background:radial-gradient(60% 100% at 20% 100%,#7bd069 97%,transparent 100%),radial-gradient(55% 90% at 70% 100%,#68c458 97%,transparent 100%),radial-gradient(40% 80% at 100% 100%,#86d874 97%,transparent 100%)}
#bw::after{content:"";position:absolute;left:-4%;right:-8%;top:48%;bottom:-22%;z-index:-1;border-radius:50%;background:rgba(14,50,100,.28);filter:blur(22px)}
@media(min-width:1200px){.blk{font-size:18px}.pb{font-size:15px}#msg{font-size:15.5px}#bub{max-width:390px}.gt{font-size:12.5px}}

/* ===== Pantalla de inicio ===== */
body:not(.gm){background:linear-gradient(#e4f5ff,#c9ecff) fixed}
#h{max-width:none;padding:0;--fh:"Lilita One","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:#16294f}
#hh{position:relative;height:clamp(300px,34vw,400px);overflow:hidden;text-align:center;padding-top:clamp(20px,3vw,38px);background:linear-gradient(#3fa9f5,#86d0ff 58%,#c9efff);border-radius:0 0 40px 40px;box-shadow:0 6px 0 rgba(10,20,50,.25)}

.logo{position:relative;z-index:3;margin:0;font:400 clamp(52px,9vw,112px)/1 var(--fh);color:#fff;letter-spacing:1px;transform:rotate(-2deg);-webkit-text-stroke:clamp(5px,.9vw,10px) #16294f;paint-order:stroke fill;text-shadow:0 clamp(5px,.8vw,9px) 0 #16294f}

.sub{position:relative;z-index:3;margin:clamp(10px,1.8vw,22px) auto 0;max-width:560px;padding:0 16px;color:#fff;font-weight:800;font-size:clamp(15px,1.7vw,20px);text-shadow:0 2px 0 rgba(10,40,90,.55)}
#scene{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:2;overflow:visible;perspective:800px;perspective-origin:50% -30%}
#plane{--s:100px;--a:0deg;--ti:60deg;position:absolute;left:-10%;width:120%;top:0;height:260px;transform-origin:50% 0;transform:rotateX(60deg);transform-style:preserve-3d;background:linear-gradient(#78d466,#5fbd4c)}
.rdp{position:absolute;left:0;right:0;top:70px;height:100px;background:#4b5266;border-block:8px solid #d6d5ec}
.rdp::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:repeating-linear-gradient(90deg,#f2f2f8 0 30px,transparent 30px 60px);background-size:60px 6px;animation:dsh 1s linear infinite}

.dvr{position:absolute;top:70px;width:100px;height:100px;transform-style:preserve-3d;animation:drv 9s linear infinite}
.dvr .v3{transform:rotate(90deg)}

#bar{position:relative;z-index:5;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:-30px 16px 0}
.pill{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #16294f;border-radius:22px;padding:8px 16px;box-shadow:0 4px 0 rgba(10,20,50,.3)}

.pill b svg{width:26px;height:26px;fill:#ffc928;stroke:#f2a000;stroke-width:1.6;stroke-linejoin:round}
.pill small{display:block;font-size:13px;color:#5d6d92;font-weight:800;line-height:1.2}
.pbar{height:12px;border-radius:99px;background:#dbe5f5;overflow:hidden;margin-top:4px;min-width:170px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(#ffd84d,#f2a000)}
.play{height:60px;padding:0 34px;border:3px solid #16294f;border-radius:99px;font:400 28px/1 var(--fh);color:#fff;cursor:pointer;background:linear-gradient(#3bd672,#17a548);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 5px 0 #0d4a24;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:pulse 1.6s ease-in-out infinite}
.play:active{transform:translateY(3px)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 30px}
#wl{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1000px){#wl{grid-template-columns:1fr 1fr}}
.wc,.gc{background:#fff;border:3px solid #16294f;border-radius:22px;padding:10px 14px 14px;box-shadow:0 5px 0 rgba(10,20,50,.3)}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wi2{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:21px;background:linear-gradient(rgba(255,255,255,.3),transparent 60%),var(--w);border:3px solid #16294f;box-shadow:0 3px 0 rgba(10,20,50,.3)}

.wt{margin-left:auto;text-align:right;font:400 18px/1 var(--fh);white-space:nowrap}
.wt .pbar{min-width:90px;margin-top:6px}
.lg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border:3px solid #16294f;border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--w);box-shadow:0 4px 0 rgba(10,20,50,.45);font:400 20px/1 var(--fh);text-shadow:0 2px 0 rgba(10,20,50,.45);transition:transform .12s,box-shadow .12s;animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*18ms + .2s)}

.mb.nx::after{content:"▶";position:absolute;top:-13px;right:-9px;width:26px;height:26px;border-radius:50%;background:#ffd23f;color:#16294f;border:3px solid #16294f;font:400 11px/20px sans-serif;text-align:center;text-shadow:none}
.gc{margin-top:12px}
.gc .wh p{margin-top:2px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.vc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 10px;background:#f3f8ff;border:3px solid #c3d3ee;border-radius:20px;color:#16294f;font:800 15px/1.1 "Nunito","Baloo 2",sans-serif;cursor:pointer;transition:transform .15s}
.vc:hover:not(:disabled){transform:translateY(-3px);border-color:#16294f}
.vc[aria-pressed=true]{border-color:#16294f;background:#e6ffee;box-shadow:0 4px 0 #2fbf71}
.vc[aria-pressed=true]::after{content:"✓";position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;background:#2fbf71;color:#fff;border:3px solid #16294f;font:800 14px/20px sans-serif;text-align:center}
.vc:disabled{cursor:default}.vc:disabled .pvw{filter:grayscale(1) brightness(.85)}.vc:disabled{color:#7b8db0}
.pvw{width:100%;height:92px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(#bfe9ff 0 45%,#8fd873 45%);perspective:320px;overflow:hidden}
.pv{pointer-events:none;--s:60px;width:60px;height:60px;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(-35deg)}
.vc:hover:not(:disabled) .pv{animation:trn 3s linear infinite}
@keyframes trn{from{transform:rotateX(55deg) rotateZ(-35deg)}to{transform:rotateX(55deg) rotateZ(325deg)}}
@media(max-width:560px){.wt{display:none}.pill{flex:1 1 100%}.play{flex:1 1 100%}}

.sub{display:inline-block;background:rgba(22,41,79,.62);border-radius:99px;padding:6px 20px;margin-top:clamp(12px,2vw,24px)}
.pill b{white-space:nowrap}
