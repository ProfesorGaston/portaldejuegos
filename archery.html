<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archery - Prof. Gastón</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { font-family: 'Roboto', sans-serif; overflow: hidden; background-color: #87CEEB; }
        
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #top-bar {
            position: absolute; top: 15px; left: 15px;
            background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
            border: 2px solid #fff; border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex; align-items: center; padding: 5px 15px;
            width: 280px; height: 50px;
        }
        
        #score-bar-bg {
            flex-grow: 1; height: 15px; background: #222; border-radius: 10px; margin: 0 10px;
            border: 1px solid #555; overflow: hidden; position: relative;
        }
        #score-bar-fill {
            width: 0%; height: 100%; background: #2196F3;
            box-shadow: 0 0 10px #2196F3; transition: width 0.3s;
        }
        .ui-text { font-family: 'Oswald', sans-serif; font-weight: 700; color: #111; font-size: 1.1rem; }
        
        #arrows-container {
            position: absolute; top: 10px; right: 15px;
            width: 70px; height: 70px;
            background: radial-gradient(circle, #1a4a6e, #0d273a);
            border: 3px solid #4fc3f7; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); color: white;
        }
        #arrows-container span { font-family: 'Oswald'; font-size: 1.5rem; font-weight: bold; }
        #arrows-container small { font-size: 0.7rem; color: #81d4fa; text-transform: uppercase; }

        #wind-container {
            position: absolute; top: 120px; right: 15px;
            background: rgba(0,0,0,0.7); border: 2px solid #555; border-radius: 5px;
            padding: 10px; text-align: center; color: white; width: 80px;
        }
        #wind-icon { font-size: 1.5rem; color: #4fc3f7; margin-bottom: 5px; display: inline-block; transition: transform 0.3s;}
        #wind-text { font-family: 'Oswald'; font-weight: 700; font-size: 1.1rem; }

        #word-prompt {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); border: 2px solid #ffeb3b;
            padding: 10px 30px; border-radius: 30px; color: #fff;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #word-prompt h2 { font-family: 'Oswald'; font-size: 2.5rem; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; color: #ffeb3b; }
        #word-prompt p { font-size: 0.9rem; color: #ccc; }

        #power-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 40vw; height: 25px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7); display: none;
        }
        #power-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #FFEB3B 50%, #F44336 100%);
        }
        .charging #power-container { display: block; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; pointer-events: none;
            background: radial-gradient(circle, rgba(255,0,0,0.8) 10%, transparent 15%);
            border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
            transition: transform 0.1s;
        }
        .charging #crosshair { transform: translate(-50%, -50%) scale(0.6); border-color: #ffeb3b; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            z-index: 100; color: white; pointer-events: auto;
        }
        .hidden { display: none !important; }
        .overlay h1 { font-family: 'Oswald'; font-size: 4rem; color: #ffeb3b; margin-bottom: 10px;}
        .overlay p { font-size: 1.2rem; max-width: 500px; line-height: 1.5; margin-bottom: 30px;}
        .btn-play {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32); color: white;
            border: 2px solid #81C784; padding: 15px 50px; font-size: 1.8rem; font-family: 'Oswald';
            border-radius: 10px; cursor: pointer; box-shadow: 0 6px 0 #1B5E20; text-transform: uppercase;
        }
        .btn-play:active { transform: translateY(6px); box-shadow: 0 0 0 #1B5E20; }

        #hit-fx {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Oswald'; font-size: 6rem; font-weight: bold; font-style: italic;
            color: #d500f9; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 10px 20px rgba(0,0,0,0.5);
            pointer-events: none; opacity: 0; transition: opacity 0.1s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }
        .show-fx { opacity: 1 !important; transform: translate(-50%, -60%) scale(1.2) !important; }

        #watermark {
            position: absolute; bottom: 10px; right: 15px; font-family: 'Roboto', sans-serif;
            font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="game-ui">
        <div id="top-bar"><span class="ui-text">PUNTOS</span><div id="score-bar-bg"><div id="score-bar-fill"></div></div><span class="ui-text" id="score">0</span></div>
        <div id="arrows-container"><small>Vidas</small><span id="lives">5/5</span></div>
        <div id="wind-container"><div id="wind-icon">➤</div><div id="wind-text">0.0</div></div>
        <div id="word-prompt"><p>Ataca el blanco correcto:</p><h2 id="current-word">PALABRA</h2></div>
        <div id="power-container"><div id="power-fill"></div></div>
        <div id="crosshair"></div>
        <div id="hit-fx">10</div>
        <div id="watermark">Creado por el Prof. Gastón</div>
    </div>

    <div id="screen-start" class="overlay">
        <h1>ARCHERY<br>EDICIÓN ORTOGRÁFICA</h1>
        <p><strong>Mantén presionado</strong> para apuntar y cargar potencia.<br><strong>Suelta</strong> para disparar la flecha.</p>
        <button class="btn-play" onclick="startGame()">JUGAR AHORA</button>
    </div>

    <div id="screen-end" class="overlay hidden">
        <h1>¡JUEGO TERMINADO!</h1>
        <p>Puntaje Final:</p>
        <h2 id="final-score" style="color:#ffeb3b; font-size:5rem; margin-bottom: 30px; font-family:'Oswald'">0</h2>
        <button class="btn-play" onclick="location.reload()">REINTENTAR</button>
    </div>

    <script>
        // === SINTETIZADOR DE AUDIO 8-BITS ===
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function play8BitSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.15); // Descenso rápido
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now); // Nota alta (estilo moneda/acierto)
                osc.frequency.setValueAtTime(1760, now + 0.1); 
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now); // Nota grave
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const wordsDB = [
            { word: "Volcán", type: "AGUDA" }, { word: "Café", type: "AGUDA" }, { word: "Reloj", type: "AGUDA" }, { word: "París", type: "AGUDA" },
            { word: "Árbol", type: "GRAVE" }, { word: "Casa", type: "GRAVE" }, { word: "Mesa", type: "GRAVE" }, { word: "Lápiz", type: "GRAVE" },
            { word: "Pájaro", type: "ESDRÚJULA" }, { word: "Médico", type: "ESDRÚJULA" }, { word: "Música", type: "ESDRÚJULA" }, { word: "Sábado", type: "ESDRÚJULA" }
        ];

        // Se han aumentado las vidas a 5
        let score = 0, lives = 5, maxLives = 5, isPlaying = false, currentWord = null, windPower = 0;
        let isCharging = false, chargePower = 0, chargeDir = 1;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        // === JUGADOR ALEJADO (Se ajusta el eje Z de 0 a 15) ===
        camera.position.set(0, 2, 15);
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(50, 100, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // ==========================================
        //  NUEVO DISEÑO DE ARCO Y BRAZO EN 1RA PERS.
        // ==========================================
        const fpsGroup = new THREE.Group();
        fpsGroup.position.set(0.25, -0.3, -0.6);
        camera.add(fpsGroup);

        const bowWoodMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.4, metalness: 0.1 }); 
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }); 
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.3, metalness: 0.8 }); 
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.6 }); 
        const clothMat = new THREE.MeshStandardMaterial({ color: 0x2e4a22, roughness: 0.9 }); 

        const bowHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 16), bowWoodMat);
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.023, 0.023, 0.12, 16), gripMat);
        bowHandle.add(grip);
        const rest = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.005, 0.03), metalMat);
        rest.position.set(-0.015, 0.08, 0);
        bowHandle.add(rest);
        fpsGroup.add(bowHandle);

        const topLimbGeo = new THREE.CylinderGeometry(0.008, 0.02, 0.5, 12);
        topLimbGeo.translate(0, 0.25, 0); 
        const topLimb = new THREE.Mesh(topLimbGeo, bowWoodMat);
        topLimb.scale.set(1, 1, 0.4); 
        topLimb.position.set(0, 0.15, 0);
        topLimb.rotation.x = 0.2; 
        
        const topTip = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.008, 0.04, 8), metalMat);
        topTip.position.set(0, 0.5, 0);
        topTip.scale.set(1, 1, 2.5); 
        topLimb.add(topTip);
        fpsGroup.add(topLimb);

        const bottomLimbGeo = new THREE.CylinderGeometry(0.02, 0.008, 0.5, 12);
        bottomLimbGeo.translate(0, -0.25, 0);
        const bottomLimb = new THREE.Mesh(bottomLimbGeo, bowWoodMat);
        bottomLimb.scale.set(1, 1, 0.4);
        bottomLimb.position.set(0, -0.15, 0);
        bottomLimb.rotation.x = -0.2;
        
        const bottomTip = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.01, 0.04, 8), metalMat);
        bottomTip.position.set(0, -0.5, 0);
        bottomTip.scale.set(1, 1, 2.5); 
        bottomLimb.add(bottomTip);
        fpsGroup.add(bottomLimb);

        const stringMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const stringPoints = [
            new THREE.Vector3(0, 0.65, 0.1), 
            new THREE.Vector3(0, 0.08, 0.1), 
            new THREE.Vector3(0, -0.65, 0.1) 
        ];
        const stringGeo = new THREE.BufferGeometry().setFromPoints(stringPoints);
        const bowString = new THREE.Line(stringGeo, stringMat);
        fpsGroup.add(bowString);

        const armGroup = new THREE.Group();
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), skinMat);
        hand.position.set(0, 0, 0.02);
        armGroup.add(hand);
        
        const bracer = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.15, 16), gripMat);
        bracer.rotation.x = Math.PI / 2;
        bracer.position.set(0.03, -0.05, 0.15);
        armGroup.add(bracer);

        const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.4, 16), clothMat);
        sleeve.rotation.x = Math.PI / 2;
        sleeve.position.set(0.05, -0.1, 0.35);
        armGroup.add(sleeve);

        armGroup.position.set(0, -0.03, 0);
        fpsGroup.add(armGroup);

        const nockedArrow = new THREE.Group();
        const nShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.9), new THREE.MeshStandardMaterial({color: 0x111111}));
        nShaft.rotation.x = Math.PI / 2;
        const nFletch = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.04, 0.04), new THREE.MeshStandardMaterial({color: 0xff0000}));
        nFletch.position.z = 0.4;
        const nTip = new THREE.Mesh(new THREE.ConeGeometry(0.01, 0.04, 8), metalMat);
        nTip.rotation.x = Math.PI / 2;
        nTip.position.z = -0.45;
        
        nockedArrow.add(nShaft); nockedArrow.add(nFletch); nockedArrow.add(nTip);
        nockedArrow.position.set(-0.02, 0.09, 0.1); 
        nockedArrow.visible = false;
        fpsGroup.add(nockedArrow);

        // ==========================================
        //  ENTORNO Y OBJETIVOS
        // ==========================================
        function createGrassTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, 0, 1024, 1024);
            ctx.fillStyle = '#43A047'; ctx.fillRect(0, 0, 256, 1024); ctx.fillRect(512, 0, 256, 1024);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fillRect(500, 0, 24, 1024);
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(10, 10);
            return tex;
        }
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 0.8 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        function createClassicTargetTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
            const colors = ['#ffffff', '#111111', '#03a9f4', '#e53935', '#ffeb3b'], radii = [240, 192, 144, 96, 48];
            for (let i = 0; i < 5; i++) {
                ctx.beginPath(); ctx.arc(256, 256, radii[i], 0, Math.PI * 2); ctx.fillStyle = colors[i]; ctx.fill();
                if (i === 0 || i === 1) { ctx.lineWidth = 2; ctx.strokeStyle = (i===0)?'#111':'#fff'; ctx.stroke(); }
            }
            return new THREE.CanvasTexture(canvas);
        }
        function createTargetSign(text) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128; const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; if (ctx.roundRect) ctx.roundRect(10, 10, 492, 108, 20); else ctx.rect(10, 10, 492, 108);
            ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#ffeb3b'; ctx.stroke();
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 60px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 64);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) })); sprite.scale.set(7, 1.75, 1); return sprite;
        }

        const targets = []; const targetTypes = ["AGUDA", "GRAVE", "ESDRÚJULA"]; const positionsX = [-10, 0, 10];
        targetTypes.forEach((type, index) => {
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.2, 32), new THREE.MeshStandardMaterial({ map: createClassicTargetTexture(), roughness: 0.5 }));
            mesh.rotation.x = Math.PI / 2; mesh.position.set(positionsX[index], 4, -30); mesh.castShadow = true;
            mesh.userData = { type: type, radius: 3 }; targets.push(mesh); scene.add(mesh);
            const sign = createTargetSign(type); sign.position.set(positionsX[index], 8.2, -30); scene.add(sign);
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
            const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), woodMat); leg1.position.set(positionsX[index] - 2, 2, -30.5); leg1.rotation.z = -0.3; leg1.castShadow = true; scene.add(leg1);
            const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), woodMat); leg2.position.set(positionsX[index] + 2, 2, -30.5); leg2.rotation.z = 0.3; leg2.castShadow = true; scene.add(leg2);
            const leg3 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), woodMat); leg3.position.set(positionsX[index], 2, -32); leg3.rotation.x = -0.3; leg3.castShadow = true; scene.add(leg3);
        });

        function createTree(x, z, scale) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 4), new THREE.MeshStandardMaterial({ color: 0x3d2817 })); trunk.position.y = 2; trunk.castShadow = true;
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true });
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(3, 7, 7), leavesMat); leaf1.position.set(0, 5, 0); leaf1.castShadow = true;
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(3, 7, 7), leavesMat); leaf2.position.set(1.5, 4, 1); leaf2.scale.set(0.8,0.8,0.8); leaf2.castShadow = true;
            const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(3, 7, 7), leavesMat); leaf3.position.set(-1.5, 4, -1); leaf3.scale.set(0.8,0.8,0.8); leaf3.castShadow = true;
            tree.add(trunk); tree.add(leaf1); tree.add(leaf2); tree.add(leaf3); tree.position.set(x, 0, z); tree.scale.setScalar(scale); scene.add(tree);
        }
        for(let i=0; i<30; i++) {
            createTree((Math.random()-0.5)*80, -45 - Math.random()*20, 1.5 + Math.random()); createTree(20 + Math.random()*20, 5 - Math.random()*40, 1 + Math.random()); createTree(-20 - Math.random()*20, 5 - Math.random()*40, 1 + Math.random());
        }
        for(let i=0; i<20; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 1.0 }));
            rock.position.set((Math.random() - 0.5) * 60, 0, 5 - Math.random() * 50); rock.scale.set(Math.random()*0.5 + 0.2, Math.random()*0.3 + 0.1, Math.random()*0.5 + 0.2); rock.castShadow = true; scene.add(rock);
        }
        const birds = [];
        for(let i=0; i<6; i++) {
            const bird = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1, 3), new THREE.MeshBasicMaterial({ color: 0x222222 }));
            bird.rotation.x = Math.PI / 2; bird.rotation.z = -Math.PI / 2; bird.position.set((Math.random() - 0.5) * 100, 15 + Math.random() * 15, -40 - Math.random() * 20); scene.add(bird); birds.push(bird);
        }

        // --- Lógica del Juego ---
        let isAiming = false; let camYaw = 0; let camPitch = 0; let previousPointer = { x: 0, y: 0 };
        const uiContainer = document.getElementById('game-ui'); let activeArrows = [];

        const startAim = (e) => {
            if(!isPlaying) return; isAiming = true; isCharging = true; chargePower = 0; chargeDir = 1;
            uiContainer.classList.add('charging');
            previousPointer.x = e.touches ? e.touches[0].clientX : e.clientX; previousPointer.y = e.touches ? e.touches[0].clientY : e.clientY;
        };
        const moveAim = (e) => {
            if(!isAiming || !isPlaying) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY;
            camYaw -= (x - previousPointer.x) * 0.003; camPitch -= (y - previousPointer.y) * 0.003;
            camYaw = Math.max(-0.8, Math.min(0.8, camYaw)); camPitch = Math.max(-0.2, Math.min(0.5, camPitch));
            camera.rotation.set(camPitch, camYaw, 0, 'YXZ'); previousPointer.x = x; previousPointer.y = y;
        };
        const releaseAim = () => {
            if(!isAiming || !isPlaying) return; isAiming = false; isCharging = false;
            uiContainer.classList.remove('charging'); shootArrow(chargePower);
        };
        document.addEventListener('mousedown', startAim); document.addEventListener('mousemove', moveAim); document.addEventListener('mouseup', releaseAim);
        document.addEventListener('touchstart', startAim); document.addEventListener('touchmove', moveAim); document.addEventListener('touchend', releaseAim);

        function shootArrow(power) {
            camera.rotation.x += 0.03;
            const arrowGroup = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.2, 8), new THREE.MeshStandardMaterial({color: 0x111111})); shaft.rotation.x = Math.PI / 2;
            const fletch = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.15), new THREE.MeshStandardMaterial({color: 0xff0000})); fletch.position.z = 0.55;
            const tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 8), metalMat); tip.rotation.x = Math.PI / 2; tip.position.z = -0.6;
            arrowGroup.add(shaft); arrowGroup.add(fletch); arrowGroup.add(tip);
            
            const spawnOffset = new THREE.Vector3(0.15, -0.2, -0.8); 
            spawnOffset.applyQuaternion(camera.quaternion);
            arrowGroup.position.copy(camera.position).add(spawnOffset);
            
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            arrowGroup.userData = { velocity: direction.multiplyScalar(15 + (power * 0.5)), gravity: 12, active: true };
            scene.add(arrowGroup); activeArrows.push(arrowGroup);
            
            // --- SONIDO DE DISPARO ---
            play8BitSound('shoot');
        }

        function setWind() {
            windPower = (Math.random() - 0.5) * 15;
            const icon = document.getElementById('wind-icon'); icon.style.transform = windPower > 0 ? "rotate(0deg)" : "rotate(180deg)";
            document.getElementById('wind-text').innerText = Math.abs(windPower).toFixed(1);
        }
        function nextRound() {
            currentWord = wordsDB[Math.floor(Math.random() * wordsDB.length)]; document.getElementById('current-word').innerText = currentWord.word; setWind();
        }
        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('screen-start').classList.add('hidden'); score = 0; lives = maxLives;
            updateHUD(); nextRound(); isPlaying = true; camera.rotation.set(0,0,0); camYaw = 0; camPitch = 0;
        }
        function updateHUD() {
            document.getElementById('score').innerText = score; document.getElementById('lives').innerText = `${lives}/${maxLives}`;
            document.getElementById('score-bar-fill').style.width = Math.min((score / 100) * 100, 100) + '%';
            if (lives <= 0) { isPlaying = false; document.getElementById('screen-end').classList.remove('hidden'); document.getElementById('final-score').innerText = score; }
        }
        function triggerHitFX(points) {
            const fx = document.getElementById('hit-fx'); fx.innerText = points;
            if(points === 10) { fx.style.color = "#d500f9"; fx.style.fontSize = "6rem"; }
            else if (points === "Fallaste") { fx.style.color = "#ff3333"; fx.style.fontSize = "4rem"; }
            else { fx.style.color = "#ff0000"; fx.style.fontSize = "6rem"; }
            fx.classList.add('show-fx'); setTimeout(() => fx.classList.remove('show-fx'), 800);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate); const delta = clock.getDelta();

            // --- FÍSICA Y ANIMACIÓN DEL ARCO ---
            const stringPositions = bowString.geometry.attributes.position.array;
            
            if (isCharging) {
                chargePower += 120 * delta * chargeDir; 
                if (chargePower >= 100) { chargePower = 100; chargeDir = -1; }
                if (chargePower <= 0) { chargePower = 0; chargeDir = 1; }
                document.getElementById('power-fill').style.width = chargePower + '%';

                nockedArrow.visible = true;
                const bendFactor = chargePower / 100;

                topLimb.rotation.x = 0.2 - (bendFactor * 0.25);
                bottomLimb.rotation.x = -0.2 + (bendFactor * 0.25);
                
                const stringYOffset = 0.15; 
                const stringZBase = 0.1; 
                
                stringPositions[0] = 0;
                stringPositions[1] = stringYOffset + 0.5 * Math.cos(Math.abs(topLimb.rotation.x));
                stringPositions[2] = stringZBase + 0.5 * Math.sin(topLimb.rotation.x);

                stringPositions[6] = 0;
                stringPositions[7] = -stringYOffset - 0.5 * Math.cos(Math.abs(bottomLimb.rotation.x));
                stringPositions[8] = stringZBase - 0.5 * Math.sin(bottomLimb.rotation.x);

                const drawAmount = stringZBase + bendFactor * 0.6;
                stringPositions[3] = 0;
                stringPositions[4] = 0.08; 
                stringPositions[5] = drawAmount; 

                bowString.geometry.attributes.position.needsUpdate = true;
                nockedArrow.position.z = drawAmount;

            } else {
                nockedArrow.visible = false;
                topLimb.rotation.x = 0.2;
                bottomLimb.rotation.x = -0.2;
                
                stringPositions[1] = 0.15 + 0.5 * Math.cos(0.2);
                stringPositions[2] = 0.1 + 0.5 * Math.sin(0.2);
                stringPositions[5] = stringPositions[2]; 
                stringPositions[7] = -0.15 - 0.5 * Math.cos(0.2);
                stringPositions[8] = 0.1 - 0.5 * Math.sin(-0.2);
                bowString.geometry.attributes.position.needsUpdate = true;
            }

            birds.forEach((bird, index) => {
                bird.position.x += 15 * delta; bird.position.y += Math.sin(clock.getElapsedTime() * 3 + index) * 0.05;
                if(bird.position.x > 60) { bird.position.x = -60; bird.position.y = 15 + Math.random() * 15; }
            });

            if (isPlaying) {
                camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, camPitch, 0.1);
                for (let i = activeArrows.length - 1; i >= 0; i--) {
                    let arrow = activeArrows[i];
                    if (!arrow.userData.active) continue;
                    let data = arrow.userData; data.velocity.y -= data.gravity * delta; data.velocity.x += windPower * delta;
                    arrow.position.addScaledVector(data.velocity, delta);
                    const dir = data.velocity.clone().normalize(); arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir);

                    let hit = false;
                    for (let target of targets) {
                        if (arrow.position.distanceTo(target.position) < target.userData.radius) {
                            hit = true; arrow.userData.active = false;
                            if (target.userData.type === currentWord.type) { 
                                score += 10; 
                                triggerHitFX(10); 
                                play8BitSound('hit'); // --- SONIDO ACIERTO ---
                                setTimeout(() => { scene.remove(arrow); nextRound(); }, 1000); 
                            } else { 
                                lives--; 
                                triggerHitFX("X"); 
                                play8BitSound('wrong'); // --- SONIDO ERROR ---
                                setTimeout(() => { scene.remove(arrow); nextRound(); }, 1000); 
                            }
                            updateHUD(); break;
                        }
                    }
                    if (!hit && arrow.position.y < 0) {
                        lives--; 
                        triggerHitFX("Fallaste"); 
                        play8BitSound('wrong'); // --- SONIDO FALLO ---
                        scene.remove(arrow); activeArrows.splice(i, 1); updateHUD();
                        if(lives > 0) nextRound();
                    }
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
</html>
