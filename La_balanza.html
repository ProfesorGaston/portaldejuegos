<style id="compact-layout-overrides">
  html, body { margin: 0; min-height: 100%; }
  body { overflow-x: hidden; }
  #root .dot-bg { min-height: 100svh !important; }
  #root main { padding-top: 0 !important; padding-bottom: 3.25rem !important; }
  #root main > div:first-child { padding-top: .6rem !important; }
  #root main h1 { margin-top: .45rem !important; font-size: clamp(2rem, 4vw, 3.25rem) !important; line-height: 1 !important; }
  #root main p { line-height: 1.35 !important; }
  #root main .relative.mx-auto { margin-top: .2rem !important; }
  #root main .relative.mx-auto > div { transform: scale(.88); transform-origin: top center; }
  #root main .relative.mx-auto + div { margin-top: -.8rem !important; }
  #root main button { transition-duration: 120ms !important; }
  .creator-watermark { position: fixed; right: 12px; bottom: 8px; z-index: 1000; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.82); color: #78716c; font: 700 11px/1.2 'Nunito', sans-serif; letter-spacing: .02em; pointer-events: none; box-shadow: 0 1px 5px rgba(60,40,20,.08); }
  @media (max-height: 800px) {
    #root main h1 { font-size: clamp(1.8rem, 3.5vw, 2.8rem) !important; }
    #root main .relative.mx-auto > div { transform: scale(.76); }
    #root main .relative.mx-auto + div { margin-top: -1.6rem !important; }
    #root main .pt-8 { padding-top: .35rem !important; }
  }
  @media (max-width: 640px) {
    #root main { padding-left: .65rem !important; padding-right: .65rem !important; }
    .creator-watermark { right: 6px; bottom: 5px; font-size: 10px; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var watermark = document.createElement('div');
    watermark.className = 'creator-watermark';
    watermark.textContent = 'Creado por el Prof. Gastón';
    document.body.appendChild(watermark);
  });
</script>


<style id="viewport-fit-fix">
  /* Mantiene el juego completo visible sin tener que desplazar la página. */
  html, body, #root { width:100%; min-height:100%; margin:0; }
  @media (min-width: 700px) {
    #root > .dot-bg { min-height:100vh !important; min-height:100dvh !important; }
    #root main:has(.relative.mx-auto) { zoom: .82; padding-bottom: .75rem !important; }
  }
  @media (min-width: 700px) and (max-height: 850px) {
    #root main:has(.relative.mx-auto) { zoom: .74; }
  }
  @media (min-width: 700px) and (max-height: 720px) {
    #root main:has(.relative.mx-auto) { zoom: .64; }
  }
  @media (max-width: 699px) {
    #root main { padding-bottom: 1rem !important; }
    #root main .relative.mx-auto > div { transform: scale(.72) !important; transform-origin: top center !important; }
  }
</style>


<style id="zoom-plus-30-percent">
  /* Reduce el acercamiento un 15% adicional respecto de la versión anterior, conservando el ajuste por altura de pantalla. */
  @media (min-width: 700px) {
    #root main:has(.relative.mx-auto) { zoom: .92196; }
  }
  @media (min-width: 700px) and (max-height: 850px) {
    #root main:has(.relative.mx-auto) { zoom: .83111028; }
  }
  @media (min-width: 700px) and (max-height: 720px) {
    #root main:has(.relative.mx-auto) { zoom: .71879808; }
  }
</style>

<style id="layout-balanza-dos-columnas">
/* Pantalla de juego en dos columnas: balanza a la izquierda y explicación completa a la derecha. */
@media (min-width: 900px) {
  body div:has(> .-mt-1):has(> .-mt-2) {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
    align-items: start !important;
    gap: 1.25rem !important;
  }
  body div:has(> .-mt-1):has(> .-mt-2) > .-mt-1 {
    grid-column: 1 !important; grid-row: 1 !important; margin-top: 0 !important; min-width: 0;
  }
  body div:has(> .-mt-1):has(> .-mt-2) > .-mt-2 {
    grid-column: 2 !important; grid-row: 1 !important; margin-top: 0 !important; min-width: 0;
  }
}
@media (max-width: 899px) {
  body div:has(> .-mt-1):has(> .-mt-2) { display: flex !important; flex-direction: column !important; gap: 1rem !important; }
}
