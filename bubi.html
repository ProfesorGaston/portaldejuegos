<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubi, tu mascota virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfeeff;--card:#fff;--ink:#27304a;--acc:#ff8a3d;--bar:#e3e7f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b36;--card:#2a3158;--ink:#f1f3ff;--bar:#3b4373}}
:root[data-theme="dark"]{--bg:#161b36;--card:#2a3158;--ink:#f1f3ff;--bar:#3b4373}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;padding:8px 10px;gap:6px}
.box{background:var(--card);border-radius:18px;padding:6px 10px;display:flex;gap:8px;align-items:center}
#nm{font-weight:bold;cursor:pointer}
#xpw{flex:1}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#43c463;transition:width .4s}
.bar i.low{background:#f25c54}
#xpb i{background:#8e6cf0}
.st{flex:1;text-align:center;font-size:.95rem}
#coins{font-weight:bold;white-space:nowrap}
#sb{background:none;border:0;font-size:1.3rem;cursor:pointer}
#stage{flex:1;position:relative;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:none;min-height:400px;color:#27304a}
.r-home{background:linear-gradient(#ffe9c7 0 60%,#c98f5a 60%)}
.r-home.nt{background:linear-gradient(#1c2b5a 0 60%,#4a3a2a 60%);color:#fff}
.r-kitchen{background:repeating-linear-gradient(90deg,#0000 0 39px,#0001 39px 40px),linear-gradient(#fff3d6 0 60%,#e8d0a0 60%)}
.r-bath{background:repeating-linear-gradient(0deg,#0000 0 39px,#fff6 39px 40px),linear-gradient(#bfeaff 0 60%,#8fd0e8 60%)}
.r-bed{background:linear-gradient(#c9b8ff 0 60%,#8a73c9 60%)}
.r-bed.dark{background:#0d1230;color:#fff}
.r-closet{background:linear-gradient(#f7d6ff 0 60%,#d9a8e8 60%)}
.r-game{background:linear-gradient(#aee6ff,#e6ffe6)}
#pw{transition:transform 2s ease-in-out;position:relative}
#pet{width:230px;height:230px;cursor:pointer;filter:drop-shadow(0 12px 6px #0003);animation:br 3s ease-in-out infinite;transform-origin:50% 100%}
#pet.sick{filter:saturate(.5) drop-shadow(0 12px 6px #0003)}
#pet.bounce{animation:bn .5s}
@keyframes br{50%{transform:scale(1.03,.97)}}
@keyframes bn{40%{transform:translateY(-28px) scale(1.07)}}
.eye{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pp{transform:translate(var(--px,0),var(--py,0))}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 8px}
.btn{font:inherit;font-size:1rem;background:var(--card);color:var(--ink);border:3px solid var(--acc);border-radius:16px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--acc)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.sel{background:var(--acc);color:#fff}
.btn.big{font-size:1.2rem;padding:12px 18px}
.item{font-size:2.1rem;min-width:66px}.item small{display:block;font-size:.72rem}
#nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#nav button{font-size:1.5rem;background:var(--card);border:3px solid transparent;border-radius:14px;padding:6px 0;cursor:pointer}
#nav button.on{border-color:var(--acc);transform:translateY(-3px)}
#msg{min-height:1.4rem;font-weight:bold;text-align:center}
.fx{position:absolute;font-size:2rem;pointer-events:none;animation:up 1.2s forwards;z-index:5}
@keyframes up{to{transform:translateY(-130px) scale(1.3);opacity:0}}
#tool{position:absolute;font-size:3rem;pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:6}
canvas{width:100%;max-width:340px;touch-action:none;border-radius:14px;background:linear-gradient(#aee6ff,#f1fff1)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:92%}
.card{aspect-ratio:1;font-size:2.2rem;border:3px solid var(--acc);border-radius:14px;background:var(--acc);color:#fff;cursor:pointer;transition:transform .3s}
.card.up{background:var(--card);transform:rotateY(0)}
.card.ok{background:#b8f0c0;border-color:#43c463}
.r-closet #pet{width:130px;height:130px}.r-closet .btn{padding:3px 8px;font-size:1rem}.r-closet .row{gap:5px}
.r-closet small{font-size:.7rem;opacity:.7;align-self:center;min-width:48px}
body{background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--bg) 65%,#9b8cff));min-height:100vh}
img.em{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block;pointer-events:none}
.box{box-shadow:0 4px 0 #0001,0 8px 18px #0001;border:2px solid #fff5}
#stage{box-shadow:inset 0 0 0 4px #fff8,0 10px 24px #0002}
.bar{height:10px}.bar i{background:linear-gradient(90deg,#43c463,#9be38a)}.bar i.low{background:#f25c54}
.btn{border-radius:18px;font-weight:600;background:linear-gradient(var(--card),color-mix(in srgb,var(--card),var(--acc) 14%))}
.btn small{font-size:.7rem;margin-left:3px;opacity:.8}.btn.sel{background:var(--acc)}
#nav button{display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #0001;color:var(--ink);font-family:inherit}#nav small{font-size:.62rem;font-weight:600}
#msg:not(:empty){background:var(--card);border-radius:14px;padding:4px 14px;width:fit-content;align-self:center;box-shadow:0 3px 0 #0001}
.r-home::before{content:"";position:absolute;top:24px;right:26px;width:84px;height:84px;border-radius:16px;background:radial-gradient(circle at 50% 50%,#fff7a8 0 18px,#9fdcff 19px);border:6px solid #fff;box-shadow:0 0 0 3px #c98f5a}
.r-home.nt::before{background:radial-gradient(circle at 62% 38%,#fffbe0 0 15px,#16204a 16px)}
#pet{width:calc(230px*var(--k,1));height:calc(230px*var(--k,1))}
.r-closet #pet{width:calc(125px*var(--k,1));height:calc(125px*var(--k,1))}
.tabs{display:flex;gap:4px;width:94%}.tabs .btn{flex:1;padding:5px 2px;font-size:.85rem}
.mem .btn{font-size:.8rem;padding:6px 2px}
.bub{position:absolute;bottom:-70px;background:none;border:0;cursor:pointer;animation:fl linear forwards;z-index:3}
@keyframes fl{to{transform:translateY(-760px)}}
</style>
</head>
<body>
<div id="app">
 <div class="box"><span id="nm"></span><span id="lv"></span><div id="xpw"><div class="bar" id="xpb"><i></i></div></div><span id="coins"></span><button id="sb">🔊</button></div>
 <div class="box"><div class="st">🍎<div class="bar"><i id="b0"></i></div></div><div class="st">🎈<div class="bar"><i id="b1"></i></div></div><div class="st">🫧<div class="bar"><i id="b2"></i></div></div><div class="st">⚡<div class="bar"><i id="b3"></i></div></div><div class="st">❤️<div class="bar"><i id="b4"></i></div></div></div>
 <div id="stage"></div>
 <div id="msg"></div>
 <div id="nav"></div>
</div>

function mathGame(){const st=$("#stage");let sc=0,t=30,a,b,op,ans;
 st.innerHTML='<div style="font-weight:bold" id="mv"></div><div id="q" style="font-size:2.6rem;font-weight:600"></div><div class="row" id="op"></div>';gameRun=true;

 const nq=()=>{op=Math.random()<.5?"+":Math.random()<.5?"−":"×";a=2+Math.random()*(8+S.lv*2)|0;b=2+Math.random()*(8+S.lv)|0;if(op==="−"&&b>a)[a,b]=[b,a];if(op==="×"){a=2+Math.random()*9|0;b=2+Math.random()*9|0}
  ans=op==="+"?a+b:op==="−"?a-b:a*b;const o=new Set([ans]);while(o.size<4)o.add(Math.max(0,ans+(Math.random()*11|0)-5));
  $("#q").textContent=a+" "+op+" "+b+" = ?";$("#op").innerHTML=[...o].sort(()=>Math.random()-.5).map(v=>`<button class="btn big" data-v="${v}">${v}</button>`).join("");
  $("#op").querySelectorAll("button").forEach(x=>x.onclick=()=>{if(!gameRun)return;if(+x.dataset.v===ans){sc++;sOk()}else{sc=Math.max(0,sc-1);sBad()}up();nq()})};
 up();nq();const tm=setInterval(()=>{if(!gameRun)return clearInterval(tm);t--;up();if(t<=0){gameRun=false;clearInterval(tm);const g=Math.ceil(sc/1.5);end(g,sc+" aciertos · +"+g+" 🪙")}},1000)}
function runGame(){const st=$("#stage");st.innerHTML='<div style="font-weight:bold">Tocá para saltar 🌵</div><canvas id="cv" width="340" height="260"></canvas>';

 (function loop(){if(!gameRun)return;fr++;sc=fr/12|0;sp=4+sc/20;
  if(fr%Math.max(45,95-sc)===0)ob.push({x:350,e:["🌵","🪨","🦔"][Math.random()*3|0]});

  c.fillStyle="#27304a";c.font="bold 18px sans-serif";c.fillText("Puntos "+sc,10,24);
  if(!gameRun){const g=Math.ceil(sc/6);return end(g,"Corriste "+sc+" m · +"+g+" 🪙")}requestAnimationFrame(loop)})()}
