<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Constructor de Palabras</title>
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        body {
            background: linear-gradient(180deg, #5fbcff 0%, #9fdaff 38%, #d4f0ff 66%, #fff0d2 100%);
            font-family: 'Fredoka One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        #game-container {
            width: 95%;
            max-width: 960px;
            box-sizing: border-box;
            transform-origin: center center; /* se escala desde el centro (ver fitGame) */
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            z-index: 1;
            border-bottom: 10px solid #ddd;
        }

        /* ===== FONDO DECORATIVO ===== */
        #bg {
            position: fixed; inset: 0;
            z-index: 0; overflow: hidden;
            pointer-events: none;
        }
        #bg .glow {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 80% 45% at 50% 100%, rgba(255,226,170,0.65), transparent 70%);
        }

        /* Sol con rayos suaves */
        #bg .sun {
            position: absolute; top: -90px; right: -90px;
            width: 320px; height: 320px;
        }
        #bg .sun::before {
            content: ''; position: absolute; inset: -90px; border-radius: 50%;
            background: repeating-conic-gradient(rgba(255,246,190,0.7) 0deg 7deg, transparent 7deg 22deg);
            -webkit-mask: radial-gradient(circle, transparent 28%, #000 38%, transparent 70%);
                    mask: radial-gradient(circle, transparent 28%, #000 38%, transparent 70%);
            animation: spin 90s linear infinite;
        }
        #bg .sun::after {
            content: ''; position: absolute; inset: 70px; border-radius: 50%;
            background: radial-gradient(circle at 40% 38%, #fffde8 0%, #ffe680 55%, #ffd24d 100%);
            box-shadow: 0 0 70px 35px rgba(255,226,122,0.6);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Nubes */
        #bg .cloud {
            position: absolute; left: 0; height: auto;
            filter: drop-shadow(0 8px 10px rgba(70,130,190,0.18));
            animation: drift linear infinite;
        }
        @keyframes drift {
            from { transform: translateX(-300px); }
            to   { transform: translateX(calc(100vw + 300px)); }
        }

        /* Pájaros */
        #bg .bird {
            position: absolute; left: 0; height: auto;
            animation: fly linear infinite;
        }
        #bg .bird path {
            transform-box: fill-box; transform-origin: 50% 100%;
            animation: flap 0.6s ease-in-out infinite alternate;
        }
        @keyframes fly {
            from { transform: translateX(-80px); }
            to   { transform: translateX(calc(100vw + 80px)); }
        }
        @keyframes flap { to { transform: scaleY(0.45); } }

        /* Burbujas que suben despacio */
        #bg .bubble {
            position: absolute; bottom: -100px; border-radius: 50%; opacity: 0;
            background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9), rgba(255,255,255,0.28) 55%, rgba(255,255,255,0.08));
            border: 1px solid rgba(255,255,255,0.6);
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translate(0, 0); opacity: 0; }
            12%  { opacity: 0.75; }
            88%  { opacity: 0.5; }
            100% { transform: translate(var(--dx), -115vh); opacity: 0; }
        }

        /* Colinas */
        #bg svg.hills {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 44vh;
        }

        @media (prefers-reduced-motion: reduce) {
            #bg .sun::before, #bg .cloud, #bg .bird, #bg .bird path, #bg .bubble { animation: none; }
            #bg .bubble { opacity: 0.45; }
        }

        #header {
            display: flex; justify-content: space-between; align-items: center;
            color: #7f8c8d; 
            font-size: 1.5rem; 
            margin-bottom: 30px;
            font-family: sans-serif; font-weight: bold;
            background: #f7f9fa;
            padding: 15px 20px;
            border-radius: 20px;
        }
        
        .level-info { color: #2980b9; }
        .stat-group { display: flex; gap: 20px; align-items: center; }

        #timer {
            color: #2c3e50;
            background: #ecf0f1;
            padding: 8px 20px;
            border-radius: 25px;
            min-width: 70px;
            display: inline-block;
        }
        
        .urgent {
            color: white !important;
            background: #e74c3c !important;
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Twemoji: las imágenes escalan con el tamaño de fuente del contenedor */
        img.emoji {
            height: 1em; width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
            display: inline-block;
            pointer-events: none;
            -webkit-user-drag: none;
        }
        #image-display img.emoji { margin: 0; vertical-align: middle; }

        #image-display {
            font-size: 120px; 
            margin: 10px 0 35px 0;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.15));
            height: 140px; line-height: 140px; 
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Contenedor de Slots (Donde se escribe) */
        #slots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            min-height: 80px;
            flex-wrap: wrap;
        }

        .slot {
            width: 60px; height: 80px;
            background: #ecf0f1;
            border-radius: 12px;
            border-bottom: 6px solid #bdc3c7;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; 
            color: #2c3e50;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        
        .slot.filled {
            background: #fff;
            border: 3px solid #3498db;
            color: #3498db;
            border-bottom: 6px solid #2980b9;
        }

        .slot.correct {
            background: #2ecc71; color: white; border-color: #27ae60;
            animation: bounce 0.5s;
        }

        /* Banco de Letras */
        #letters-bank {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }

        .letter-btn {
            width: 65px; height: 80px;
            background: #ff9f43;
            color: white;
            border-radius: 12px;
            border: none;
            border-bottom: 6px solid #e67e22;
            font-size: 2.5rem;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }

        .letter-btn:active { transform: translateY(6px); border-bottom: 0; }
        .letter-btn:hover { filter: brightness(1.1); }
        
        /* Overlays */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98);
            border-radius: 30px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 { 
            color: #ff9f43; 
            margin-bottom: 20px; 
            font-size: 3.5rem; 
            text-shadow: 3px 3px #feca57; 
            line-height: 1.1; /* Mejor espaciado para título largo */
        }
        
        button.main-btn {
            background: #2ecc71; color: white;
            padding: 20px 60px; font-size: 2rem;
            border: none; border-radius: 60px;
            border-bottom: 8px solid #27ae60;
            cursor: pointer; font-family: inherit;
            margin-top: 30px;
        }
        button.main-btn:active { transform: translateY(6px); border-bottom: 0; }
        button.main-btn.retry { background: #e74c3c; border-bottom-color: #c0392b; }

        #watermark {
            position: fixed; bottom: 12px; right: 20px; z-index: 2;
            font-size: 16px; color: rgba(255,255,255,0.95); font-family: sans-serif; font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.35); pointer-events: none;
        }

        #overlay-msg {
            font-size: 1.5rem !important;
            line-height: 1.6;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-8px);}
        }
    </style>
</head>
<body>

    <div id="bg" aria-hidden="true">
        <div class="glow"></div>
        <div class="sun"></div>
        <svg class="hills" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice">
            <defs>
                <linearGradient id="farG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#b9e6dc"/><stop offset="1" stop-color="#95d6c0"/>
                </linearGradient>
                <linearGradient id="midG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#86d3a4"/><stop offset="1" stop-color="#5fbf8c"/>
                </linearGradient>
                <linearGradient id="nearG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#62c78e"/><stop offset="1" stop-color="#2f9c6e"/>
                </linearGradient>
                <g id="pine">
                    <rect x="-3.5" y="-8" width="7" height="12" rx="2" fill="#7a5a3a"/>
                    <polygon points="0,-78 -22,-38 22,-38"/>
                    <polygon points="0,-62 -29,-18 29,-18"/>
                    <polygon points="0,-42 -36,-2 36,-2"/>
                </g>
                <g id="round">
                    <rect x="-4" y="-22" width="8" height="26" rx="2" fill="#7a5a3a"/>
                    <circle cx="0" cy="-48" r="27"/>
                    <circle cx="-17" cy="-36" r="18"/>
                    <circle cx="17" cy="-36" r="18"/>
                </g>
            </defs>

            <path fill="url(#farG)" d="M0,230 C180,170 340,170 520,215 C720,265 880,235 1060,180 C1220,135 1340,160 1440,200 L1440,400 L0,400 Z"/>

            <path fill="url(#midG)" d="M0,285 C200,235 400,230 600,275 C800,320 1000,300 1200,250 C1320,222 1400,235 1440,250 L1440,400 L0,400 Z"/>
            <use href="#pine"  x="150"  y="262" fill="#3f9f78"/>
            <use href="#round" x="300"  y="252" fill="#4cb585"/>
            <use href="#pine"  x="425"  y="254" fill="#3f9f78"/>
            <use href="#pine"  x="1050" y="288" fill="#3f9f78"/>
            <use href="#round" x="1280" y="244" fill="#4cb585"/>

            <path fill="url(#nearG)" d="M0,340 C240,300 460,295 700,330 C940,365 1160,345 1440,305 L1440,400 L0,400 Z"/>
            <g id="flowers"></g>
            <use href="#round" fill="#2f8f63" transform="translate(60 338) scale(1.3)"/>
            <use href="#pine" fill="#2a8559" transform="translate(1360 324) scale(1.4)"/>
        </svg>
    </div>

    <div id="game-container">
        <div id="header">
            <div class="level-info">
                NIVEL <span id="level-num">1</span> <span style="color:#bdc3c7">•</span> 
                PALABRA <span id="round-num">1</span>/8
            </div>
            <div class="stat-group">
                <span id="timer"><span>⏱️</span> <span id="timer-val">60</span></span>
                <span>⭐ <span id="score">0</span></span>
            </div>
        </div>

        <div id="image-display">❓</div>

        <div id="slots-container"></div>

        <div id="letters-bank"></div>

        <div id="overlay">
            <h1 id="overlay-title">CONSTRUCTOR DE PALABRAS</h1>
            
            <p id="overlay-msg" style="color:#7f8c8d; font-size:1.5rem; margin-bottom:20px">
                ¡Ordena las letras!
            </p>
            
            <button id="overlay-btn" class="main-btn" onclick="startGame()">JUGAR</button>
        </div>
    </div>

    <div id="watermark">Creado por el Prof. Gastón</div>

<script>
    // --- BASE DE DATOS ---
    const gameData = {
        1: [ // 3 Letras
            { word: "SOL", icon: "☀️" }, { word: "PAN", icon: "🥖" },
            { word: "OSO", icon: "🐻" }, { word: "PEZ", icon: "🐟" },
            { word: "LUZ", icon: "💡" }, { word: "MAR", icon: "🌊" },
            { word: "SAL", icon: "🧂" }, { word: "UVA", icon: "🍇" }
        ],
        2: [ // 4 Letras
            { word: "PATO", icon: "🦆" }, { word: "GATO", icon: "🐱" },
            { word: "CASA", icon: "🏠" }, { word: "LUNA", icon: "🌙" },
            { word: "MONO", icon: "🐒" }, { word: "LEON", icon: "🦁" },
            { word: "BEBE", icon: "👶" }, { word: "MANO", icon: "✋" }
        ],
        3: [ // 5 Letras
            { word: "LIBRO", icon: "📚" }, { word: "ARBOL", icon: "🌳" },
            { word: "PERRO", icon: "🐶" }, { word: "LAPIZ", icon: "✏️" },
            { word: "AVION", icon: "✈️" }, { word: "MUNDO", icon: "🌍" },
            { word: "RELOJ", icon: "⏰" }, { word: "FUEGO", icon: "🔥" }
        ],
        4: [ // 6 Letras
            { word: "TOMATE", icon: "🍅" }, { word: "REMERA", icon: "👕" },
            { word: "PELOTA", icon: "⚽" }, { word: "ZAPATO", icon: "👞" },
            { word: "PUERTA", icon: "🚪" }, { word: "BANANA", icon: "🍌" },
            { word: "CONEJO", icon: "🐰" }, { word: "JIRAFA", icon: "🦒" }
        ],
        5: [ // 7 Letras
            { word: "MANZANA", icon: "🍎" }, { word: "NARANJA", icon: "🍊" },
            { word: "MARTILLO", icon: "🔨" }, { word: "BALLENA", icon: "🐳" },
            { word: "TORTUGA", icon: "🐢" }, { word: "VESTIDO", icon: "👗" },
            { word: "CORAZON", icon: "❤️" }, { word: "PINGUINO", icon: "🐧" } 
        ],
        6: [ // 8 Letras
            { word: "ELEFANTE", icon: "🐘" }, { word: "TELEFONO", icon: "📞" },
            { word: "MONTAÑAS", icon: "⛰️" }, { word: "CANGREJO", icon: "🦀" },
            { word: "PANTALON", icon: "👖" }, { word: "PRINCESA", icon: "👸" },
            { word: "MARIPOSA", icon: "🦋" }, { word: "CARAMELO", icon: "🍬" }
        ]
    };

    const TOTAL_LEVELS = 6;
    const ROUNDS_PER_LEVEL = 8;

    let currentLevel = 1;
    let currentRound = 1; 
    let score = 0;
    
    let currentWordObj = {};
    let formedWord = [];
    let gameActive = false;

    // Timer
    let timeLeft = 60;
    let timerInterval;
    
    // UI Elements
    const imageDisplay = document.getElementById('image-display');
    const slotsContainer = document.getElementById('slots-container');
    const lettersBank = document.getElementById('letters-bank');
    const overlay = document.getElementById('overlay');
    const timerDisplay = document.getElementById('timer');

    // Twemoji: convierte los emojis de un elemento en imágenes SVG
    function renderEmoji(el) {
        if (window.twemoji) {
            twemoji.parse(el, { folder: 'svg', ext: '.svg' });
        }
    }
    renderEmoji(document.getElementById('header'));
    renderEmoji(imageDisplay);

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'pop') {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'lose') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function startGame() {
        overlay.style.display = 'none';
        score = 0;
        currentLevel = 1;
        currentRound = 1;
        loadRound();
    }

    function loadRound() {
        if (currentLevel > TOTAL_LEVELS) {
            document.getElementById('overlay-title').innerText = "¡MAESTRO DE PALABRAS!";
            document.getElementById('overlay-title').style.color = "#2ecc71";
            document.getElementById('overlay-msg').innerText = `Has completado los 6 niveles y las 48 palabras.\nPuntaje Final: ${score}`;
            const btn = document.getElementById('overlay-btn');
            btn.innerText = "JUGAR DE NUEVO";
            btn.className = "main-btn";
            btn.onclick = startGame;
            overlay.style.display = 'flex';
            return;
        }

        gameActive = true;
        currentWordObj = gameData[currentLevel][currentRound - 1];
        formedWord = new Array(currentWordObj.word.length).fill(null);

        document.getElementById('level-num').innerText = currentLevel;
        document.getElementById('round-num').innerText = currentRound;
        document.getElementById('score').innerText = score;
        imageDisplay.innerText = currentWordObj.icon;
        renderEmoji(imageDisplay);
        
        imageDisplay.style.animation = 'none';
        imageDisplay.offsetHeight; 
        imageDisplay.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

        renderSlots();
        renderLettersBank();
        startTimer(); 
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 60; 
        updateTimerUI();
        
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            updateTimerUI();
            
            if (timeLeft <= 0) {
                handleTimeOut();
            }
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer-val').innerText = timeLeft;
        if (timeLeft <= 10) {
            timerDisplay.classList.add('urgent');
        } else {
            timerDisplay.classList.remove('urgent');
        }
    }

    function handleTimeOut() {
        clearInterval(timerInterval);
        gameActive = false;
        playSound('lose');
        
        document.getElementById('overlay-title').innerText = "¡TIEMPO AGOTADO!";
        document.getElementById('overlay-title').style.color = "#e74c3c";
        document.getElementById('overlay-msg').innerText = "Se acabó el tiempo para esta palabra.";
        const btn = document.getElementById('overlay-btn');
        btn.innerText = "REINTENTAR";
        btn.className = "main-btn retry";
        btn.onclick = () => {
            loadRound(); 
            overlay.style.display = 'none';
        };
        overlay.style.display = 'flex';
    }

    function renderSlots() {
        slotsContainer.innerHTML = '';
        formedWord.forEach((char, index) => {
            const slot = document.createElement('div');
            slot.className = char ? 'slot filled' : 'slot';
            slot.innerText = char || '';
            
            slot.onclick = () => {
                if (char && gameActive) {
                    playSound('pop');
                    returnLetterToBank(char, index);
                }
            };
            slotsContainer.appendChild(slot);
        });
    }

    function renderLettersBank() {
        lettersBank.innerHTML = '';
        const currentLettersInSlots = [...formedWord];
        const targetLetters = currentWordObj.word.split('');
        const tempTarget = [...targetLetters];

        for(let l of currentLettersInSlots) {
            if(l) {
                const idx = tempTarget.indexOf(l);
                if(idx > -1) tempTarget.splice(idx, 1);
            }
        }

        tempTarget.sort(() => Math.random() - 0.5);

        tempTarget.forEach(char => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.innerText = char;
            btn.onclick = () => {
                if(gameActive) placeLetter(char);
            };
            lettersBank.appendChild(btn);
        });
    }

    function placeLetter(char) {
        if (!gameActive) return;
        const emptyIndex = formedWord.indexOf(null);
        if (emptyIndex !== -1) {
            playSound('click');
            formedWord[emptyIndex] = char;
            renderSlots();
            renderLettersBank();
            checkWin();
        }
    }

    function returnLetterToBank(char, index) {
        if (!gameActive) return;
        formedWord[index] = null;
        renderSlots();
        renderLettersBank();
    }

    function checkWin() {
        if (!formedWord.includes(null)) {
            const wordString = formedWord.join('');
            if (wordString === currentWordObj.word) {
                gameActive = false; 
                clearInterval(timerInterval); 
                playSound('win');
                score += 10 + Math.floor(timeLeft / 2); 
                document.getElementById('score').innerText = score;
                
                const slots = document.querySelectorAll('.slot');
                slots.forEach(s => s.classList.add('correct'));

                setTimeout(() => {
                    nextRound();
                }, 1200);
            } else {
                slotsContainer.style.transform = "translateX(5px)";
                setTimeout(() => slotsContainer.style.transform = "translateX(-5px)", 50);
                setTimeout(() => slotsContainer.style.transform = "translateX(0)", 100);
            }
        }
    }

    function nextRound() {
        currentRound++;
        if (currentRound > ROUNDS_PER_LEVEL) {
            currentLevel++;
            currentRound = 1;
            loadRound();
        } else {
            loadRound();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;

        if (e.key === 'Backspace') {
            for (let i = formedWord.length - 1; i >= 0; i--) {
                if (formedWord[i] !== null) {
                    returnLetterToBank(formedWord[i], i);
                    playSound('pop');
                    return; 
                }
            }
            return;
        }

        const key = e.key.toUpperCase();
        if (/^[A-ZÑ]$/.test(key)) {
            const targetCount = currentWordObj.word.split('').filter(c => c === key).length;
            const currentCount = formedWord.filter(c => c === key).length;

            if (currentCount < targetCount) {
                placeLetter(key);
            }
        }
    });


    // --- ESCALA DEL JUEGO: la caja se agranda y luego se reduce según SIZE_FACTOR ---
    const MAX_SCALE = 2;
    const SIZE_FACTOR = 0.77; // proporción del máximo que entra en pantalla (1 = máximo)
    const gameContainer = document.getElementById('game-container');
    function fitGame() {
        const w = gameContainer.offsetWidth;   // tamaño de diseño (sin escala)
        const h = gameContainer.offsetHeight;
        const scale = Math.min(MAX_SCALE, (window.innerWidth * 0.96) / w, (window.innerHeight * 0.94) / h) * SIZE_FACTOR;
        gameContainer.style.transform = `scale(${scale})`;
    }
    fitGame();
    window.addEventListener('resize', fitGame);
    if (window.ResizeObserver) new ResizeObserver(fitGame).observe(gameContainer);

    // --- FONDO DECORATIVO: nubes, pájaros, burbujas y flores ---
    (function buildBackground() {
        const bg = document.getElementById('bg');
        const hills = bg.querySelector('svg.hills');
        const NS = 'http://www.w3.org/2000/svg';
        const rnd = (a, b) => a + Math.random() * (b - a);
        const add = el => bg.insertBefore(el, hills);

        // Nubes
        const clouds = [
            { top: 7,  w: 230, dur: 120, delay: -45, op: 0.95 },
            { top: 19, w: 150, dur: 160, delay: -120, op: 0.75 },
            { top: 31, w: 200, dur: 140, delay: -20, op: 0.8 },
            { top: 13, w: 120, dur: 180, delay: -80, op: 0.65 }
        ];
        clouds.forEach(c => {
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', '0 0 200 80');
            svg.setAttribute('class', 'cloud');
            svg.innerHTML =
                '<ellipse cx="100" cy="63" rx="94" ry="15" fill="#d9edff"/>' +
                '<g fill="#fff"><ellipse cx="100" cy="55" rx="92" ry="17"/>' +
                '<circle cx="62" cy="40" r="24"/><circle cx="104" cy="30" r="30"/><circle cx="144" cy="42" r="22"/></g>';
            svg.style.cssText = `top:${c.top}%;width:${c.w}px;opacity:${c.op};animation-duration:${c.dur}s;animation-delay:${c.delay}s;`;
            add(svg);
        });

        // Pájaros
        [{ top: 14, w: 34, dur: 58, delay: -12 }, { top: 17, w: 26, dur: 58, delay: -9 }, { top: 26, w: 30, dur: 74, delay: -40 }]
        .forEach(b => {
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', '0 0 34 14');
            svg.setAttribute('class', 'bird');
            svg.innerHTML = '<path d="M1,10 Q9,-2 17,9 Q25,-2 33,10" fill="none" stroke="#4a6f94" stroke-width="2.4" stroke-linecap="round"/>';
            svg.style.cssText = `top:${b.top}%;width:${b.w}px;animation-duration:${b.dur}s;animation-delay:${b.delay}s;`;
            add(svg);
        });

        // Burbujas
        for (let i = 0; i < 14; i++) {
            const size = rnd(18, 64);
            const d = document.createElement('div');
            d.className = 'bubble';
            d.style.cssText =
                `width:${size}px;height:${size}px;left:${rnd(0, 100)}%;` +
                `--dx:${rnd(-70, 70)}px;animation-duration:${rnd(24, 46)}s;animation-delay:${-rnd(0, 40)}s;`;
            add(d);
        }

        // Florcitas en la colina de adelante
        const flowers = document.getElementById('flowers');
        const petals = ['#ffffff', '#ffd166', '#ff8fab', '#c3a6ff'];
        for (let i = 0; i < 48; i++) {
            const x = rnd(0, 1440), y = rnd(354, 395);
            const g = document.createElementNS(NS, 'g');
            g.innerHTML =
                `<circle cx="${x}" cy="${y}" r="3.6" fill="${petals[i % petals.length]}"/>` +
                `<circle cx="${x}" cy="${y}" r="1.5" fill="#ffb703"/>`;
            flowers.appendChild(g);
        }
    })();

</script>
</body>
