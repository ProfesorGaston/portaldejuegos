 if(p===4){const ok=S.hyp==='cerca',r=S.rec;B.push(`<h2>Mi conclusión</h2><div class="note ${ok?'ok':'no'}"><b>${ok?'Mi hipótesis se confirmó.':'Mi hipótesis no coincidió con lo que medí.'}</b> Pensaba que ${HT[S.hyp]}. Medí ${fmt(r[20])} cm a 20 cm, ${fmt(r[40])} cm a 40 cm, ${fmt(r[60])} cm a 60 cm y ${fmt(r[80])} cm a 80 cm. ${ok?'La sombra fue mayor a 20 cm y menor a 80 cm.':'Reformulo mi idea: la sombra es mayor cuando el muñeco está más cerca de la linterna.'}</div><p><b>¿Por qué pasó?</b> La luz viaja en línea recta, en rayos. Los rayos que rozan los bordes del muñeco siguen derechos hasta la pared y entre ellos no llega luz: esa zona es la sombra. Lo completo:</p><p>Cuanto más <select id="q1"><option value="">…</option><option>cerca</option><option>lejos</option></select> está el muñeco de la linterna, los rayos de sus bordes se separan <select id="q2"><option value="">…</option><option>más</option><option>menos</option></select> y la sombra es <select id="q3"><option value="">…</option><option value="g">más grande</option><option value="c">más chica</option></select>.</p><div class="note" id="fb">Elijo las tres palabras.</div><div class="three" id="three" style="display:none"><div><small>¿Qué pensábamos antes?</small>${HT[S.hyp][0].toUpperCase()+HT[S.hyp].slice(1)}.</div><div><small>¿Qué pensamos ahora?</small>Cuanto más cerca de la luz, más grande es la sombra.</div><div><small>¿Qué nos lo mostró?</small>Las mediciones y el esquema de rayos rectos.</div></div><p style="color:var(--mute);font-size:15px">Las medidas reales varían un poco porque la linterna no es un punto de luz y el borde de la sombra se ve difuso. Lo importante es el patrón. Para estar más seguro, repetiría la experiencia cambiando otra cosa.</p><div class="row"><button class="b" id="again">Repetir la experiencia</button><button class="b go" id="lab">Ir al laboratorio</button></div>`)}
 if(p===5)B.push(`<h2>Laboratorio libre</h2><p>Ahora cambio lo que quiero y miro qué pasa. Arrastro la <b>linterna</b> y el <b>muñeco</b> por el banco.</p><div class="row" id="srcs"><span>Fuente de luz:</span>${[['Punto',1.5],['Linterna',7],['Lámpara grande',24]].map(([n,r])=>`<button class="b ${r===7?'sel':''}" data-r="${r}">${n}</button>`).join('')}</div><div class="row"><label>Altura del muñeco <input type="range" id="hd" min="3" max="9" step="1" value="5"> <b id="hdv">5 cm</b></label><label>Material <select id="mt">${M.map((m,i)=>`<option value="${i}">${m.n}</option>`).join('')}</select></label></div><div class="three"><div><small>Altura de la sombra</small><b id="r1"></b></div><div><small>Zona de penumbra (borde difuso)</small><b id="r2"></b></div><div><small>Luz que llega a la pared</small><b id="r3"></b></div></div><div class="note" style="margin-top:10px">Pruebo: ¿qué pasa con el borde de la sombra si agrando la fuente de luz? ¿Y si acerco la linterna a la pared? ¿Y con el celofán o el papel manteca?</div>`);
 $('#nb').innerHTML=tabs+B.join('');wire()}
function wire(){const p=S.p,nx=$('#nx');
 $$('.tabs button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 if(nx)nx.onclick=()=>go(p+1);
 if(p===0){$('#idea').oninput=e=>S.idea=e.target.value;$$('#demo .b').forEach(b=>b.onclick=()=>{touched=true;if(b.dataset.d==='auto')auto=!RM;else{auto=false;P.tx=+b.dataset.d}})}
 if(p===1){$$('#mats .b').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.i;$$('#mats .b').forEach(c=>c.classList.toggle('sel',c===b));$('#cls').style.display='flex';panel();note('#fb',`Probé ${M[S.sel].n.toLowerCase()}. ¿Cómo lo clasifico?`)});
  $$('#cls .b').forEach(b=>b.onclick=()=>{const m=M[S.sel];if(b.dataset.k===m.k){S.done[S.sel]=1;$$('#mats .b')[S.sel].classList.add('ok');const all=Object.keys(S.done).length===5;note('#fb',`✅ Es ${m.k}. ${m.x}${all?' Ya clasifiqué los cinco. Para el experimento uso un muñeco de cartón: es opaco y hace la sombra más oscura.':''}`,'ok');$('#nx').disabled=!all}else note('#fb','🔎 Todavía no. Miro cuánta luz llega a la hoja y pruebo de nuevo.','no')})}
 if(p===2){$$('#hyp .b').forEach(b=>b.onclick=()=>{S.hyp=b.dataset.h;$$('#hyp .b').forEach(c=>c.classList.toggle('sel',c===b));$('#nx').disabled=false})}
 if(p===3){$$('#snaps .b[data-d]').forEach(b=>b.onclick=()=>tween(+b.dataset.d));
  $('#mark').onclick=()=>{const d=snap(cur);if(Math.abs(cur-d)>.6){note('#fb','Primero suelto el muñeco para que quede quieto en 20, 40, 60 u 80 cm.','no');return}
   S.rec[d]=500/d;markT=performance.now();markD=P.ox;$('#tb').innerHTML=table();$('#ch').innerHTML=chart();
   const n=Object.keys(S.rec).length;if(n<4)note('#fb',`A ${d} cm la sombra mide ${fmt(S.rec[d])} cm. Me faltan ${4-n}.`,'ok');
   else{note('#fb',`Lo que noto: cuando el muñeco se aleja de la linterna, la sombra se achica, de ${fmt(S.rec[20])} cm a ${fmt(S.rec[80])} cm.`,'ok');$('#nx').disabled=false}}}
 if(p===4){const chk=()=>{const a=$('#q1').value,b=$('#q2').value,c=$('#q3').value;if(!a||!b||!c){note('#fb','Elijo las tres palabras.');return}
   if(a==='cerca'&&b==='más'&&c==='g'){note('#fb','🎉 Exacto. Cerca de la linterna los rayos de los bordes se abren más y la sombra crece. Lejos, casi van paralelos y la sombra se achica.','ok');$('#three').style.display='grid'}
   else{note('#fb','Casi. Muevo el muñeco y miro cómo se abren los rayos cuando se acerca a la linterna.','no');$('#three').style.display='none'}};
  ['#q1','#q2','#q3'].forEach(i=>$(i).onchange=chk);
  $('#again').onclick=()=>{S.rec={};S.hyp=null;S.top=2;go(2)};$('#lab').onclick=()=>go(5)}
 if(p===5)labWire()}

 $('#hd').oninput=e=>{P.thd=+e.target.value;$('#hdv').textContent=e.target.value+' cm'};

(()=>{const c=$('#fx'),g=c.getContext('2d');let ps=[],run=false;
const rs=()=>{c.width=innerWidth;c.height=innerHeight};rs();addEventListener('resize',rs);
const burst=()=>{if(RM)return;const cl=['#ffcf6b','#2858d6','#46d19a','#ff7aa8','#8bb0ff','#fff'];
 for(let i=0;i<60;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.7,vx:(Math.random()-.5)*14,vy:-8-Math.random()*12,w:6+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cl[i%6],l:1});
 if(!run){run=true;requestAnimationFrame(step)}};
const step=()=>{g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.l-=.011;g.save();g.globalAlpha=Math.max(0,p.l);g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);g.restore()});
 ps=ps.filter(p=>p.l>0);if(ps.length)requestAnimationFrame(step);else{run=false;g.clearRect(0,0,c.width,c.height)}};
new MutationObserver(ms=>{for(const m of ms){const t=m.target;if(t.classList&&t.classList.contains('note')&&t.classList.contains('ok'))return burst()}}).observe($('#nb'),{subtree:true,attributes:true,attributeFilter:['class']})})();
