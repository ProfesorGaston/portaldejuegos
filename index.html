<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Juegos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .categoria { margin-bottom: 20px; }
        .juego { margin: 5px 0; }
        a { text-decoration: none; color: #333; }
        a:hover { color: #0066cc; }
    </style>
</head>
<body>
    <h1>Mis Juegos</h1>
    <div id="contenedor-juegos"></div>

    <script>
        // Arreglo data con los juegos organizados por categoría
        const data = {
            "Lógica": [
                { title: 'Sudoku', url: 'sudoku.html', emoji: '🔢' },
                { title: 'bubi', url: 'bubi.html', emoji: '🧩' }
            ],
            "Matemática": [
                { title: 'Calculadora rápida', url: 'calculadora.html', emoji: '🧮' },
                { title: 'Construccion del hogar', url: 'Construccion del hogar.html', emoji: '🏠' }
            ]
        };

        // Lógica para mostrar los juegos en el HTML
        const contenedor = document.getElementById('contenedor-juegos');
        
        for (const categoria in data) {
            const seccion = document.createElement('div');
            seccion.className = 'categoria';
            seccion.innerHTML = `<h2>${categoria}</h2>`;
            
            const lista = document.createElement('ul');
            data[categoria].forEach(juego => {
                const item = document.createElement('li');
                item.className = 'juego';
                item.innerHTML = `<a href="${juego.url}">${juego.emoji} <strong>${juego.title}</strong></a>`;
                lista.appendChild(item);
            });
            
            seccion.appendChild(lista);
            contenedor.appendChild(seccion);
        }
    </script>
</body>
</html>
