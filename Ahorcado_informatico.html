<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado | Prof. Gastón</title>
    
    <!-- Fuente redondeada y amigable para niños -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-shadow: #3730a3;
            --success: #22c55e;
            --success-shadow: #16a34a;
            --danger: #ef4444;
            --danger-shadow: #dc2626;
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        /* Fondo Animado Alegre */
        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Marca de agua */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.7);
            color: #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(4px);
            z-index: 100;
            letter-spacing: 0.5px;
        }

        /* Contenedor Principal (Estilo Tarjeta 3D) */
        .game-container {
            background: var(--bg-card);
            width: 100%; max-width: 850px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                        0 10px 10px rgba(0, 0, 0, 0.1),
                        inset 0 -5px 15px rgba(0,0,0,0.02);
            padding: 40px;
            position: relative;
            transform: translateY(0);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 {
            font-size: 38px; font-weight: 900;
            color: #4f46e5;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 2px 2px 0px #c7d2fe;
            margin-bottom: 5px;
        }
        .header h2 {
            font-size: 20px; font-weight: 800; color: #8b5cf6;
        }

        /* Caja de Pistas Divertida */
        .hint-box {
            background: #fffbeb;
            border: 3px solid #fde68a;
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 8px 0 #fde68a;
        }
        .hint-box i { color: #d97706; animation: bounce 2s infinite; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .hint-content { display: flex; flex-direction: column; }
        .hint-label { font-size: 14px; font-weight: 900; color: #d97706; text-transform: uppercase; }
        .hint-text { font-size: 18px; color: #78350f; font-weight: 700; }

        /* Estructura del Juego */
        .game-layout {
            display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: center;
        }

        @media (max-width: 768px) {
            .game-layout { grid-template-columns: 1fr; gap: 30px; }
            .game-container { padding: 25px; border-radius: 25px; }
        }

        .canvas-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            padding: 20px; border-radius: 25px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
        }
        
        canvas { width: 100%; max-width: 180px; height: auto; }

        .mistakes-badge {
            background: white; border: 2px solid #e2e8f0;
            padding: 8px 16px; border-radius: 20px;
            font-size: 15px; font-weight: 800; color: var(--text-muted);
            box-shadow: 0 4px 0 #e2e8f0;
        }
        .mistakes-badge span { color: var(--danger); font-size: 18px; }

        /* Letras (Estilo Fichas de Scrabble) */
        .word-display {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
            margin-bottom: 30px; min-height: 65px;
        }
        .letter-slot {
            width: 50px; height: 60px;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: 900; color: var(--primary);
            box-shadow: 0 6px 0 #cbd5e1;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .letter-slot.filled {
            background: white; border-color: var(--primary);
            box-shadow: 0 6px 0 var(--primary-shadow);
            transform: translateY(-4px);
        }

        /* Teclado Infantil 3D */
        .keyboard {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(45px, 1fr)); gap: 10px;
        }

        .key {
            background: white; border: 2px solid #e2e8f0;
            color: var(--text-main); font-size: 20px; font-weight: 800;
            height: 55px; border-radius: 12px;
            cursor: pointer; 
            box-shadow: 0 6px 0 #e2e8f0;
            transition: all 0.1s;
        }
        .key:hover:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #e2e8f0;
        }
        .key:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 #e2e8f0;
        }
        .key:disabled { cursor: not-allowed; opacity: 0.6; }
        
        .key.correct { 
            background: var(--success); color: white; border-color: var(--success-shadow);
            box-shadow: 0 6px 0 var(--success-shadow); transform: translateY(2px);
        }
        .key.wrong { 
            background: var(--danger); color: white; border-color: var(--danger-shadow);
            box-shadow: 0 6px 0 var(--danger-shadow); transform: translateY(2px);
        }

        /* Modal Overlay Mágico */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: all 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white; padding: 40px; border-radius: 30px;
            text-align: center; transform: scale(0.8) translateY(50px); 
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; transition-delay: 0.1s; }

        .modal-icon { width: 90px; height: 90px; margin: 0 auto 20px auto; }
        .modal-icon.win { color: #f59e0b; animation: spin 4s linear infinite; }
        .modal-icon.lose { color: var(--danger); }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .modal-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .modal-subtitle { font-size: 18px; color: var(--text-muted); margin-bottom: 30px; font-weight: 600;}
        .modal-subtitle strong { color: var(--primary); font-size: 24px; display: block; margin-top: 10px; font-weight: 900;}

        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 16px 30px;
            font-size: 20px; font-weight: 800; border-radius: 20px;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 8px 0 var(--primary-shadow);
            display: inline-flex; align-items: center; gap: 10px;
            width: 100%; justify-content: center;
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(2px); box-shadow: 0 6px 0 var(--primary-shadow); }
        .btn-primary:active { transform: translateY(8px); box-shadow: 0 0 0 var(--primary-shadow); }

/* ===== ESPECTACULAR ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:300}
#bg-float{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg-float span{position:absolute;bottom:-60px;opacity:.55;animation:floatUp linear infinite;filter:drop-shadow(0 4px 6px #0002)}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(360deg)}}
body{background:linear-gradient(-45deg,#ff9a9e,#fbc2eb,#a1c4fd,#84fab0,#c2e9fb);background-size:400% 400%}
.game-container{z-index:1;background:rgba(255,255,255,.84);backdrop-filter:blur(14px);border:2px solid #fff;animation:cardIn .8s cubic-bezier(.2,1.2,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(60px) scale(.9)}}
.header h1{background:linear-gradient(90deg,#4f46e5,#ec4899,#f59e0b,#4f46e5);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #c7d2fe);animation:hue 6s linear infinite}
@keyframes hue{to{background-position:300% 0}}
#progress{display:flex;gap:4px;margin:14px auto 0;max-width:520px}
.seg{flex:1;height:10px;border-radius:6px;background:#e2e8f0;transition:.5s}
.seg.done{background:linear-gradient(90deg,#22c55e,#86efac)}.seg.cur{background:#818cf8;animation:pl .8s infinite alternate}
@keyframes pl{to{transform:scaleY(1.7);background:#c7d2fe}}
.stats{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px;font-weight:900;flex-wrap:wrap}
.chip{background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 4px 0 #e2e8f0}
.heart{font-size:22px;display:inline-block;transition:.4s}.heart.lost{filter:grayscale(1);opacity:.3;transform:scale(.6) rotate(-20deg)}
.joker{margin-left:auto;background:linear-gradient(#a78bfa,#6366f1);color:#fff;border:none;border-radius:16px;padding:10px 16px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #4338ca;transition:.1s;white-space:nowrap}
.joker:active{transform:translateY(5px);box-shadow:none}.joker.off{opacity:.4;pointer-events:none}
.canvas-container{background:#fff;overflow:hidden;padding:10px}
canvas#hangman-canvas{border-radius:18px}
.key{background:linear-gradient(#fff,hsl(var(--h,200) 95% 93%));border-color:hsl(var(--h,200) 70% 82%);box-shadow:0 6px 0 hsl(var(--h,200) 60% 78%)}
.key:hover:not(:disabled){transform:translateY(-3px) scale(1.06);box-shadow:0 9px 0 hsl(var(--h,200) 60% 78%)}
.key.correct{animation:pop .45s}.key.wrong{animation:shk .4s}
@keyframes pop{40%{transform:scale(1.35) rotate(-6deg)}}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shk .4s}
.letter-slot{background:linear-gradient(#fff,#eef2ff)}
.letter-slot.new{animation:slotPop .65s cubic-bezier(.2,1.8,.4,1)}
@keyframes slotPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:translateY(-14px) scale(1.25)}}
.level-in{animation:lvl .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes lvl{from{opacity:0;transform:translateX(60px)}}
#banner{position:fixed;inset:0;display:grid;place-items:center;z-index:250;pointer-events:none;opacity:0;text-align:center;padding:20px;
 font-size:clamp(40px,9vw,92px);font-weight:900;color:#fff;-webkit-text-stroke:3px #4f46e5;text-shadow:0 8px 0 #4f46e5,0 0 40px #fff}
#banner.show{animation:bn 1.3s}
@keyframes bn{0%{opacity:0;transform:scale(.3) rotate(-8deg)}25%{opacity:1;transform:scale(1.12) rotate(2deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-50px)}}
#mascot{position:fixed;left:14px;bottom:14px;z-index:150;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#mascot img{width:84px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0003)}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:900;color:#4f46e5;box-shadow:0 4px 0 #c7d2fe;margin-bottom:46px;max-width:190px;font-size:15px}
#bubble.show{animation:bub .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bub{from{transform:scale(.3);opacity:0}}
#snd{position:fixed;top:14px;right:14px;z-index:150;width:46px;height:46px;border-radius:50%;border:none;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #cbd5e1}
.modal-content{background:linear-gradient(#fff,#eef2ff)}
@media(max-width:768px){#mascot img{width:56px}#bubble{font-size:12px;margin-bottom:30px}.hint-box{flex-wrap:wrap}.joker{margin:0 auto}}
    </style>
</head>
<body>
    <canvas id="fx"></canvas><div id="bg-float"></div><div id="banner"></div><button id="snd" onclick="toggleSnd()">🔊</button>
    <div id="mascot"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f916.svg" alt=""><div id="bubble" class="show">¡Vamos a jugar!</div></div>

    <div class="watermark">Creado por el Prof. Gastón</div>

    <div class="game-container">
        <div class="header">
            <h1>¡Adivina la Palabra!</h1>
            <h2 id="level-display">Nivel 1 de 20</h2>
            <div id="progress"></div>
            <div class="stats"><span class="chip">⭐ <b id="score">0</b></span><span class="chip" id="hearts"></span><span class="chip" id="streak">🔥 x1</span></div>
        </div>

        <div class="hint-box">
            <i data-lucide="lightbulb" size="32"></i>
            <div class="hint-content">
                <span class="hint-label">Pista del juego</span>
                <span class="hint-text" id="hint-display">Cargando...</span>
            </div>
            <button class="joker" id="joker" onclick="useJoker()">🪄 Comodín <b id="jk">3</b></button>
        </div>
        
        <div class="game-layout">
            <div class="canvas-container">
                <canvas id="hangman-canvas" width="360" height="440"></canvas>
                <div class="mistakes-badge">Errores: <span id="mistakes-count">0</span> / 6</div>
            </div>

            <div class="interaction-area">
                <div class="word-display" id="word-display"></div>
                <div class="keyboard" id="keyboard"></div>
            </div>
        </div>

        <div class="modal-overlay" id="modal">
            <div class="modal-content">
                <i data-lucide="star" class="modal-icon win" id="icon-win" style="display:none;" fill="#fef08a"></i>
                <i data-lucide="frown" class="modal-icon lose" id="icon-lose" style="display:none;"></i>
                
                <h2 class="modal-title" id="modal-title">¡Ganaste!</h2>
                <p class="modal-subtitle" id="modal-subtitle">La palabra secreta era: <strong>---</strong></p>
                
                <button class="btn-primary" onclick="startFullGame()">
                    <i data-lucide="play" size="24" fill="white"></i> Jugar otra vez
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 30 palabras fáciles con acertijos para niños
        const data = [
            { word: "COMPU", hint: "La usamos para hacer tareas y jugar a juegos." },
            { word: "MOUSE", hint: "Tiene nombre de ratoncito y mueve la flecha." },
            { word: "PANTALLA", hint: "Como una tele, ahí vemos los dibujitos y videos." },
            { word: "JUEGO", hint: "Lo que más nos divierte hacer en el celular o la tablet." },
            { word: "FOTO", hint: "Imagen que sacamos cuando sonreímos a la cámara." },
            { word: "VIDEO", hint: "Como una foto, pero se mueve y tiene sonido." },
            { word: "NUBE", hint: "Está en el cielo, pero en internet guarda nuestros archivos." },
            { word: "ROBOT", hint: "Máquina de metal que camina y puede hablar." },
            { word: "CABLE", hint: "El hilo largo que enchufamos a la pared para cargar la compu." },
            { word: "TECLADO", hint: "Tiene botones con todas las letras y números para escribir." },
            { word: "TABLET", hint: "Es plana, no tiene botones y es más grande que un celular." },
            { word: "LETRA", hint: "La A, la B y la C son un ejemplo." },
            { word: "NUMERO", hint: "El 1, el 2 y el 3 son un ejemplo." },
            { word: "LAPIZ", hint: "Lo usamos en la escuela para escribir en el cuaderno." },
            { word: "COLOR", hint: "Rojo, azul y amarillo son un ejemplo." },
            { word: "MUSICA", hint: "Lo que escuchamos cuando queremos bailar o cantar." },
            { word: "CELULAR", hint: "El teléfono inteligente que mamá o papá llevan en el bolsillo." },
            { word: "RELOJ", hint: "Hace tic-tac y nos dice qué hora es." },
            { word: "INTERNET", hint: "La magia invisible que necesitamos para ver YouTube." },
            { word: "BOTON", hint: "Lo apretamos con el dedo para prender la computadora." },
            { word: "DIBUJO", hint: "Lo que hacemos con crayones sobre una hoja blanca." },
            { word: "VIRUS", hint: "Un bichito malo que hace que la computadora se enferme." },
            { word: "CARPETA", hint: "Donde guardamos hojas ordenadas para que no se pierdan." },
            { word: "TAREA", hint: "Lo que la maestra nos da para hacer en casa." },
            { word: "CLAVE", hint: "Palabra súper secreta para que nadie entre a nuestro juego." },
            { word: "SONIDO", hint: "Lo que sale por los parlantes cuando vemos una peli." },
            { word: "FLECHA", hint: "El puntero chiquito que se mueve por toda la pantalla." },
            { word: "CAMARA", hint: "El ojito de cristal que nos graba cuando hacemos videollamada." },
            { word: "LUZ", hint: "Lo que prendemos cuando está muy oscuro para poder ver." },
            { word: "PIZARRA", hint: "Donde la profe escribe con tiza o marcador en la clase." }
        ];

        // Variables de Nivel
        let gameWords = [];
        let currentLevel = 1;
        const maxLevels = 20;

        // Variables del juego en curso
        let selectedItem = {};
        let guessedLetters = [];
        let mistakes = 0;
        const maxMistakes = 6;

        const wordDisplay = document.getElementById("word-display");
        const hintDisplay = document.getElementById("hint-display");
        const keyboard = document.getElementById("keyboard");
        const mistakesCount = document.getElementById("mistakes-count");
        const canvas = document.getElementById("hangman-canvas");
        const ctx = canvas.getContext("2d");
        const levelDisplay = document.getElementById("level-display");
        
        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modal-title");
        const modalSubtitle = document.getElementById("modal-subtitle");
        const iconWin = document.getElementById("icon-win");
        const iconLose = document.getElementById("icon-lose");

        // Inicia el juego desde el nivel 1
        function startFullGame() {
            // Mezclar la lista de palabras y tomar las primeras 20
            let shuffled = [...data].sort(() => 0.5 - Math.random());
            gameWords = shuffled.slice(0, maxLevels);
            
            currentLevel = 1;
            loadLevel();
        }

        // Carga la interfaz del nivel actual
        function loadLevel() {
            selectedItem = gameWords[currentLevel - 1];
            guessedLetters = [];
            mistakes = 0;
            
            modal.classList.remove("active");
            mistakesCount.innerText = mistakes;
            hintDisplay.innerText = selectedItem.hint;
            levelDisplay.innerText = `Nivel ${currentLevel} de ${maxLevels}`;
            
            drawHangman(0);
            renderWord();
            renderKeyboard();
            
            document.removeEventListener('keydown', handlePhysicalKeyboard);
            document.addEventListener('keydown', handlePhysicalKeyboard);
        }

        function renderWord() {
            wordDisplay.innerHTML = "";
            let isWon = true;

            for (let letter of selectedItem.word) {
                const div = document.createElement("div");
                if (guessedLetters.includes(letter)) {
                    div.innerText = letter;
                    div.className = "letter-slot filled";
                } else {
                    div.innerText = "";
                    div.className = "letter-slot";
                    isWon = false;
                }
                wordDisplay.appendChild(div);
            }

            // Si completa la palabra, pasar automático o ganar el juego
            if (isWon) {
                document.removeEventListener('keydown', handlePhysicalKeyboard); // Bloquear teclado
                setTimeout(() => {
                    if (currentLevel < maxLevels) {
                        currentLevel++;
                        loadLevel(); // Auto-pasa al siguiente nivel
                    } else {
                        endGame(true); // Gana los 20 niveles
                    }
                }, 1200); // Espera 1.2 segundos para que el niño vea la palabra completa
            }
        }

        function renderKeyboard() {
            keyboard.innerHTML = "";
            const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
            
            for (let letter of alphabet) {
                const btn = document.createElement("button");
                btn.classList.add("key");
                btn.innerText = letter;
                btn.id = `key-${letter}`;
                
                btn.addEventListener("click", () => handleGuess(letter));
                keyboard.appendChild(btn);
            }
        }

        function handlePhysicalKeyboard(e) {
            const letter = e.key.toUpperCase();
            if (/^[A-ZÑ]$/.test(letter)) {
                if (!guessedLetters.includes(letter) && mistakes < maxMistakes) {
                    handleGuess(letter);
                }
            }
        }

        function handleGuess(letter) {
            if (guessedLetters.includes(letter) || mistakes >= maxMistakes) return;
            
            guessedLetters.push(letter);
            const btn = document.getElementById(`key-${letter}`);
            btn.disabled = true;

            if (selectedItem.word.includes(letter)) {
                btn.classList.add("correct");
                renderWord();
            } else {
                btn.classList.add("wrong");
                mistakes++;
                mistakesCount.innerText = mistakes;
                drawHangman(mistakes);
                
                // Si pierde el nivel
                if (mistakes >= maxMistakes) {
                    document.removeEventListener('keydown', handlePhysicalKeyboard);
                    setTimeout(() => endGame(false), 500);
                }
            }
        }

        function drawHangman(step) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            
            ctx.beginPath();
            ctx.moveTo(30, 200); ctx.lineTo(150, 200); 
            ctx.moveTo(60, 200); ctx.lineTo(60, 20);   
            ctx.moveTo(56, 20); ctx.lineTo(130, 20);   
            ctx.moveTo(130, 20); ctx.lineTo(130, 40);  
            ctx.stroke();

            ctx.beginPath();
            if (step >= 1) ctx.arc(130, 65, 25, 0, Math.PI * 2); 
            if (step >= 2) { ctx.moveTo(130, 90); ctx.lineTo(130, 140); }
            if (step >= 3) { ctx.moveTo(130, 105); ctx.lineTo(100, 130); }
            if (step >= 4) { ctx.moveTo(130, 105); ctx.lineTo(160, 130); }
            if (step >= 5) { ctx.moveTo(130, 140); ctx.lineTo(105, 180); }
            if (step >= 6) { 
                ctx.moveTo(130, 140); ctx.lineTo(155, 180); 
                
                ctx.stroke();
                ctx.strokeStyle = "#ef4444";
                
                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.moveTo(118, 55); ctx.lineTo(126, 63);
                ctx.moveTo(126, 55); ctx.lineTo(118, 63);
                
                ctx.moveTo(134, 55); ctx.lineTo(142, 63);
                ctx.moveTo(142, 55); ctx.lineTo(134, 63);
                
                ctx.moveTo(122, 75);
                ctx.quadraticCurveTo(130, 68, 138, 75);
            }
            ctx.stroke();
            
            if (step > 0 && step < 6) {
                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.moveTo(122, 58); ctx.lineTo(122, 62);
                ctx.moveTo(138, 58); ctx.lineTo(138, 62);
                ctx.moveTo(122, 70);
                ctx.quadraticCurveTo(130, 80, 138, 70);
                ctx.stroke();
            }
        }

        // Finaliza el juego por ganar los 20 niveles o perder
        function endGame(isWin) {
            modal.classList.add("active");
            
            if (isWin) {
                iconWin.style.display = "block";
                iconLose.style.display = "none";
                modalTitle.innerText = "¡Ganaste el Juego!";
                modalTitle.style.color = "var(--success)";
                modalSubtitle.innerHTML = `¡Completaste los 20 niveles! Eres un genio.`;
            } else {
                iconWin.style.display = "none";
                iconLose.style.display = "block";
                modalTitle.innerText = "¡Uy, casi!";
                modalTitle.style.color = "var(--danger)";
                modalSubtitle.innerHTML = `La palabra era: <strong>${selectedItem.word}</strong><br><br>Llegaste hasta el Nivel ${currentLevel}.`;
            }
        }

        // Cargar todo al iniciar
        window.onload = startFullGame;
    </script>

<script>
/* ===== ESPECTACULAR: efectos, sonido, mascota, dibujo animado ===== */
const fx=document.getElementById('fx'),fc=fx.getContext('2d'); let FP=[];
const rs=()=>{fx.width=innerWidth;fx.height=innerHeight}; rs(); addEventListener('resize',rs);
const COLS=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#fde047'];
function burst(x,y,n=24){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*7+2;FP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.2,l:1,c:COLS[i%6],w:Math.random()*8+4,r:0,vr:(Math.random()-.5)*.5});}}
function confetti(n=140){for(let i=0;i<n;i++)FP.push({x:Math.random()*fx.width,y:-20-Math.random()*300,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,g:.03,l:2.5,c:COLS[i%6],w:Math.random()*10+5,r:0,vr:(Math.random()-.5)*.3});}
(function loopFx(){fc.clearRect(0,0,fx.width,fx.height);
 FP=FP.filter(p=>p.l>0&&p.y<fx.height+30);
 for(const p of FP){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.011;fc.save();fc.globalAlpha=Math.min(1,p.l);fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fc.restore();}
 requestAnimationFrame(loopFx);})();
/* Fondo flotante */
document.getElementById('bg-float').innerHTML=['💻','🖱️','⌨️','📱','🖥️','💾','🎮','🔌','🌐','⭐','🤖','🧠'].concat(['💻','🖱️','⌨️','🎮','⭐','💾']).map(e=>`<span style="left:${Math.random()*96}%;font-size:${28+Math.random()*36}px;animation-duration:${16+Math.random()*20}s;animation-delay:-${Math.random()*30}s">${e}</span>`).join('');
/* Sonido */
let AC,mute=false;
function tone(f,d=.15,t='sine',v=.12,dl=0){if(mute)return;AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d);}
const sfx={ok:()=>{tone(660,.12);tone(880,.18,'sine',.12,.1)},bad:()=>{tone(200,.35,'sawtooth',.07);tone(140,.4,'sawtooth',.07,.12)},
 lvl:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.1)),win:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.12))};
function toggleSnd(){mute=!mute;document.getElementById('snd').textContent=mute?'🔇':'🔊';}
/* Mascota y banner */
const bub=document.getElementById('bubble');
function say(m){bub.textContent=m;bub.classList.remove('show');void bub.offsetWidth;bub.classList.add('show');}
const pick=a=>a[Math.random()*a.length|0];
function banner(t){const b=document.getElementById('banner');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
/* Estado extra */
let score=0,streak=0,jokers=3,lastLetter='',locked=false;
function ui(){
 document.getElementById('progress').innerHTML=Array.from({length:maxLevels},(_,i)=>`<div class="seg ${i<currentLevel-1?'done':i==currentLevel-1?'cur':''}"></div>`).join('');
 document.getElementById('hearts').innerHTML=Array.from({length:maxMistakes},(_,i)=>`<span class="heart ${i<mistakes?'lost':''}">❤️</span>`).join('');
 document.getElementById('score').textContent=score;document.getElementById('streak').textContent='🔥 x'+Math.max(1,Math.min(streak,5));
 document.getElementById('jk').textContent=jokers;document.getElementById('joker').classList.toggle('off',jokers<=0);}
const _ll=loadLevel;
loadLevel=function(){lastLetter='';locked=false;_ll();ui();const gl=document.querySelector('.game-layout');gl.classList.remove('level-in');void gl.offsetWidth;gl.classList.add('level-in');say(currentLevel==1?'¡Tú puedes!':pick(['¡Vamos!','¡Otra palabra!','¡Qué bien vas!']));};
const _sf=startFullGame;
startFullGame=function(){score=0;streak=0;jokers=3;_sf();};
const _rk=renderKeyboard;
renderKeyboard=function(){_rk();[...keyboard.children].forEach((k,i)=>k.style.setProperty('--h',i*13));};
renderWord=function(){
 wordDisplay.innerHTML="";let won=true;
 for(const L of selectedItem.word){const d=document.createElement('div');
  if(guessedLetters.includes(L)){d.innerText=L;d.className='letter-slot filled'+(L===lastLetter?' new':'');}else{d.className='letter-slot';won=false;}
  wordDisplay.appendChild(d);
  if(d.classList.contains('new'))setTimeout(()=>{const r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,16);},0);}
 if(won){locked=true;document.removeEventListener('keydown',handlePhysicalKeyboard);score+=50;sfx.lvl();confetti(90);
  banner(currentLevel<maxLevels?'¡Nivel superado!':'¡CAMPEÓN!');say('¡Genial!');ui();
  setTimeout(()=>{if(currentLevel<maxLevels){currentLevel++;loadLevel();}else endGame(true);},1600);}
};
const _hg=handleGuess;
handleGuess=function(l){
 if(locked||guessedLetters.includes(l)||mistakes>=maxMistakes)return;
 const before=mistakes;lastLetter=l;_hg(l);
 if(mistakes>before){streak=0;sfx.bad();say(pick(['¡Ups!','¡Casi!','¡Otra vez!']));
  const c=document.querySelector('.canvas-container');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
 else if(!locked){streak++;score+=10*Math.min(streak,5);sfx.ok();say(pick(['¡Muy bien!','¡Esa es!','¡Genial!']));}
 ui();};
function useJoker(){
 if(jokers<=0||locked||mistakes>=maxMistakes||modal.classList.contains('active'))return;
 const pool=[...new Set(selectedItem.word)].filter(l=>!guessedLetters.includes(l));if(!pool.length)return;
 jokers--;handleGuess(pick(pool));}
const _eg=endGame;
endGame=function(w){_eg(w);modalSubtitle.insertAdjacentHTML('beforeend',`<br><span style="font-size:20px">Puntos: ⭐ ${score}</span>`);
 if(w){confetti(320);sfx.win();}else{sfx.bad();say('¡No te rindas!');}};
/* Dibujo animado del ahorcado */
let shown=0;
drawHangman=function(step){if(step===0)shown=0;};
function cloud(x,y,k=1){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x,y,10*k,0,6.283);ctx.arc(x+12*k,y-5*k,12*k,0,6.283);ctx.arc(x+26*k,y,10*k,0,6.283);ctx.fill();}
const ez=p=>1-Math.pow(1-p,3);
function scene(t){
 ctx.setTransform(2,0,0,2,0,0);ctx.lineCap='round';ctx.lineJoin='round';
 const g=ctx.createLinearGradient(0,0,0,220);g.addColorStop(0,'#7dd3fc');g.addColorStop(1,'#fef9c3');ctx.fillStyle=g;ctx.fillRect(0,0,180,220);
 ctx.fillStyle='#fde047';ctx.shadowColor='#fde047';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(30,32,14,0,6.283);ctx.fill();ctx.shadowBlur=0;
 cloud(((t/60)%240)-40,45);cloud(((t/110+110)%240)-40,80,.7);
 ctx.fillStyle='#4ade80';ctx.fillRect(0,196,180,24);ctx.fillStyle='#22c55e';ctx.fillRect(0,196,180,4);
 ctx.strokeStyle='#92400e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(30,198);ctx.lineTo(150,198);ctx.moveTo(60,198);ctx.lineTo(60,20);ctx.moveTo(56,20);ctx.lineTo(132,20);ctx.moveTo(60,60);ctx.lineTo(85,22);ctx.stroke();
 ctx.strokeStyle='#d97706';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(62,196);ctx.lineTo(62,22);ctx.moveTo(58,18);ctx.lineTo(130,18);ctx.stroke();
 shown+=(mistakes-shown)*.1;
 ctx.save();ctx.translate(130,20);ctx.rotate(Math.sin(t/450)*(mistakes?.05:.01));ctx.translate(-130,-20);
 ctx.strokeStyle='#d6a15f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(130,20);ctx.lineTo(130,40);ctx.stroke();
 const P=i=>Math.max(0,Math.min(1,shown-(i-1))),line=(i,x1,y1,x2,y2,c,w)=>{const p=ez(P(i));if(p<=0)return;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);ctx.stroke();};
 line(5,130,140,105,180,'#1e293b',7);line(6,130,140,155,180,'#1e293b',7);
 line(2,130,90,130,140,'#6366f1',11);line(3,130,102,100,130,'#6366f1',7);line(4,130,102,160,130,'#6366f1',7);
 const hp=ez(P(1));if(hp>0){ctx.fillStyle='#fcd9b6';ctx.strokeStyle='#334155';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(130,65,25*hp,0,6.283);ctx.fill();ctx.stroke();
  if(hp>.9){ctx.lineWidth=3;ctx.strokeStyle=mistakes>=6?'#ef4444':'#334155';ctx.beginPath();
   if(mistakes>=6){[[118,55],[134,55]].forEach(([x,y])=>{ctx.moveTo(x,y);ctx.lineTo(x+8,y+8);ctx.moveTo(x+8,y);ctx.lineTo(x,y+8);});ctx.moveTo(121,77);ctx.quadraticCurveTo(130,68,139,77);}
   else{ctx.moveTo(122,58);ctx.lineTo(122,62);ctx.moveTo(138,58);ctx.lineTo(138,62);ctx.moveTo(122,71);ctx.quadraticCurveTo(130,mistakes<3?80:72,138,71);}
   ctx.stroke();if(mistakes>=4){ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(146,64+Math.sin(t/200)*2,3,0,6.283);ctx.fill();}}}
 ctx.restore();requestAnimationFrame(scene);}
requestAnimationFrame(scene);
