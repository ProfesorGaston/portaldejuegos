<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raft Math - Prof. Gastón </title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    
    body {
        background-color: #000;
        font-family: 'Fredoka One', cursive;
        display: flex; justify-content: center; align-items: center;
        height: 100vh; width: 100vw; overflow: hidden; color: white;
    }

    #game-wrapper {
        position: relative;
        background: #000;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        container-type: size; 
    }

    canvas {
        display: block; width: 100%; height: 100%;
        position: absolute; top: 0; left: 0; z-index: 10;
    }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
    
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 8, 10, 0.85); backdrop-filter: blur(5px); pointer-events: auto; transition: opacity 0.4s ease;}
    .hidden { opacity: 0; pointer-events: none; display: none !important; }

    h1 { 
        font-size: 10cqmin; color: #fff; 
        text-shadow: 0 1cqmin 2cqmin rgba(0,0,0,0.5), 0 0 2cqmin #f1c40f, 0 0 4cqmin #f39c12; 
        text-align: center; margin-bottom: 3cqmin; line-height: 1.1; letter-spacing: 2px;
    }
    
    .btn { 
        background: linear-gradient(to bottom, #e74c3c, #c0392b); border: 0.5cqmin solid #ff7979; 
        color: white; padding: 2cqmin 4cqmin; font-size: 4cqmin; border-radius: 4cqmin; 
        font-family: 'Fredoka One'; cursor: pointer; margin: 1.5cqmin; text-transform: uppercase; 
        box-shadow: 0 1cqmin 0 #922b21, 0 2cqmin 2cqmin rgba(0,0,0,0.5); transition: 0.1s; width: 50cqmin;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.3); pointer-events: auto;
    }
    .btn:hover { filter: brightness(1.15); transform: translateY(-3px); box-shadow: 0 1.2cqmin 0 #922b21, 0 2cqmin 2.5cqmin rgba(0,0,0,0.6); }
    .btn:active { transform: translateY(1cqmin); box-shadow: 0 0 0 #922b21; }
    
    .btn.facil { background: linear-gradient(to bottom, #2ecc71, #27ae60); border-color: #58d68d; box-shadow: 0 1cqmin 0 #1e8449, 0 2cqmin 2cqmin rgba(0,0,0,0.5); }
    .btn.facil:active { box-shadow: 0 0 0 #1e8449; }
    .btn.medio { background: linear-gradient(to bottom, #f1c40f, #f39c12); border-color: #f7dc6f; box-shadow: 0 1cqmin 0 #d68910, 0 2cqmin 2cqmin rgba(0,0,0,0.5); }
    .btn.medio:active { box-shadow: 0 0 0 #d68910; }

    #hud { position: absolute; top: 3cqmin; width: 100%; display: flex; justify-content: space-between; padding: 0 4cqmin; font-size: 5cqmin; text-shadow: 0 0.5cqmin 1cqmin rgba(0,0,0,0.8); }
    #lives { font-size: 75%; display: flex; gap: 0.5cqmin; align-items: center;}

    #math-board { 
        position: absolute; top: 3cqmin; left: 50%; transform: translateX(-50%); 
        background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
        color: #2c3e50; padding: 1.5cqmin 5cqmin; border-radius: 3cqmin; font-size: 6cqmin; 
        border: 0.8cqmin solid #fff; box-shadow: 0 1cqmin 3cqmin rgba(0,0,0,0.4), inset 0 0 1.5cqmin rgba(255,255,255,1); 
    }

    .watermark { position: absolute; bottom: 2cqmin; right: 2cqmin; font-family: sans-serif; font-size: 2cqmin; color: rgba(255,255,255,0.7); font-weight: bold; background: rgba(0,0,0,0.5); padding: 1cqmin 2cqmin; border-radius: 1.5cqmin;}
    
    #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ff4757; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 30; mix-blend-mode: overlay; }

    .help-text { position: absolute; bottom: 12cqmin; width: 100%; text-align: center; font-size: 4cqmin; color: #fff; text-shadow: 0 0.5cqmin 1.5cqmin #000; animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1.05); } }

</style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <div id="damage-flash"></div>
    <div class="watermark">Creado por el Prof. Gastón</div>

    <div id="ui-layer">
        <div id="hud-ingame" class="hidden">
            <div id="hud">
                <div style="color: #f1c40f;">⭐ <span id="score">0</span></div>
                <div id="lives"></div>
            </div>
            <div id="math-board"><span id="division-text">0 ÷ 0</span></div>
            <div class="help-text" id="drag-hint">¡Arrastra desde el Bebé hacia atrás para apuntar!</div>
        </div>

        <div id="menu" class="screen">
            <h1>RAFT WARS<br>MATH</h1>
            <button class="btn facil" onclick="startGame(1)">Grumete (Div: 2-3)</button>
            <button class="btn medio" onclick="startGame(2)">Bucanero (Div: 4-6)</button>
            <button class="btn" onclick="startGame(3)">Capitán (Div: 7-9)</button>
        </div>

        <div id="game-over" class="screen hidden">
            <h1 style="color: #ff4757; font-size: 12cqmin; text-shadow: 0 1cqmin 3cqmin rgba(255,71,87,0.5);">¡AL AGUA!</h1>
            <h2 style="font-size: 6cqmin; color: #f1c40f; margin-bottom: 5cqmin; text-shadow: 0 0.5cqmin 1.5cqmin rgba(0,0,0,0.5);">Puntaje: ⭐ <span id="final-score">0</span></h2>
            <button class="btn" onclick="location.reload()">Volver al Puerto</button>
        </div>
    </div>
</div>

<script>
    // --- CACHÉ DE NODOS DOM (Optimización) ---
    const elMenu = document.getElementById('menu');
    const elHudIngame = document.getElementById('hud-ingame');
    const elGameOver = document.getElementById('game-over');
    const elDivisionText = document.getElementById('division-text');
    const elScore = document.getElementById('score');
    const elLives = document.getElementById('lives');
    const elFinalScore = document.getElementById('final-score');
    const elDragHint = document.getElementById('drag-hint');
    const elDamageFlash = document.getElementById('damage-flash');
    
    // --- CONSTANTES MATEMÁTICAS ---
    const PI2 = Math.PI * 2;

    const ac = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type, f1, f2, dur, vol=0.1) {
        if(ac.state === 'suspended') ac.resume();
        let osc = ac.createOscillator(); let gain = ac.createGain();
        osc.type = type; osc.frequency.setValueAtTime(f1, ac.currentTime);
        if(f2) osc.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + dur);
        gain.gain.setValueAtTime(vol, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + dur);
        osc.connect(gain); gain.connect(ac.destination); osc.start(); osc.stop(ac.currentTime + dur);
    }
    const sfx = {
        stretch: () => playSfx('sine', 400, 450, 0.1, 0.05),
        shoot: () => playSfx('sine', 300, 800, 0.4, 0.1),
        cannon: () => playSfx('square', 150, 50, 0.5, 0.3),
        splash: () => playSfx('sawtooth', 800, 200, 0.5, 0.15),
        hitCorrect: () => { playSfx('square', 600, 1200, 0.3, 0.1); setTimeout(()=>playSfx('sine', 1000, 1500, 0.4, 0.1), 100); },
        hitWrong: () => playSfx('sawtooth', 200, 100, 0.5, 0.2)
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1280; const H = 720; const WATER_LEVEL = 480;
    
    // --- CACHÉ DE GRADIENTES ESTÁTICOS (Optimización) ---
    const skyGrd = ctx.createLinearGradient(0, 0, 0, WATER_LEVEL);
    skyGrd.addColorStop(0, "#2c3e50"); skyGrd.addColorStop(0.5, "#4a90e2"); skyGrd.addColorStop(1, "#87ceeb");
    
    const sunGrd = ctx.createRadialGradient(150, 150, 10, 150, 150, 150);
    sunGrd.addColorStop(0, "rgba(255, 234, 112, 1)"); sunGrd.addColorStop(0.3, "rgba(255, 234, 112, 0.8)"); sunGrd.addColorStop(1, "rgba(255, 234, 112, 0)");

    const vignetteGrd = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, W/1.2);
    vignetteGrd.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGrd.addColorStop(1, 'rgba(0,0,0,0.6)');

    let gameState = 'menu'; let difficulty = 1; let score = 0; let lives = 3; let correctAnswer = 0;
    let time = 0; let shakeTimer = 0;

    const GRAVITY = 0.35; const POWER_MULTIPLIER = 0.18; const MAX_DRAG = 220;

    const player = { x: 200, y: WATER_LEVEL - 20, radius: 45, sinking: false, sinkOffset: 0 };
    let projectiles = []; let targets = []; let particles = []; let floatingTexts = [];
    let isDragging = false; let dragStart = { x: 0, y: 0 }; let dragCurrent = { x: 0, y: 0 }; let aimAngle = 0;

    const birds = [{x: 300, y: 100, s: 1}, {x: 800, y: 80, s: 1.2}, {x: 1100, y: 150, s: 0.8}];

    // Ahora acepta colores CSS puros (ej: "#ff0000") en lugar de strings con "ALPHA"
    function spawnSplash(x, y, colorStr, isExplosion = false) {
        let count = isExplosion ? 50 : 30;
        for(let i=0; i<count; i++) {
            let c = colorStr;
            if (isExplosion) {
                let r = Math.random();
                if (r < 0.3) c = "#ff4500"; 
                else if (r < 0.6) c = "#646464"; 
            }
            particles.push({ 
                x: x, y: y, 
                vx: (Math.random() - 0.5) * (isExplosion ? 25 : 15), 
                vy: (Math.random() - 1) * (isExplosion ? 20 : 15), 
                life: 1.0, decay: Math.random() * 0.03 + 0.015, 
                size: Math.random() * 8 + 4, color: c 
            });
        }
    }

    function spawnFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 60 });
    }

    function startGame(level) {
        difficulty = level; score = 0; lives = 3;
        player.sinking = false; player.sinkOffset = 0;
        elMenu.classList.add('hidden');
        elHudIngame.classList.remove('hidden');
        updateHUD(); nextProblem(); gameLoop();
    }

    function nextProblem() {
        let divisor;
        if (difficulty === 1) divisor = Math.floor(Math.random() * 2) + 2; 
        else if (difficulty === 2) divisor = Math.floor(Math.random() * 3) + 4; 
        else divisor = Math.floor(Math.random() * 3) + 7; 

        let maxAns = 10;
        correctAnswer = Math.floor(Math.random() * maxAns) + 1;
        
        elDivisionText.innerText = `${divisor * correctAnswer} ÷ ${divisor}`;

        let options = [correctAnswer];
        while(options.length < 3) {
            let offset = Math.floor(Math.random() * 9) - 4;
            if(offset === 0) offset = 1;
            let falsa = correctAnswer + offset;
            if(falsa > 0 && !options.includes(falsa)) options.push(falsa);
        }
        options.sort(() => Math.random() - 0.5);

        targets = [
            { x: 1050, y: WATER_LEVEL - 20, radius: 50, value: options[0], active: true, sinking: false, sinkOffset: 0 },
            { x: 780, y: WATER_LEVEL - 20, radius: 50, value: options[1], active: true, sinking: false, sinkOffset: 0 },
            { x: 1220, y: WATER_LEVEL - 20, radius: 50, value: options[2], active: true, sinking: false, sinkOffset: 0 }
        ];

        projectiles = [];
        elDragHint.style.display = 'block';
        gameState = 'aiming'; aimAngle = -Math.PI / 8;
    }

    function drawEnvironment() {
        // Uso de gradientes cacheados
        ctx.fillStyle = skyGrd; ctx.fillRect(0, 0, W, WATER_LEVEL);
        ctx.fillStyle = sunGrd; ctx.beginPath(); ctx.arc(150, 150, 150, 0, PI2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(150, 150, 40, 0, PI2); ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.4)";
        let cx1 = 700 - (time*4)%1500;
        ctx.beginPath(); ctx.arc(cx1, 200, 50, 0, PI2); ctx.arc(cx1+60, 180, 70, 0, PI2); ctx.arc(cx1+130, 210, 45, 0, PI2); ctx.fill();
        
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        let cx2 = 900 - (time*8)%1500;
        // Eliminado shadowBlur de las nubes (mejora de rendimiento), simulado con círculos más suaves o simplemente dibujándolas claras.
        ctx.beginPath(); ctx.arc(cx2, 120, 40, 0, PI2); ctx.arc(cx2+50, 100, 60, 0, PI2); ctx.arc(cx2+110, 130, 35, 0, PI2); ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
        birds.forEach(b => {
            let bx = b.x - (time * 15 * b.s) % (W + 200);
            if (bx < -100) bx += W + 200;
            let by = b.y + Math.sin(time * 5 * b.s) * 10;
            let wingY = by - Math.abs(Math.sin(time * 10 * b.s)) * 15; 
            ctx.beginPath(); ctx.moveTo(bx, wingY); ctx.lineTo(bx + 15, by); ctx.lineTo(bx + 30, wingY); ctx.stroke();
        });

        ctx.fillStyle = "#1e4d6b";
        ctx.beginPath(); ctx.moveTo(0, WATER_LEVEL); ctx.lineTo(150, WATER_LEVEL - 80); ctx.lineTo(350, WATER_LEVEL - 30); ctx.lineTo(600, WATER_LEVEL - 120); ctx.lineTo(850, WATER_LEVEL); ctx.fill();
        ctx.fillStyle = "#153a52";
        ctx.beginPath(); ctx.moveTo(700, WATER_LEVEL); ctx.lineTo(950, WATER_LEVEL - 90); ctx.lineTo(1280, WATER_LEVEL - 40); ctx.lineTo(1280, WATER_LEVEL); ctx.fill();

        drawWaveLayer(WATER_LEVEL - 20, 50, 2, "rgba(41, 128, 185, 0.7)", 0.5, true); 
        drawWaveLayer(WATER_LEVEL - 5, 70, -1, "rgba(31, 97, 141, 0.8)", 0.8, true); 
    }

    function drawWaveLayer(baseY, ampX, speedMult, color, heightAmp, drawFoam = false) {
        ctx.fillStyle = color; 
        ctx.beginPath();
        for(let x=0; x<=W; x+=40) ctx.lineTo(x, baseY + Math.sin(x/ampX + time*speedMult)*15*heightAmp); // Paso de 20 a 40 (x2 de rendimiento en olas sin impacto visual)
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

        if (drawFoam) {
            ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let x=0; x<=W; x+=40) ctx.lineTo(x, baseY + Math.sin(x/ampX + time*speedMult)*15*heightAmp);
            ctx.stroke();
        }
    }
    
    function drawForegroundWater() { drawWaveLayer(WATER_LEVEL + 15, 90, 1.5, "rgba(21, 67, 96, 0.95)", 1, true); }

    function drawPlayer() {
        if(player.sinking) player.sinkOffset += 3;

        let bobY = player.y + Math.sin(time*2)*5 + player.sinkOffset;
        let px = player.x; let py = bobY - 20;

        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(px, bobY + 30, 60, 10, 0, 0, PI2); ctx.fill();

        let ringGrd = ctx.createLinearGradient(px-60, bobY-20, px+60, bobY+30);
        ringGrd.addColorStop(0, "#ff7675"); ringGrd.addColorStop(0.5, "#d63031"); ringGrd.addColorStop(1, "#8e44ad");
        ctx.fillStyle = ringGrd; ctx.beginPath(); ctx.ellipse(px, bobY + 15, 65, 25, 0, 0, PI2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(px, bobY + 15, 45, 15, 0, 0, PI2); ctx.fill();
        
        ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(px-55, bobY+5); ctx.lineTo(px-40, bobY+35); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px+55, bobY+5); ctx.lineTo(px+40, bobY+35); ctx.stroke();

        let skin = ctx.createRadialGradient(px, py-10, 5, px, py+10, 30);
        skin.addColorStop(0, "#ffeaa7"); skin.addColorStop(1, "#e1b12c");
        ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(px, py, 30, 0, PI2); ctx.fill(); 
        
        ctx.fillStyle = "rgba(255,100,100,0.4)"; ctx.beginPath(); ctx.arc(px+15, py+5, 6, 0, PI2); ctx.fill();
        ctx.fillStyle = '#2f3542'; ctx.beginPath(); ctx.arc(px + 12, py - 2, 4, 0, PI2); ctx.fill();
        
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py - 25, 20, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#0984e3'; ctx.fillRect(px - 22, py - 28, 44, 6);

        if(isDragging && gameState === 'aiming') aimAngle = Math.atan2(dragStart.y - dragCurrent.y, dragStart.x - dragCurrent.x);
        
        ctx.save();
        ctx.translate(px + 15, py + 10);
        ctx.rotate(aimAngle);
        
        let gunGrd = ctx.createLinearGradient(0, -10, 0, 5);
        gunGrd.addColorStop(0, "#2ecc71"); gunGrd.addColorStop(1, "#27ae60");
        ctx.fillStyle = gunGrd; ctx.fillRect(0, -10, 45, 16); 
        ctx.fillStyle = '#0984e3'; ctx.beginPath(); ctx.arc(22, -15, 12, Math.PI, 0); ctx.fill(); 
        ctx.fillStyle = '#74b9ff'; ctx.beginPath(); ctx.arc(18, -18, 4, 0, PI2); ctx.fill();
        ctx.fillStyle = '#e67e22'; ctx.fillRect(40, -7, 12, 10); 
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(10, 6, 10, 18); 
        
        ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(12, 6, 8, 0, PI2); ctx.fill(); 
        ctx.restore();
    }

    function drawPirates() {
        targets.forEach(t => {
            if(!t.active) return;
            
            if(t.sinking) {
                t.sinkOffset += 3;
                if(t.sinkOffset > 250) t.active = false;
            }

            let floatY = t.y + Math.sin(time * 1.5 + t.x)*8 + t.sinkOffset;

            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(t.x, floatY + 30, 65, 12, 0, 0, PI2); ctx.fill();

            ctx.fillStyle = "#5c3a21"; ctx.fillRect(t.x + 30, floatY - 80, 8, 90);
            ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.moveTo(t.x + 38, floatY - 80); ctx.lineTo(t.x + 80, floatY - 65); ctx.lineTo(t.x + 38, floatY - 50); ctx.fill();

            let woodGrd = ctx.createLinearGradient(t.x, floatY, t.x, floatY+25);
            woodGrd.addColorStop(0, "#d35400"); woodGrd.addColorStop(1, "#8b4513");
            ctx.fillStyle = woodGrd;
            for(let i=-1; i<=1; i++) {
                let logY = floatY + 5 + i*8;
                ctx.beginPath(); ctx.roundRect(t.x - 55, logY, 110, 12, 6); ctx.fill();
                ctx.strokeStyle = "#5c3a21"; ctx.lineWidth = 1; ctx.stroke();
                ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.moveTo(t.x - 40, logY + 4); ctx.lineTo(t.x + 40, logY + 4); ctx.stroke();
            }

            let metalGrd = ctx.createLinearGradient(t.x - 60, floatY - 10, t.x - 60, floatY + 10);
            metalGrd.addColorStop(0, "#95a5a6"); metalGrd.addColorStop(0.5, "#34495e"); metalGrd.addColorStop(1, "#2c3e50");
            ctx.fillStyle = metalGrd; ctx.fillRect(t.x - 60, floatY - 5, 50, 16); 
            ctx.fillStyle = '#1a252f'; ctx.beginPath(); ctx.ellipse(t.x - 60, floatY + 3, 6, 12, 0, 0, PI2); ctx.fill(); 
            ctx.fillStyle = '#7f8c8d'; ctx.beginPath(); ctx.arc(t.x - 30, floatY + 6, 14, 0, PI2); ctx.fill(); 
            ctx.fillStyle = '#bdc3c7'; ctx.beginPath(); ctx.arc(t.x - 30, floatY + 6, 4, 0, PI2); ctx.fill();

            let skin = ctx.createRadialGradient(t.x, floatY-25, 5, t.x, floatY-25, 25);
            skin.addColorStop(0, "#ffeaa7"); skin.addColorStop(1, "#e1b12c");
            
            ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.arc(t.x, floatY - 15, 20, 0, PI2); ctx.fill();
            ctx.fillStyle = '#c0392b'; ctx.fillRect(t.x - 20, floatY - 20, 40, 5); ctx.fillRect(t.x - 20, floatY - 10, 40, 5);

            ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(t.x, floatY - 35, 22, 0, PI2); ctx.fill(); 
            
            ctx.fillStyle = '#2f3542'; ctx.beginPath(); ctx.arc(t.x - 10, floatY - 35, 6, 0, PI2); ctx.fill();
            ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(t.x-22, floatY-40); ctx.lineTo(t.x+22, floatY-25); ctx.stroke();
            
            ctx.fillStyle = '#222'; 
            ctx.beginPath(); ctx.ellipse(t.x, floatY-50, 38, 14, 0, 0, PI2); ctx.fill();
            ctx.beginPath(); ctx.arc(t.x, floatY-55, 22, Math.PI, 0); ctx.fill();
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4; ctx.stroke(); 

            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(t.x - 25, floatY - 10, 8, Math.PI/2, Math.PI*1.5); ctx.stroke();

            let boardY = floatY - 120;
            ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.roundRect(t.x - 30, boardY, 60, 50, 8); ctx.fill();
            ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#c0392b'; ctx.font = '900 32px Fredoka One';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.value, t.x, boardY + 28);
        });
    }

    function drawTrajectory() {
        if(!isDragging || gameState !== 'aiming') return;

        let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
        let dist = Math.hypot(dx, dy);
        if(dist > MAX_DRAG) { dx = (dx/dist)*MAX_DRAG; dy = (dy/dist)*MAX_DRAG; }

        let vx = dx * POWER_MULTIPLIER; let vy = dy * POWER_MULTIPLIER;
        
        let px = player.x + 15 + Math.cos(aimAngle)*45;
        let py = player.y + Math.sin(time*2)*5 - 10 + Math.sin(aimAngle)*45;

        ctx.fillStyle = "#fff";
        for(let i=0; i<30; i++) {
            px += vx * 2.5; py += vy * 2.5; vy += GRAVITY * 2.5;
            let alpha = 1 - i/30;
            let r = 6 - (i*0.1);
            
            // Reemplazo de shadowBlur (pesado) por círculos opacos superpuestos (muy ligero)
            ctx.globalAlpha = alpha * 0.3;
            ctx.beginPath(); ctx.arc(px, py, r + 4, 0, PI2); ctx.fill();
            
            ctx.globalAlpha = alpha;
            ctx.beginPath(); ctx.arc(px, py, r, 0, PI2); ctx.fill();
        }
        ctx.globalAlpha = 1.0; // Reset
    }

    function drawProjectiles() {
        projectiles.forEach(p => {
            p.history.push({x: p.x, y: p.y}); if(p.history.length > 6) p.history.shift();
            
            // Historial/estela optimizado con globalAlpha
            ctx.fillStyle = p.type === 'tennis' ? "#adff2f" : "#e74c3c";
            for(let i=0; i<p.history.length; i++) {
                ctx.globalAlpha = i/12;
                ctx.beginPath(); ctx.arc(p.history[i].x, p.history[i].y, p.radius * (i/6), 0, PI2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            if(p.type === 'tennis') {
                let rGrd = ctx.createRadialGradient(p.x-3, p.y-3, 2, p.x, p.y, p.radius);
                rGrd.addColorStop(0, "#e0ff4f"); rGrd.addColorStop(1, "#99cc00");
                ctx.fillStyle = rGrd; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, PI2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x-5, p.y, p.radius-3, -Math.PI/2.5, Math.PI/2.5); ctx.stroke();
            } else if(p.type === 'cannon') {
                let rGrd = ctx.createRadialGradient(p.x-5, p.y-5, 3, p.x, p.y, p.radius);
                rGrd.addColorStop(0, "#95a5a6"); rGrd.addColorStop(1, "#2c3e50");
                ctx.fillStyle = rGrd; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, PI2); ctx.fill();
                ctx.fillStyle = "rgba(231, 76, 60, 0.4)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 10, 0, PI2); ctx.fill();
            }
        });
    }

    function drawParticles() {
        for(let i = particles.length-1; i>=0; i--) {
            let p = particles[i];
            ctx.globalAlpha = p.life; // Optimización masiva: sin reemplazo de strings
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, PI2); ctx.fill();
            
            p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= p.decay;
            if(p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    function drawFloatingTexts() {
        ctx.font = '900 40px Fredoka One'; ctx.textAlign = 'center';
        // Desactivado shadowBlur aquí también para máximo rendimiento
        for(let i = floatingTexts.length-1; i>=0; i--) {
            let ft = floatingTexts[i];
            ctx.globalAlpha = ft.life / 60;
            ctx.fillStyle = '#000'; ctx.fillText(ft.text, ft.x + 2, ft.y + 2); // Sombra falsa ligera
            ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
            
            ft.y -= 1.5; ft.life--;
            if(ft.life <= 0) floatingTexts.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    function drawVignette() {
        ctx.fillStyle = vignetteGrd;
        ctx.fillRect(0, 0, W, H);
    }

    function getPointer(e) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
        let cx = e.touches ? e.touches[0].clientX : e.clientX; let cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function onDown(e) {
        if(gameState !== 'aiming') return;
        let p = getPointer(e);
        if(Math.hypot(p.x - player.x, p.y - player.y) < 180) {
            isDragging = true; dragStart = { x: player.x, y: player.y - 15 }; dragCurrent = p;
            sfx.stretch(); elDragHint.style.display = 'none';
        }
    }

    function onMove(e) { if(isDragging) dragCurrent = getPointer(e); }

    function onUp(e) {
        if(!isDragging) return; isDragging = false;
        let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
        let dist = Math.hypot(dx, dy);
        if(dist > MAX_DRAG) { dx = (dx/dist)*MAX_DRAG; dy = (dy/dist)*MAX_DRAG; }
        if(dist < 30) return; 

        projectiles.push({
            type: 'tennis',
            x: player.x + 15 + Math.cos(aimAngle)*45, 
            y: player.y + Math.sin(time*2)*5 - 10 + Math.sin(aimAngle)*45,
            vx: dx * POWER_MULTIPLIER, vy: dy * POWER_MULTIPLIER,
            radius: 14, history: []
        });
        gameState = 'player_shoot'; sfx.shoot();
    }

    canvas.addEventListener('mousedown', onDown); canvas.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', (e)=>{e.preventDefault(); onDown(e);}, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{e.preventDefault(); onMove(e);}, {passive:false}); window.addEventListener('touchend', onUp);

    function updatePhysics() {
        for(let i = projectiles.length-1; i>=0; i--) {
            let p = projectiles[i];
            p.x += p.vx; p.y += p.vy; p.vy += GRAVITY;

            if(p.y > WATER_LEVEL + 40) {
                sfx.splash(); spawnSplash(p.x, p.y, "#add8e6"); projectiles.splice(i, 1);
                if(gameState === 'player_shoot') initiateEnemyTurn(); else if(gameState === 'enemy_shoot') gameState = 'aiming';
                continue;
            }
            if(p.x > W + 200 || p.x < -200) {
                projectiles.splice(i, 1);
                if(gameState === 'player_shoot') initiateEnemyTurn();
                continue;
            }

            if(p.type === 'tennis') {
                for(let t of targets) {
                    if(!t.active || t.sinking) continue;
                    let floatY = t.y + Math.sin(time * 1.5 + t.x)*8;
                    if(Math.hypot(p.x - t.x, p.y - (floatY - 20)) < p.radius + t.radius) {
                        projectiles.splice(i, 1);
                        if(t.value === correctAnswer) {
                            t.sinking = true; sfx.hitCorrect(); 
                            spawnSplash(t.x, floatY, "#ffd700", true);
                            spawnFloatingText(t.x, floatY - 50, "+10", "#2ecc71");
                            score += 10 * difficulty; updateHUD(); gameState = 'resolving'; setTimeout(nextProblem, 2000);
                        } else {
                            sfx.hitWrong(); 
                            spawnSplash(t.x, floatY, "#e74c3c", true); 
                            spawnFloatingText(t.x, floatY - 50, "¡Fallo!", "#e74c3c");
                            initiateEnemyTurn(t);
                        }
                        break;
                    }
                }
            }

            if(p.type === 'cannon') {
                if(Math.hypot(p.x - player.x, p.y - player.y) < p.radius + player.radius && !player.sinking) {
                    projectiles.splice(i, 1); sfx.splash(); 
                    spawnSplash(player.x, player.y, "#e74c3c", true); 
                    takeDamage();
                }
            }
        }
    }

    function initiateEnemyTurn(shooterTarget = null) {
        gameState = 'enemy_shoot';
        let shooter = shooterTarget;
        if(!shooter) {
            let act = targets.filter(t => t.active && !t.sinking);
            if(act.length > 0) shooter = act[Math.floor(Math.random() * act.length)];
        }

        if(shooter) {
            setTimeout(() => {
                sfx.cannon(); 
                let floatY = shooter.y + Math.sin(time * 1.5 + shooter.x)*8;
                spawnSplash(shooter.x - 70, floatY, "#c8c8c8"); 
                
                let dx = player.x - (shooter.x - 60); let dy = player.y - floatY;
                let T = 65; let vx = dx / T; let vy = (dy - 0.5 * GRAVITY * T * T) / T;
                projectiles.push({ type: 'cannon', x: shooter.x - 60, y: floatY, vx: vx, vy: vy, radius: 22, history: [] });
            }, 800);
        } else { gameState = 'aiming'; }
    }

    function takeDamage() {
        sfx.hitWrong(); shakeTimer = 25;
        elDamageFlash.style.opacity = '0.6'; setTimeout(() => elDamageFlash.style.opacity = '0', 200);
        lives--; updateHUD();
        if(lives <= 0) { 
            gameState = 'resolving'; 
            player.sinking = true;
            setTimeout(showGameOver, 2000); 
        } else {
            setTimeout(() => { gameState = 'aiming'; }, 1200);
        }
    }

    function updateHUD() {
        elScore.innerText = score;
        
        let fullHeart = `<svg viewBox="0 0 32 32" width="1em" height="1em" fill="#ff4757" style="filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8));"><path d="M16 28.72l-1.42-1.28C7.5 21.05 3 17 3 11.5 3 7.28 6.28 4 10.5 4c2.38 0 4.67 1.12 6.13 3.09C17.61 5.48 19.5 4 22 4 26.28 4 29.5 7.28 29.5 11.5c0 5.5-4.5 9.55-11.58 15.94L16 28.72z"/></svg>`;
        let emptyHeart = `<svg viewBox="0 0 32 32" width="1em" height="1em" fill="#2d3436" style="filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8));"><path d="M16 28.72l-1.42-1.28C7.5 21.05 3 17 3 11.5 3 7.28 6.28 4 10.5 4c2.38 0 4.67 1.12 6.13 3.09C17.61 5.48 19.5 4 22 4 26.28 4 29.5 7.28 29.5 11.5c0 5.5-4.5 9.55-11.58 15.94L16 28.72z"/></svg>`;
        
        let c = ""; 
        for(let i=0; i<lives; i++) c += fullHeart; 
        for(let i=lives; i<3; i++) c += emptyHeart;
        elLives.innerHTML = c;
    }

    function showGameOver() {
        elHudIngame.classList.add('hidden');
        elGameOver.classList.remove('hidden'); elFinalScore.innerText = score;
    }

    function gameLoop() {
        time += 0.05;
        ctx.save();
        if(shakeTimer > 0) { let dx = (Math.random()-0.5)*15; let dy = (Math.random()-0.5)*15; ctx.translate(dx, dy); shakeTimer--; }
        
        drawEnvironment(); 
        drawPlayer(); 
        drawPirates(); 
        drawTrajectory(); 
        updatePhysics(); 
        drawProjectiles(); 
        drawParticles(); 
        drawForegroundWater();
        drawFloatingTexts();
        drawVignette();

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
