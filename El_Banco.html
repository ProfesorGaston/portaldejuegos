<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Banco | Prof. Gastón</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
:root{--gold:#ffcc33;--neon:#5eead4;--pink:#f472b6;--glass:rgba(6,22,18,.66);--line:rgba(232,205,140,.24)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;user-select:none}
body{min-height:100vh;display:flex;color:#fff;overflow-x:hidden;background:#0e2b25}
/* Interior del banco */
#lobby{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:
 linear-gradient(#0b221d,#133a31 62%,#0b221d 100%)}
#lobby .wall{position:absolute;inset:0 0 34% 0;background:repeating-linear-gradient(90deg,#0000 0 150px,#0004 150px 153px,#c9a24b22 153px 154px),radial-gradient(ellipse at 50% 30%,#2f6b5a55,transparent 65%)}
#lobby .wain{position:absolute;left:0;right:0;bottom:34%;height:11%;background:repeating-linear-gradient(90deg,#4a2c17 0 110px,#3a2212 110px 114px);border-top:5px solid #c9a24b;box-shadow:0 -3px 14px #0008,inset 0 12px 20px #0006}
#lobby .vault{position:absolute;left:50%;top:6%;width:min(46vh,380px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;opacity:.5;
 background:radial-gradient(circle,#9ca3af 0 7%,#4b5563 8% 10%,#6b7280 11% 56%,#d1d5db 57% 60%,#4b5563 61% 88%,#9ca3af 89% 92%,#374151 93%);box-shadow:0 0 0 10px #1f2937,0 0 60px #000a}
#lobby .vault::after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#0000 0 40deg,#e5e7eb88 40deg 46deg,#0000 46deg 90deg)}
#lobby .col{position:absolute;top:0;bottom:34%;width:92px;background:linear-gradient(90deg,#b9b19d,#f3eee0 35%,#d8d0bb 65%,#8f8774);box-shadow:0 0 30px #0009;display:none}
#lobby .col::before,#lobby .col::after{content:'';position:absolute;left:-8px;right:-8px;height:26px;background:linear-gradient(#f3eee0,#a79f8a);border-radius:4px}
#lobby .col::before{top:0}#lobby .col::after{bottom:0}
#lobby .col.l{left:2%}#lobby .col.r{right:2%}
#lobby .lamp{position:absolute;top:0;width:2px;height:7vh;background:#c9a24b}
#lobby .lamp::after{content:'';position:absolute;left:-26px;bottom:-14px;width:54px;height:26px;border-radius:54px 54px 4px 4px;background:linear-gradient(#e8c766,#a8801f);box-shadow:0 22px 60px 26px #ffd98a40}
#lobby .floor{position:absolute;left:-60%;right:-60%;bottom:0;height:66%;transform-origin:50% 100%;transform:perspective(420px) rotateX(58deg);
 background:conic-gradient(#e9e2d0 25%,#2c3a36 0 50%,#e9e2d0 0 75%,#2c3a36 0) 0 0/120px 120px}
#lobby .shade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#0b221dcc,#0b221d55 40%,#0008)}
#lobby .counter{position:absolute;left:0;right:0;bottom:0;height:56px;background:repeating-linear-gradient(90deg,#4a2c17 0 90px,#3a2212 90px 94px);border-top:7px solid #c9a24b;box-shadow:0 -8px 24px #000a}
@media(min-width:1280px){#lobby .col{display:block}}
#app{position:relative;z-index:2;width:100%;max-width:1060px;margin:0 auto;padding:18px 18px 74px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.e{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;filter:drop-shadow(0 4px 4px #0006)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);box-shadow:0 20px 50px #0007,inset 0 1px 0 #fff2}
.screen{display:none}.screen.on{display:block;animation:in .6s cubic-bezier(.2,1.2,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.97)}}
.hud{display:none;align-items:center;gap:14px;padding:10px 16px;margin-bottom:12px;flex-wrap:wrap}
body.playing .hud{display:flex}
.brand{font:800 20px 'Baloo 2';letter-spacing:1px;flex:1}.brand b{color:var(--gold)}
.pill{background:#0004;border:1px solid var(--line);border-radius:30px;padding:6px 16px;font:800 18px 'Baloo 2';display:flex;align-items:center;gap:8px}
#hearts span{font-size:26px;display:inline-block;transition:.4s}#hearts .lost{filter:grayscale(1);opacity:.3;transform:scale(.6)}
.xp{display:none;position:relative;height:22px;border-radius:14px;background:#0005;border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
body.playing .xp{display:block}
#bar{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--pink),var(--gold));transition:width .9s cubic-bezier(.2,1,.3,1);box-shadow:0 0 18px var(--neon)}
#rn{position:absolute;inset:0;display:grid;place-items:center;font:800 13px 'Baloo 2';letter-spacing:1px;text-shadow:0 1px 3px #000}
#start,#end{text-align:center;padding:36px 22px}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:10px;font-size:84px;margin-bottom:6px}
.hero .e:nth-child(1){animation:bob 3s ease-in-out infinite}.hero .e:nth-child(2){font-size:1.5em;animation:bob 3s -1s ease-in-out infinite}.hero .e:nth-child(3){animation:bob 3s -2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
h1{font:800 clamp(46px,9vw,92px)/1 'Baloo 2';background:linear-gradient(180deg,#fff7cc,var(--gold) 50%,#d98a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b3c06) drop-shadow(0 0 26px #ffcc3377)}
.sub{color:#c7cdf5;font-size:18px;margin:14px auto 22px;max-width:560px;line-height:1.55}
.how{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.how div{background:#0004;border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-weight:800;font-size:14px;width:150px}.how .e{display:block;margin:0 auto 6px;font-size:38px}
.btn{background:linear-gradient(#ffe27a,#f5a912);color:#3a2200;border:none;border-radius:20px;padding:14px 34px;font:800 22px 'Baloo 2';cursor:pointer;box-shadow:0 7px 0 #8a5300,0 0 28px #ffcc3355;transition:.12s}
.btn:hover{transform:translateY(2px);box-shadow:0 5px 0 #8a5300,0 0 40px #ffcc3399}.btn:active{transform:translateY(7px);box-shadow:0 0 0}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:0 5px 0 #0005;border:1px solid var(--line);font-size:17px;padding:10px 20px}
.btn.go{background:linear-gradient(#6ee7a0,#16a34a);color:#04200f;box-shadow:0 7px 0 #0c5f2b,0 0 28px #22c55e55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.scene{padding:20px;position:relative}
.cust{display:flex;align-items:flex-end;gap:14px;position:relative}
#cimg{font-size:118px;position:relative;animation:bob 3.4s ease-in-out infinite}#cimg .e{filter:drop-shadow(0 12px 10px #0008)}
#react{position:absolute;top:-10px;left:104px;font-size:46px}#react .e{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
#cname{font:800 14px 'Baloo 2';color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.bubble{background:#fff;color:#1c1b3a;border-radius:20px 20px 20px 4px;padding:14px 16px;margin-top:12px;position:relative;box-shadow:0 8px 0 #0004;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.badge{display:inline-block;background:linear-gradient(90deg,#6d28d9,#db2777);color:#fff;font:800 12px 'Baloo 2';letter-spacing:2px;padding:3px 12px;border-radius:12px;margin-bottom:6px}
#q{font-size:17px;font-weight:700;line-height:1.5}#q b{color:#6d28d9}
.shelf{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.it{background:linear-gradient(#ffffff1c,#ffffff08);border:1px solid var(--line);border-radius:16px;padding:8px 12px 6px;text-align:center;min-width:92px;font-size:44px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.it b{display:block;font:800 17px 'Baloo 2';color:var(--gold);background:#0006;border-radius:8px;margin-top:2px;padding:0 8px}.it i{display:block;font:600 11px Inter;font-style:normal;color:#c7cdf5;margin-top:2px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.work{padding:20px}#inter{min-height:250px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;padding:22px 10px;border-radius:18px;border:2px solid var(--line);background:linear-gradient(#ffffff16,#ffffff06);color:#fff;font:800 22px 'Baloo 2';cursor:pointer;transition:.15s;box-shadow:0 6px 0 #0005;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.opt small{position:absolute;top:6px;left:12px;font-size:12px;opacity:.5}
.opt:hover:not(.lock){transform:translateY(-4px);border-color:var(--neon);box-shadow:0 10px 0 #0005,0 0 24px #22d3ee66}
.opt.lock{pointer-events:none;opacity:.5}.opt.ok{opacity:1;background:#16a34a;border-color:#86efac;animation:ok .5s;box-shadow:0 0 34px #22c55e99}.opt.bad{opacity:1;background:#b91c1c;border-color:#fca5a5;animation:shk .4s}
@keyframes ok{40%{transform:scale(1.1)}}@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.bills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bill{--c:#555;width:122px;height:64px;border-radius:9px;border:2px solid #fff7;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));color:#fff;font:800 20px 'Baloo 2';cursor:pointer;box-shadow:0 6px 0 #0007;position:relative;transition:.12s;text-shadow:0 2px 3px #0008}
.bill::before{content:'';position:absolute;inset:5px;border:1.5px dashed #fff5;border-radius:5px}
.bill:hover:not(:disabled){transform:translateY(-5px) rotate(-2deg)}.bill:active:not(:disabled){transform:scale(.93)}.bill:disabled{opacity:.5}
.till{margin-top:16px;background:#0006;border:2px dashed var(--neon);border-radius:18px;padding:12px;min-height:96px;text-align:center}.till small{font-weight:800;font-size:11px;letter-spacing:1px;color:#c7cdf5}
#tsum{font:800 34px 'Baloo 2';color:var(--neon);text-shadow:0 0 16px var(--neon)}
#tstack{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.mb{background:var(--c);border-radius:6px;padding:3px 9px;font:800 13px 'Baloo 2';border:1px solid #fff6;animation:pop .3s cubic-bezier(.2,1.8,.4,1)}
.cartgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.cartgrid .it{cursor:pointer;transition:.15s;position:relative}.cartgrid .it:hover{transform:translateY(-4px);border-color:var(--neon)}
.cartgrid .it.sel{background:linear-gradient(#22d3ee44,#22d3ee11);border-color:var(--neon);box-shadow:0 0 24px #22d3ee88;transform:translateY(-4px) scale(1.05)}
.cartgrid .it.sel::after{content:'🛒';position:absolute;top:-8px;right:-6px;font-size:20px}
.meter{height:20px;background:#0006;border-radius:12px;margin-top:14px;overflow:hidden;border:1px solid var(--line)}#mt{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#facc15);transition:.3s}#mt.over{background:#ef4444}
#minfo{text-align:center;font:800 17px 'Baloo 2';margin-top:8px}
#exp{display:none;margin-top:16px;background:#0005;border-left:5px solid var(--gold);border-radius:14px;padding:14px 16px;line-height:1.7;font-weight:600;font-size:15px}#exp.on{display:block;animation:in .4s}
.btns{display:flex;gap:12px;justify-content:flex-end;margin-top:16px}
.rank{font:800 38px 'Baloo 2';color:var(--gold);margin:8px 0}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}.stats div{background:#0004;border:1px solid var(--line);border-radius:18px;padding:12px 20px;font:800 24px 'Baloo 2'}.stats small{display:block;font:600 12px Inter;color:#c7cdf5}
#toast{position:fixed;top:-90px;left:50%;transform:translateX(-50%);z-index:60;background:linear-gradient(90deg,#16a34a,#22c55e);padding:12px 28px;border-radius:40px;font:800 22px 'Baloo 2';box-shadow:0 12px 30px #22c55e66;transition:top .5s cubic-bezier(.2,1.5,.4,1)}#toast.on{top:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}#cimg{font-size:90px}#react{left:76px}}

/* Mejora gráfica */
.glass{border:1px solid #c9a24b66;box-shadow:0 24px 60px #000a,inset 0 0 0 5px #0003,inset 0 0 0 6px #c9a24b30,inset 0 1px 0 #fff2;background:linear-gradient(160deg,#0f332b99,#06161299)}
#lobby .lamp::before{content:'';position:absolute;left:-150px;top:30px;width:302px;height:62vh;background:linear-gradient(#ffd98a2e,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
#lobby .wall::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#ffd98a22,transparent 60%),radial-gradient(ellipse at 50% 100%,#0009,transparent 70%)}
.cn{position:absolute;top:-30px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b800 55%,#a87400);box-shadow:inset 0 0 0 2px #ffe27a88;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(108vh) rotateY(720deg)}}
@media(prefers-reduced-motion:reduce){.cn{display:none}}
#cname{background:linear-gradient(#f6dc8a,#b8892b);color:#3a2200;padding:3px 16px;border-radius:6px;border:1px solid #6b4a0a;box-shadow:0 3px 0 #0006;text-shadow:0 1px 0 #fff7;letter-spacing:1px}
#cimg::before{content:'';position:absolute;left:50%;bottom:-8px;width:170px;height:30px;transform:translateX(-50%);background:radial-gradient(#ffd98a88,transparent 70%);z-index:-1}
#bar{background:linear-gradient(90deg,#8a5f12,#f5d56b,#b8892b);box-shadow:0 0 18px #ffd56b99}
.xp{border-color:#c9a24b77}
.pill{background:linear-gradient(#0008,#0005);border-color:#c9a24b66}
.opt{font-size:19px;line-height:1.2;background:linear-gradient(#ffffff20,#ffffff08);border-color:#c9a24b55}
.opt:hover:not(.lock){border-color:var(--gold);box-shadow:0 10px 0 #0005,0 0 24px #ffcc3366}
.it{border-color:#c9a24b44;box-shadow:0 6px 14px #0005}
.bubble{border:2px solid #c9a24b;box-shadow:0 8px 0 #0005}
#exp{border-left-color:var(--gold);background:linear-gradient(90deg,#0007,#0004)}
.bill{box-shadow:0 6px 0 #0007,inset 0 0 22px #ffffff22}
.btn{text-shadow:0 1px 0 #fff6}
</style>
</head>
<body>
<div id="lobby"><div class="wall"></div><div class="vault"></div><div class="col l"></div><div class="col r"></div><div class="lamp" style="left:20%"></div><div class="lamp" style="left:50%"></div><div class="lamp" style="left:80%"></div><div class="wain"></div><div class="floor"></div><div class="shade"></div><div class="counter"></div></div><div id="toast"></div>
<div id="app">
 <div class="hud glass"><div class="brand"><span id="hb"></span> BANCO <b>APRENDIZ</b></div><div class="pill" id="hr"></div><div class="pill"><span id="hc"></span><span id="bal">$0</span></div><div id="hearts"></div></div>
 <div class="xp"><i id="bar"></i><span id="rn"></span></div>

 <section id="start" class="screen glass on">
  <div class="hero" id="hero"></div><h1>EL BANCO</h1>
  <p class="sub">Atendé la caja del banco más moderno de la ciudad. Cada cliente trae un desafío con plata de verdad: vuelto, descuentos, presupuestos y ofertas. ¿Llegás a Gerente?</p>
  <div class="how"><div id="h1"></div><div id="h2"></div><div id="h3"></div></div>
  <button class="btn" onclick="start()">▶ ¡ABRIR LA CAJA!</button>
 </section>

 <section id="game" class="screen"><div class="grid">
  <div class="scene glass">
   <div class="cust"><div id="cimg"></div><div id="react"></div><div id="cname"></div></div>
   <div class="bubble"><span class="badge" id="badge"></span><p id="q"></p></div>
   <div class="shelf" id="items"></div>
  </div>
  <div class="work glass"><div id="inter"></div><div id="exp"></div>
   <div class="btns"><button class="btn ghost" id="undo" onclick="undo()">↶ Deshacer</button><button class="btn go" id="go" onclick="go()">✔ Entregar</button><button class="btn" id="next" onclick="next()">Siguiente ➜</button></div>
  </div>
 </div></section>

 <section id="end" class="screen glass">
  <div class="hero" id="eh"></div><h1 style="font-size:clamp(36px,7vw,64px)">¡FIN DEL TURNO!</h1>
  <div class="rank" id="rank"></div><div class="stats" id="stats"></div>
  <button class="btn" onclick="start()">↻ Jugar otra vez</button>
 </section>
</div>

<script>
const $=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),c=n=>Math.round(n*100)/100;
const $$=n=>'$'+n.toLocaleString('es-AR',{minimumFractionDigits:Number.isInteger(c(n))?0:2,maximumFractionDigits:2});
/* Emojis 3D: repo microsoft/fluentui-emoji (MIT) */
const FB='https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/';
const em=(n,f,k='e')=>`<img class="${k}" src="${FB}${n.replace(/ /g,'%20')}/3D/${n.toLowerCase().replace(/ /g,'_')}_3d.png" alt="${f}" onerror="this.replaceWith(document.createTextNode(this.alt))">`;
const IT=[{n:'cuaderno',p:'cuadernos',f:'Notebook',e:'📓',t:0},{n:'libro',p:'libros',f:'Books',e:'📚',t:0},{n:'hamburguesa',p:'hamburguesas',f:'Hamburger',e:'🍔',t:0},{n:'pizza',p:'pizzas',f:'Pizza',e:'🍕',t:0},{n:'helado',p:'helados',f:'Soft ice cream',e:'🍦',t:0},{n:'alfajor',p:'alfajores',f:'Chocolate bar',e:'🍫',t:0},
 {n:'mochila',p:'mochilas',f:'Backpack',e:'🎒',t:1},{n:'pelota',p:'pelotas',f:'Soccer ball',e:'⚽',t:1},{n:'auricular',p:'auriculares',f:'Headphone',e:'🎧',t:1},{n:'zapatilla',p:'zapatillas',f:'Running shoe',e:'👟',t:2},{n:'videojuego',p:'videojuegos',f:'Video game',e:'🎮',t:2},{n:'celular',p:'celulares',f:'Mobile phone',e:'📱',t:2}];
const CUST=[['Fox','Don Zorro','🦊'],['Robot','Robo-Pepe','🤖'],['Alien','Zorg','👽'],['Lion','Leo','🦁'],['Unicorn','Estrella','🦄'],['Dragon','Draco','🐲'],['Panda','Pandi','🐼'],['Cat face','Michi','🐱']];
const price=it=>[R(10,80),R(100,400),R(500,1500)][it.t]*50,plu=(it,q)=>q>1?it.p:it.n,rup=(t,m)=>Math.ceil((t+.01)/m)*m;
const tag=(it,p,sub)=>`<div class="it">${em(it.f,it.e)}<b>${$$(p)}</b><i>${sub||it.n}</i></div>`;
const row=(it,q,p)=>Array.from({length:Math.min(q,5)},()=>tag(it,p)).join('');
function num(ans,w){const st=Math.max(10,Math.round(ans/200)*10),s=new Set([c(ans)]);w.map(c).forEach(v=>{if(v>0)s.add(v)});let k=1;while(s.size<4){const v=c(ans+st*Math.ceil(k/2)*(k%2?1:-1));if(v>0)s.add(v);k++}
 const a=shuffle([...s].slice(0,4));return{opts:a.map($$),ans:a.indexOf(c(ans))}}
const DEN=[10000,2000,1000,500,200,100,50],COL={10000:'#7c3aed',2000:'#0891b2',1000:'#b45309',500:'#15803d',200:'#c2410c',100:'#9d174d',50:'#1d4ed8'};
const G={
vuelto(d){const it=pick(IT),q=it.t==2?R(1,2):R(1,2+d),p=price(it),t=q*p,pay=rup(t,t<5000?1000:t<30000?5000:10000),a=pay-t;
 return{k:'tray',text:`Un cliente compra <b>${q} ${plu(it,q)}</b> a ${$$(p)} cada uno y te paga con <b>${$$(pay)}</b>. ¡Armá el vuelto exacto con los billetes!`,items:row(it,q,p),target:a,
 exp:`${q} × ${$$(p)} = <b>${$$(t)}</b><br>${$$(pay)} − ${$$(t)} = <b>${$$(a)}</b> de vuelto`}},
descuento(d){const it=pick(IT),p=price(it),pc=pick(d<2?[10,20,25,50]:[15,30,40,60,75]),ds=c(p*pc/100),a=c(p-ds);
 return{k:'mc',text:`Producto: <b>${it.n}</b>, precio ${$$(p)}, con <b>${pc}% de descuento</b>. ¿Cuánto pagás?`,items:tag(it,p,'−'+pc+'%'),...num(a,[ds,p+ds,p-pc,a+p/10]),
 exp:`${pc}% de ${$$(p)} = <b>${$$(ds)}</b> (lo que te ahorrás)<br>${$$(p)} − ${$$(ds)} = <b>${$$(a)}</b>`}},

 $('next').style.display='none';$('go').style.display=Q.k=='mc'?'none':'inline-block';$('undo').style.display=Q.k=='tray'?'inline-block':'none';
 if(Q.k=='mc')$('inter').innerHTML='<div class="opts">'+Q.opts.map((o,i)=>`<button class="opt" style="animation-delay:${i*.08}s" onclick="ans(${i})"><small>${i+1}</small>${o}</button>`).join('')+'</div>';
 else if(Q.k=='tray'){$('inter').innerHTML='<div class="bills">'+DEN.map(v=>`<button class="bill" style="--c:${COL[v]}" onclick="addBill(${v})">${$$(v)}</button>`).join('')+'</div><div class="till"><small>VUELTO QUE ESTÁS ENTREGANDO</small><div id="tsum">$0</div><div id="tstack"></div></div>'}
 else{$('inter').innerHTML='<div class="cartgrid">'+Q.prods.map((o,i)=>`<div class="it" id="p${i}" onclick="tog(${i})">${em(o.it.f,o.it.e)}<b>${$$(o.p)}</b><i>${o.it.n}</i></div>`).join('')+'</div><div class="meter"><i id="mt"></i></div><div id="minfo"></div>';drawCart()}
}
function addBill(v){if(lock)return;tray.push(v);tone(520+v/40,.08,'triangle',.1);drawTray()}
function undo(){if(lock||!tray.length)return;tray.pop();drawTray()}
function drawTray(){$('tsum').textContent=$$(tray.reduce((a,b)=>a+b,0));$('tstack').innerHTML=tray.map(v=>`<span class="mb" style="--c:${COL[v]}">${$$(v)}</span>`).join('')}
function tog(i){if(lock)return;cart.has(i)?cart.delete(i):cart.add(i);tone(cart.has(i)?700:450,.08,'triangle');$('p'+i).classList.toggle('sel');drawCart()}
function drawCart(){const s=[...cart].reduce((a,i)=>a+Q.prods[i].p,0);$('mt').style.width=Math.min(100,s/Q.budget*100)+'%';$('mt').classList.toggle('over',s>Q.budget);$('minfo').innerHTML=`Carrito: ${$$(s)} · ${s>Q.budget?'<span style="color:#f87171">¡Te pasaste!</span>':'Te quedan '+$$(Q.budget-s)}`}
function ans(i){if(lock)return;const b=[...document.querySelectorAll('.opt')];b.forEach(x=>x.classList.add('lock'));b[Q.ans].classList.add('ok');if(i!==Q.ans)b[i].classList.add('bad');finish(i===Q.ans)}
function go(){if(lock)return;let ok;if(Q.k=='tray')ok=tray.reduce((a,b)=>a+b,0)===Q.target;else{const s=[...cart].reduce((a,i)=>a+Q.prods[i].p,0);ok=s<=Q.budget&&cart.size===Q.need}finish(ok)}
function finish(ok){lock=true; document.querySelectorAll('.bill').forEach(b=>b.disabled=true);
 $('react').innerHTML=em(ok?'Partying face':'Face with symbols on mouth',ok?'🥳':'🤬');
 if(ok){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);const g=100*Q.d+Math.min(S.streak,5)*50;S.bal+=g;burst();kaching();toast(`+${$$(g)}${S.streak>2?' 🔥 x'+S.streak:''}`)}
 else{S.lives--;S.streak=0;hearts();buzz();const w=$('inter');w.style.animation='none';void w.offsetWidth;w.style.animation='shk .4s'}
 $('exp').innerHTML=(ok?'✅ <b>¡Excelente!</b>':'💡 <b>Así se resuelve:</b>')+'<br>'+Q.exp;$('exp').className='on';
 const from=S.shown,t0=performance.now();(function tw(t){const k=Math.min(1,(t-t0)/900);S.shown=from+(S.bal-from)*(1-Math.pow(1-k,3));$('bal').textContent=$$(Math.round(S.shown));if(k<1)requestAnimationFrame(tw)})(t0);
 $('go').style.display='none';$('undo').style.display='none';$('next').style.display='inline-block';$('next').textContent=(S.lives<=0||S.r>=14)?'Ver resultado ➜':'Siguiente ➜'}
function next(){S.r++;if(S.lives<=0||S.r>=15)return end();round()}
function end(){const k=S.ok,rk=k>=13?['Gerente General','Crown','👑']:k>=9?['Cajero Experto','Briefcase','💼']:k>=5?['Ahorrista','Pig face','🐷']:['Aprendiz','Seedling','🌱'];
 $('eh').innerHTML=em('Trophy','🏆');$('rank').innerHTML=em(rk[1],rk[2])+' '+rk[0];
 $('stats').innerHTML=`<div>${k}/15<small>Aciertos</small></div><div>${$$(S.bal)}<small>Saldo final</small></div><div>🔥 ${S.best}<small>Mejor racha</small></div>`;
 $('bar').style.width='100%';show('end');if(k>=5){burst(160);setTimeout(()=>burst(120),500);[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.12))}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
document.addEventListener('keydown',e=>{if(!$('game').classList.contains('on'))return;if(/^[1-4]$/.test(e.key)&&Q.k=='mc')ans(e.key-1);else if(e.key==='Enter'){if($('next').style.display==='inline-block')next();else if(Q.k!='mc')go()}});
$('lobby').insertAdjacentHTML('beforeend',Array.from({length:12},()=>`<i class="cn" style="left:${R(2,98)}%;animation-duration:${R(10,20)}s;animation-delay:-${R(0,20)}s;scale:${R(6,12)/10}"></i>`).join(''));
$('hb').innerHTML=em('Bank','🏦');$('hc').innerHTML=em('Coin','🪙');
$('hero').innerHTML=em('Robot','🤖')+em('Bank','🏦')+em('Unicorn','🦄');$('h1').innerHTML=em('Dollar banknote','💵')+'Vuelto con billetes';$('h2').innerHTML=em('Shopping cart','🛒')+'Presupuestos y ofertas';$('h3').innerHTML=em('Fire','🔥')+'¡Rachas = bonus!';
</script>
</body>
</html>
